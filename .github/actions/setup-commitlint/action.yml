name: setup-commitlint
description: >-
  Install the pinned commitlint toolchain (package-lock.json)
  into node_modules. A cache hit restores node_modules and skips only the
  package install; Node setup always runs, because self-hosted runners have
  no Node 20 on PATH by default and a lockfile bump can raise a transitive
  dependency's Node floor above what a stale cache-hit PATH provides.

runs:
  using: composite
  steps:
    - name: Restore the commitlint toolchain
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: commitlint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Set up Node for the commitlint install
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install commitlint from the lockfile
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
