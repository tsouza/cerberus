name: setup-commitlint
description: >-
  Install the pinned commitlint toolchain (package-lock.json)
  into node_modules. Node itself is set up on every run — these self-hosted
  runner pods are ephemeral and do not ship Node preinstalled, so skipping
  setup-node on a cache hit leaves npm/node off PATH entirely. A node_modules
  cache hit only skips the (slow) package install; actions/setup-node@v7 has
  its own fast toolcache hit path, so running it unconditionally is cheap.

runs:
  using: composite
  steps:
    - name: Restore the commitlint toolchain
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: commitlint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Set up Node for the commitlint install
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install commitlint from the lockfile
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
