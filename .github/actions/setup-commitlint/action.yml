name: setup-commitlint
description: >-
  Install the pinned commitlint toolchain (package-lock.json)
  into node_modules. A cache hit restores node_modules and
  skips both the Node download and the package install; the gate scripts run the
  CLI with the node already on PATH (commitlint 19 needs Node >= 18).

runs:
  using: composite
  steps:
    - name: Restore the commitlint toolchain
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: commitlint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Set up Node for the commitlint install
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install commitlint from the lockfile
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
