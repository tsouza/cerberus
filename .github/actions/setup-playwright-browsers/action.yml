name: Setup Playwright browsers (cached)
description: >
  Install the Playwright npm deps, the chromium browser binary, and its OS
  shared-library deps. Caches ~/.cache/ms-playwright and the apt archives for
  those OS deps, both keyed on the EXACT resolved Playwright version, so the
  ~15-min Microsoft-CDN chromium download and the apt fetch are each paid once
  per version (across all shards and all runs) instead of on every shard of
  every run. The apt install additionally retries with backoff.

# Why a composite action: the same install+cache logic runs in three e2e jobs
# (compose-smoke-shard, compose-smoke-shard-info, dashboard-shard). Keeping the
# cache-key derivation in one place means the key can't drift between jobs - a
# correct shared key is the whole point (first shard populates, the rest restore).

inputs:
  working-directory:
    description: Directory containing the Playwright package.json + lockfile.
    required: false
    default: test/e2e/playwright

runs:
  using: composite
  steps:
    # npm deps first: `npx playwright` and the version probe both need the
    # @playwright/test package installed under node_modules.
    - name: Install Playwright npm deps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # npm ci needs a lockfile; fall back to `npm install` if one is ever
        # missing (keeps the action robust if the lockfile is removed).
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install --no-audit --no-fund
        fi

    # Resolve the EXACT browser-pinned version from playwright-core in the
    # lockfile (NOT the `^1.50.0` range in package.json - that would let two
    # runs at different resolved versions share a key and restore stale
    # browsers). playwright-core is what actually pins the bundled chromium
    # build; @playwright/test tracks it lockstep. Reading the lockfile (not
    # `npx playwright --version`) keeps the key derivable without the binary.
    - name: Resolve Playwright version
      id: pw
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        version="$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")"
        if [ -z "$version" ] || [ "$version" = "undefined" ]; then
          echo "::error::could not resolve playwright-core version from package-lock.json"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Resolved Playwright version: $version"

    # Cache the browser binaries, NOT node_modules - chromium is the 15-min
    # download; node_modules is seconds. Key is version-only (+ OS), so:
    #   * every shard in a run shares ONE key  -> first miss populates, rest hit
    #   * every run at the same version hits    -> steady-state download = 0
    #   * a Playwright bump changes the version -> key changes -> one fresh pull
    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ steps.pw.outputs.version }}

    # Cache the downloaded .deb packages apt fetches for chromium's OS
    # shared-library deps, keyed the same as the browser cache (Playwright
    # version tracks the required package set closely enough to be a useful
    # proxy key). This never risks installing a stale/wrong package: apt
    # verifies every cached .deb against the current Packages index checksum
    # before using it and silently re-downloads on a mismatch, so a runner
    # image bump just falls back to a normal fetch rather than corrupting
    # anything - a cache miss here costs nothing beyond what today already
    # pays.
    - name: Cache apt archives for chromium OS deps
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives/*.deb
        key: playwright-chromium-apt-${{ runner.os }}-${{ steps.pw.outputs.version }}

    # apt's defaults are patient with a degraded mirror (long per-request
    # timeout, several internal retries per source) - fine when the mirror is
    # merely slow, but it means a genuinely stuck mirror (observed:
    # azure.archive.ubuntu.com repeatedly `Ign:`-ing every package) can
    # consume an entire attempt's timeout budget below without ever reaching
    # the working archive.ubuntu.com fallback the same apt run already falls
    # back to for other sources. Shortening both makes a bad source fail over
    # faster instead of eating the attempt; system-wide apt.conf.d applies to
    # apt-get however it's invoked, including from inside `npx playwright
    # install-deps`, which does not expose its own apt flags to set this on
    # its command line directly.
    - name: Fail over from a stalled apt mirror faster
      shell: bash
      run: |
        echo 'Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99-ci-fast-mirror-failover >/dev/null

        # The shortened timeout above still pays a per-package retry-then-
        # fallback cost against azure.archive.ubuntu.com (the runner's
        # default regional mirror) for every one of chromium's dependency
        # packages individually - with a genuinely dead mirror and dozens of
        # packages, that cost compounds past even a shortened attempt budget
        # (observed directly: two dashboard-lane shards still hit the full
        # retry budget with the timeout fix alone). GitHub-hosted Ubuntu
        # runners resolve `mirror://mirrors.ubuntu.com/mirrors.txt`-style
        # sources through a local mirror list file; strip the known-bad host
        # from it so apt never attempts it at all, rather than attempting and
        # failing over on every package. Best-effort and fail-open: if the
        # file does not exist or the runner image changes its mirror
        # mechanism, this is a silent no-op and apt falls back to its normal
        # (slower but working) failover path instead of erroring the job.
        sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true

    # Cache HIT: browser binaries are already restored; only install the OS
    # shared-library deps. Cache MISS: download chromium AND install OS deps.
    # Both apt-touching branches retry with backoff under a per-attempt
    # `timeout` - the Ubuntu package mirror this runner talks to
    # (azure.archive.ubuntu.com, falling back to archive.ubuntu.com)
    # occasionally STALLS rather than failing outright (observed: apt sitting
    # on `Ign:` lines with no exit for 20+ minutes), so retrying only on a
    # nonzero exit is not enough - a hung attempt has to be killed by a
    # deadline before the loop can retry it, or it just burns the whole job's
    # time budget on one stuck attempt (the same failure shape `go mod
    # download` guards against with an identical attempt-loop, though that
    # one relies on the download command's own retry/failure behavior rather
    # than needing an explicit `timeout` - `go mod download` does not hang
    # silently the way this apt stall did).
    - name: Install chromium (deps only on hit, browser + deps on miss)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # attempt_timeout_secs bounds a single attempt; retries is how many
        # attempts install_with_retry makes before giving up. Deps-only is a
        # local apt op (small package set) so a stuck attempt is killed
        # quickly and retried more times; the miss path also downloads the
        # CDN-hosted chromium binary the browser cache normally avoids
        # entirely, so each attempt gets more room but fewer retries - both
        # bound worst case to well under a typical 30m job timeout.
        # `timeout` only signals the direct child (npx) it spawns, not the
        # apt-get grandchild npx shells out to - a killed attempt can leave
        # that apt-get running as an orphan, still holding /var/lib/apt's
        # locks, so the very next attempt fails instantly with "Could not
        # get lock" instead of getting a clean retry (observed on a real
        # run). Force-clear that state before every retry: kill any
        # surviving apt/dpkg processes, drop the lock files they hold, and
        # let dpkg finish configuring whatever the killed attempt left
        # half-installed. Safe to run even when nothing needs cleaning - a
        # command failure that was NOT an apt lock issue just gets retried
        # as it would have anyway.
        clean_apt_state() {
          sudo pkill -9 -f 'apt-get|/usr/lib/apt/methods' >/dev/null 2>&1 || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
            /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
          sudo dpkg --configure -a >/dev/null 2>&1 || true
        }

        install_with_retry() {
          local attempt_timeout_secs="$1" retries="$2"
          shift 2
          for attempt in $(seq 1 "$retries"); do
            if timeout "$attempt_timeout_secs" "$@"; then
              return 0
            fi
            if [ "$attempt" = "$retries" ]; then
              echo "$* timed out or failed after $retries attempts" >&2
              return 1
            fi
            echo "$* attempt $attempt timed out or failed (${attempt_timeout_secs}s budget), retrying after backoff" >&2
            clean_apt_state
            sleep $(( attempt * 10 ))
          done
        }

        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "Playwright browser cache hit - installing OS deps only."
          install_with_retry 240 3 npx playwright install-deps chromium
        else
          # 1200s (20m) per attempt because the CDN chromium download this
          # branch also does is itself normally ~15m (see this action's
          # description) - a shorter attempt timeout would kill a slow-but-
          # healthy first-ever download, not just a genuine hang. This path
          # only runs right after a Playwright version bump (the apt/browser
          # caches are shared across every shard and run at a given version),
          # so it is rare enough that a generous worst case here is fine.
          echo "Playwright browser cache miss - downloading chromium + OS deps."
          install_with_retry 1200 2 npx playwright install --with-deps chromium
        fi
