self-hosted-runner:
  # cirunners' k3d cluster (../cirunners in this host's workspace) registers
  # runners against tsouza/cerberus carrying one of these labels, in addition
  # to the runner's own `self-hosted`/`Linux`/`X64` labels — see
  # cirunners/manifests/cerberus-runner.yaml (light pool, label `cerberus`)
  # and cirunners/manifests/cerberus-heavy-runner.yaml (dedicated pool for
  # check-test/check-build/lint, label `cerberus-heavy`, #3677).
  labels:
    - cerberus
    - cerberus-heavy
