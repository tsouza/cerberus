self-hosted-runner:
  # Ubicloud runner labels (https://www.ubicloud.com/docs/github-actions-integration/runner-types).
  # actionlint knows only GitHub-hosted labels, so every Ubicloud label a
  # workflow's `runs-on:` names is declared here. Each plain
  # `ubicloud-standard-N` label is an N-vCPU x64 Ubuntu 24.04 runner, the
  # same image generation as GitHub's `ubuntu-latest`.
  labels:
    - ubicloud-standard-2
    - ubicloud-standard-4
    - ubicloud-standard-8
