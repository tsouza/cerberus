name: pr-hygiene

# Cheap, fast PR-metadata gates that the heavy ci.yml jobs don't cover.
#
# `pr-body` is a REQUIRED status check, so it has to post on every surface
# branch protection asks it about, not just on the pull request:
#
#   - `pull_request` — the description lives in the event payload. `edited` is
#     included so fixing it re-runs the gate and clears it without a new commit.
#   - `merge_group` — a queue entry waits for every required context on the
#     projected trunk; a workflow that never posts there stalls the queue in
#     silence rather than failing it.
#   - `push` to `main` and to a maintenance line — release.yml's preflight
#     requires this check-run to exist on the commit being shipped, and on the
#     maintenance path there is no pull request and therefore no branch
#     protection, leaving that preflight as the only gate.
#
# Off the pull_request path the description is resolved from the pull request
# associated with the head commit, which needs `pull-requests: read`.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
  push:
    branches: [main, 'release/*.x']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-hygiene-${{ github.ref }}
  # Never true on `merge_group`: GitHub reads a cancelled check-run as a failed
  # one, so a cancelled queue run would dequeue the pull request it was
  # validating.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependabot builds its titles from the dependency, both versions, the
  # directory and the group name, and nothing bounds their length, so a title
  # can put the squash subject `pr-body` lints over `header-max-length`
  # (#3647). This job shortens such a title before `pr-body` reads it; the
  # rewrite rule is in dependabot-pr-title.mjs.
  #
  # It runs here, ahead of `pr-body` in the same run, because nothing else can
  # get the repaired title linted: an edit made with GITHUB_TOKEN starts no
  # workflow run that proceeds without a manual approval, and a
  # Dependabot-triggered run sees no Actions secrets, so no personal token is
  # available for an edit that would.
  #
  # `pull-requests: write` is granted to this job alone, which runs only for
  # Dependabot's own pull requests. It checks out the BASE commit's scripts,
  # without persisted credentials, so the code holding the write token is
  # never the pull request's. The title is read from the REST API inside the
  # script and never interpolated into a shell line.
  dependabot-title:
    name: dependabot title
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: [self-hosted, cerberus]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Shorten a title whose landing subject is over the limit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/dependabot-pr-title.mjs

  pr-body:
    name: pr-body
    # Waits for the title repair so it lints the repaired title. `!cancelled()`
    # keeps this required check running when that job is skipped (every
    # non-Dependabot pull request and every other event) or fails: a failed
    # repair must leave `pr-body` red on the original title, never skipped.
    needs: dependabot-title
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, cerberus]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Pin the gate logic
        run: node .github/scripts/pr-body-check.mjs --self-test

      - name: Guard the gate logic
        run: |
          node --test .github/scripts/pr-body-check.test.mjs
          node --test .github/scripts/pr-hygiene-metadata.test.mjs

      # Reject an empty / stub PR description (the `--body 'cat'` incident).
      # PR_BODY is attacker-controlled, so it is passed via env and read by the
      # script — never interpolated into a shell `run:` line. It is empty off
      # the pull_request path, where the script resolves the description from
      # the head commit's associated pull request instead.
      - name: Reject empty / stub PR descriptions
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/pr-body-check.mjs

      # ---- the squash subject (#3187) ----
      # commitlint (ci.yml's `lint` job) reads the PR's COMMIT MESSAGES, which a
      # squash merge discards. What GitHub writes onto `main` instead is the PR
      # TITLE — this repository's `squash_merge_commit_title` is
      # COMMIT_OR_PR_TITLE — and nothing had ever linted that. It is how subjects
      # with a type outside `type-enum` and 119 subjects over the 100-character
      # `header-max-length` reached `main` through a green `lint`.
      #
      # This lives HERE rather than beside commitlint in ci.yml for one concrete
      # reason: this workflow declares `types: [… edited …]`, so correcting a
      # title re-runs the gate and clears it. ci.yml's bare `pull_request:` has
      # no `edited`, so a title-only violation there would be a red REQUIRED
      # check that no code change could clear.
      #
      # pull_request only: a title exists only on that event. The merge_group
      # and push paths carry the same required context, and by the time a commit
      # reaches them its subject was already gated on the pull request.
      #
      # The toolchain comes from package-lock.json through a
      # cache: a warm run downloads neither Node nor a single npm package, so
      # this 5-minute job no longer spends its budget on an install.
      - name: Set up commitlint
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-commitlint

      - name: Guard the squash-subject gate logic
        if: github.event_name == 'pull_request'
        run: |
          node --test .github/scripts/commitlint-pr-title.test.mjs
          node --test .github/scripts/dependabot-pr-title.test.mjs
          node --test .github/scripts/commitlint-toolchain.test.mjs

      # PR_TITLE is attacker-controlled, so it is passed via env and read by the
      # script — never interpolated into a shell `run:` line, exactly as PR_BODY
      # is above.
      - name: Lint the subject this PR would squash onto main
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/commitlint-pr-title.mjs

      # cerberus#2739: prepare-release.mjs generates CHANGELOG.md's new
      # `[vX.Y.Z]` section exactly ONCE, at release-PR-creation time. A commit
      # landing on the release branch afterward (a hotfix pushed directly, or
      # a `main` merge) falls out of it silently — this job already re-runs on
      # `synchronize`, i.e. every such push, so it is the natural place to
      # catch it. Gated to a `release/` head branch only: an ordinary PR's
      # CHANGELOG.md has no per-commit contract (only regenerated at release
      # time — see editChangelog's own "Always-generated policy" comment), so
      # running this off a release branch would fail on every routine commit.
      - name: Pin the freshness-gate logic
        if: startsWith(github.head_ref, 'release/')
        run: node --test .github/scripts/verify-changelog-fresh.test.mjs

      # verify-changelog-fresh.mjs imports its changelog helpers from
      # prepare-release.mjs (cerberus#2739), which also imports
      # lib/helm-docs.mjs's shared-policy image acquisition for an unrelated
      # caller (#3100) — assert-image-jobs-authenticate.mjs follows every
      # relative import rather than only the one a given caller actually
      # uses (deliberately, to avoid under-approximating a real anonymous
      # pull elsewhere), so this job reads as an image acquirer even though
      # this step never runs `renderHelmDocs()`. A GHCR login costs nothing
      # real here and satisfies the gate the same way every other job in
      # this repo does.
      - name: Log in to GHCR
        if: startsWith(github.head_ref, 'release/')
        env:
          REGISTRY: ghcr.io
          USERNAME: ${{ github.repository_owner }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/registry-login.mjs

      - name: CHANGELOG.md accounts for every commit since the last tag
        if: startsWith(github.head_ref, 'release/')
        run: node .github/scripts/verify-changelog-fresh.mjs
