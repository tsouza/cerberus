name: pr-hygiene

# Cheap, fast PR-metadata gates that the heavy ci.yml jobs don't cover.
#
# `pr-body` is a REQUIRED status check, so it has to post on every surface
# branch protection asks it about, not just on the pull request:
#
#   - `pull_request` — the description lives in the event payload. `edited` is
#     included so fixing it re-runs the gate and clears it without a new commit.
#   - `merge_group` — a queue entry waits for every required context on the
#     projected trunk; a workflow that never posts there stalls the queue in
#     silence rather than failing it.
#   - `push` to `main` and to a maintenance line — release.yml's preflight
#     requires this check-run to exist on the commit being shipped, and on the
#     maintenance path there is no pull request and therefore no branch
#     protection, leaving that preflight as the only gate.
#
# Off the pull_request path the description is resolved from the pull request
# associated with the head commit, which needs `pull-requests: read`.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
  push:
    branches: [main, 'release/*.x']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-hygiene-${{ github.ref }}
  # Never true on `merge_group`: GitHub reads a cancelled check-run as a failed
  # one, so a cancelled queue run would dequeue the pull request it was
  # validating.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Pin the gate logic
        run: node .github/scripts/pr-body-check.mjs --self-test

      - name: Guard the gate logic
        run: node --test .github/scripts/pr-body-check.test.mjs

      # Reject an empty / stub PR description (the `--body 'cat'` incident).
      # PR_BODY is attacker-controlled, so it is passed via env and read by the
      # script — never interpolated into a shell `run:` line. It is empty off
      # the pull_request path, where the script resolves the description from
      # the head commit's associated pull request instead.
      - name: Reject empty / stub PR descriptions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/pr-body-check.mjs

      # cerberus#2739: prepare-release.mjs generates CHANGELOG.md's new
      # `[vX.Y.Z]` section exactly ONCE, at release-PR-creation time. A commit
      # landing on the release branch afterward (a hotfix pushed directly, or
      # a `main` merge) falls out of it silently — this job already re-runs on
      # `synchronize`, i.e. every such push, so it is the natural place to
      # catch it. Gated to a `release/` head branch only: an ordinary PR's
      # CHANGELOG.md has no per-commit contract (only regenerated at release
      # time — see editChangelog's own "Always-generated policy" comment), so
      # running this off a release branch would fail on every routine commit.
      - name: Pin the freshness-gate logic
        if: startsWith(github.head_ref, 'release/')
        run: node --test .github/scripts/verify-changelog-fresh.test.mjs

      - name: CHANGELOG.md accounts for every commit since the last tag
        if: startsWith(github.head_ref, 'release/')
        run: node .github/scripts/verify-changelog-fresh.mjs
