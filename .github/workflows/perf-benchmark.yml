name: perf-benchmark

# Weekly perf-regression sweep. Runs `go test -bench=.` against a baseline
# (origin/main, or HEAD~1 when the trigger ref already *is* main) and
# against the trigger ref, then diffs the two with benchstat. Both raw
# outputs and the benchstat diff are uploaded as artifacts; the diff is
# also surfaced as a job summary.
#
# Statistical rigor: benchstat requires n >= 6 samples to compute a
# confidence interval at α=0.05, so each side runs `-count=6`. The
# previous `-benchtime=10x -count=1` shape produced rows annotated with
# "need >= 6 samples" and p=1.000 — pure noise. `-benchtime=1s` lets the
# Go test runner auto-scale b.N to amortise setup over many iterations
# (critical for the sub-µs PromQL/LogQL lower benches). `-cpu=1` pins
# GOMAXPROCS=1 to avoid the multi-core sampling cost.
#
# This lane is INFORMATIONAL by design (benchstat deltas, runner-variance
# prone) and never gates. The deterministic perf-regression ASSERTIONS —
# the metrics ORDER BY granule-prune ratio floor and the /series
# round-trip baseline — live in the `perf-guards` job of chdb.yml and DO
# gate (as a release-gate lane, #2230). Keep wall-clock here; keep
# structural assertions there.
#
# RELEASE-gate cost posture (#2230): the `pull_request:` trigger below stays
# path-filtered to the hot benchmark packages, but even a matching PR now
# short-circuits to a no-op — the real baseline-vs-ref benchstat run happens
# only on the weekly `schedule` and on manual `workflow_dispatch`, mirroring
# every other demoted lane's RUN_HEAVY split.

on:
  pull_request:
    branches: [main]
    paths:
      # Hot paths whose changes can plausibly move benchmarks.
      - 'internal/promql/**'
      - 'internal/logql/**'
      - 'internal/traceql/**'
      - 'internal/chplan/**'
      - 'internal/chsql/**'
      - 'internal/solver/**'
      - 'internal/optimizer/**'
      - 'internal/chclient/**'
      - 'internal/api/format/**'
      - 'internal/api/prom/**'
      - '.github/workflows/perf-benchmark.yml'
  schedule:
    # Sunday 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: >-
          Git ref to use as the benchmark baseline. Leave blank to auto-pick:
          origin/main when the trigger ref is a branch, HEAD~1 when the
          trigger ref already is main (avoids the same-vs-same diff).
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # The weekly run is replaceable only while bound to main. PR measurements and
  # explicit manual qualification always receive a unique run-id group.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'latest-main-push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') && format('latest-main-schedule-{0}', github.event.schedule) || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') }}

jobs:
  bench:
    name: benchstat diff (baseline vs ref)
    runs-on: ubuntu-latest
    # RUN_HEAVY gates the real work (#2230): true on schedule / dispatch, false
    # on a pull_request (even one the path filter matched). There is no `push:`
    # trigger on this lane and no release-branch carve-out is needed — the
    # nightly-scale weekly schedule and manual dispatch are the only ways this
    # ever ran the full baseline-vs-ref benchstat pass, and that is unchanged.
    env:
      RUN_HEAVY: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - if: env.RUN_HEAVY == 'true'
        uses: ./.github/actions/setup-go

      - name: install benchstat
        if: env.RUN_HEAVY == 'true'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # Baseline/ref selection: explicit input wins; else if the trigger
      # ref already resolves to origin/main (dispatch-from-main or the
      # weekly schedule) compare against the parent commit so the diff
      # isn't a trivial same-vs-same; else baseline = origin/main. Same-
      # vs-same is a hard ::error::. Logic lives in resolve-bench-refs.mjs,
      # which writes ref_sha / baseline_sha / baseline_ref to $GITHUB_OUTPUT.
      - name: resolve baseline + ref SHAs
        id: refs
        if: env.RUN_HEAVY == 'true'
        env:
          INPUT_BASELINE_REF: ${{ inputs.baseline_ref }}
        run: node .github/scripts/resolve-bench-refs.mjs

      - name: bench against baseline
        if: env.RUN_HEAVY == 'true'
        env:
          BASELINE_SHA: ${{ steps.refs.outputs.baseline_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${BASELINE_SHA}"
          # -count=6   minimum samples for benchstat α=0.05 (n>=6 -> Mann-Whitney).
          # -benchtime=1s  auto-scale b.N so sub-µs benchmarks aren't dominated by setup.
          # -cpu=1   pin GOMAXPROCS=1; multi-core sampling adds variance for these single-goroutine benches.
          go test -bench=. -benchmem -benchtime=1s -count=6 -cpu=1 -run='^$' ./... \
            | tee baseline.bench

      - name: bench against trigger ref
        if: env.RUN_HEAVY == 'true'
        env:
          REF_SHA: ${{ steps.refs.outputs.ref_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${REF_SHA}"
          go test -bench=. -benchmem -benchtime=1s -count=6 -cpu=1 -run='^$' ./... \
            | tee ref.bench

      - name: no-op (ordinary PR)
        if: env.RUN_HEAVY != 'true'
        run: echo "benchstat diff is a no-op on pull requests; the real baseline-vs-ref run happens on the weekly schedule and on manual dispatch (#2230)."

      - name: benchstat diff
        if: env.RUN_HEAVY == 'true'
        run: benchstat baseline.bench ref.bench | tee benchstat.txt

      - name: write job summary
        if: always() && env.RUN_HEAVY == 'true'
        env:
          BASELINE_REF: ${{ steps.refs.outputs.baseline_ref }}
          BASELINE_SHA: ${{ steps.refs.outputs.baseline_sha }}
          REF_SHA: ${{ steps.refs.outputs.ref_sha }}
        run: |
          set -euo pipefail
          {
            echo "## perf-benchmark"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| baseline ref | \`${BASELINE_REF}\` |"
            echo "| baseline SHA | \`${BASELINE_SHA}\` |"
            echo "| trigger SHA | \`${REF_SHA}\` |"
            echo "| samples per benchmark | 6 |"
            echo "| benchtime | 1s |"
            echo "| GOMAXPROCS | 1 |"
            echo
            if [[ -s benchstat.txt ]]; then
              echo "### benchstat baseline.bench ref.bench"
              echo
              echo '```'
              cat benchstat.txt
              echo '```'
            else
              echo "_benchstat.txt is empty — see job logs for failures._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload bench artifacts
        if: always() && env.RUN_HEAVY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmark
          path: |
            baseline.bench
            ref.bench
            benchstat.txt
          if-no-files-found: warn
          retention-days: 30
