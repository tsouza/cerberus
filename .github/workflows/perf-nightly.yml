name: perf-nightly

# The #2370 nightly, real-data measurement + regression gate: loads the
# real, trimmed production sample (test/perf/nightly/testdata/samples/*.parquet)
# into a real ClickHouse and asserts a curated PromQL sentinel corpus's
# max-of-5 peak memory (and expected HTTP outcome) against a committed
# baseline (test/perf/nightly-baseline.json) plus an absolute cap-relative
# ceiling. See test/perf/nightly/realch_perfnightly_integration_test.go's
# doc comment for the full "why" and gate mechanics.
#
# The sentinels run once per ClickHouse server of the matrix below, each leg
# against the bound set calibrated on its own server. The servers are the
# supported floor (versions.yaml min_clickhouse), the deployment pin
# (quickstart_clickhouse) and one server inside chopt's move_to_prewhere auto
# range: auto leaves the PREWHERE split to ClickHouse only inside that range,
# so the two PREWHERE paths are each measured. clickhouse-version-sync.mjs
# (check h) holds the matrix to those pins and to the bound sets in
# nightly-baseline.json.
#
# There is deliberately NO `pull_request:` trigger — same posture and same
# reasoning as migration-e2e.yml: this workflow can never become a
# branch-protection (merge-gate) check, only a RELEASE-gate one
# (release.yml's RELEASE_REQUIRED_CHECKS), so it never adds latency or cost
# to an ordinary PR. `push: branches: [main, 'release/*.x']` exists so the
# maintenance publish path (a direct push to a release/*.x line, no PR)
# still gets a real check-run for release.yml's preflight to wait on —
# without it, a required check named in RELEASE_REQUIRED_CHECKS but never
# posting there blocks every maintenance release forever.

on:
  push:
    branches: [main, 'release/*.x']
  schedule:
    # 05:17 UTC — offset from perf-profile.yml's 05:00 nightly cron.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      calibrate:
        description: >-
          Recalibrate instead of gating: each leg runs `just
          update-nightly-perf-baseline` on its server and uploads the rewritten
          nightly-baseline.json as the artifact nightly-baseline-<clickhouse>.
        type: boolean
        default: false
      calibrate_sentinels:
        description: Space-separated sentinel names to recalibrate (empty recalibrates every sentinel).
        type: string
        default: ''

concurrency:
  # Main pushes and matching cron schedules replace only their own modes.
  # A release/*.x push or a manual dispatch uses a unique run-id group and
  # can neither queue behind nor cancel source work. See
  # main-coalescing.mjs (this workflow is enrolled in COALESCED_WORKFLOWS).
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'latest-main-push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') && format('latest-main-schedule-{0}', github.event.schedule) || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') }}

permissions:
  contents: read
  # Same reason strict-scan.yml needs it: pulling this project's mirrored
  # copy of the ClickHouse image out of ghcr.io (private package).
  packages: read

jobs:
  perf-nightly-sentinels:
    name: perf-nightly-sentinels (${{ matrix.clickhouse }})
    runs-on: ubuntu-latest
    strategy:
      # One server's failure must not cancel the others into an ambiguous
      # `cancelled`: every server's verdict is reported.
      fail-fast: false
      matrix:
        clickhouse: ['24.8', '25.9', '26.6']
    # Pulls one ClickHouse image, loads ~4.3M real rows across 3 tables plus
    # the exporter-keyed copies, and issues the sentinel corpus five times.
    timeout-minutes: 30
    env:
      # The image the leg boots: the alpine tag of its release line, the form
      # every real-ClickHouse lane pins (just/common.just).
      PERF_NIGHTLY_CH_IMAGE: clickhouse/clickhouse-server:${{ matrix.clickhouse }}-alpine
      # Read by results.go's writeResultsJSON (the test step) and by
      # perf-nightly-step-summary.mjs (the summary step below) — same
      # variable name, same literal value, so the two steps can never point
      # at different files. A plain literal (not a `${{ runner.temp }}`
      # expression: job-level `env:` does not have the `runner` context
      # available) under /tmp — a per-run scratch path on the ephemeral
      # `ubuntu-latest` runner, never committed to the checkout.
      PERF_NIGHTLY_RESULTS_JSON: /tmp/perf-nightly-results.json
    steps:
      - uses: actions/checkout@v7
        with:
          # The trimmed sample parquet files are LFS-tracked; a plain
          # checkout only pulls the LFS pointer text, never the actual
          # bytes. The sentinels and the replays below load them, so the
          # fetch is explicit here rather than a repo-wide `lfs: true` on
          # every checkout.
          lfs: true

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: just@1.46.0
      - uses: ./.github/actions/registry-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          docker-hub-pat: ${{ secrets.DOCKER_HUB_PAT }}

      - name: "Run the #2370 nightly sentinels on ClickHouse ${{ matrix.clickhouse }}"
        if: ${{ !inputs.calibrate }}
        run: just perf-nightly-integration "$PERF_NIGHTLY_CH_IMAGE"

      - name: Recalibrate the bound set of ClickHouse ${{ matrix.clickhouse }}
        if: ${{ inputs.calibrate }}
        env:
          CALIBRATE_SENTINELS: ${{ inputs.calibrate_sentinels }}
        # Each space-separated name is its own recipe argument.
        run: |
          read -ra sentinels <<< "$CALIBRATE_SENTINELS"
          just update-nightly-perf-baseline "$PERF_NIGHTLY_CH_IMAGE" "${sentinels[@]}"

      - name: Upload the recalibrated baseline
        if: ${{ inputs.calibrate }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-baseline-${{ matrix.clickhouse }}
          path: test/perf/nightly-baseline.json
          if-no-files-found: error

      # Renders the per-sentinel verdict as a clear table in the job's
      # Summary tab BEFORE the raw log — see perf-nightly-step-summary.mjs's
      # own doc comment for why this exists (a wall of raw WARN log lines
      # with no synthesis at the top makes an intentionally-rejected
      # sentinel indistinguishable from a real regression at a glance).
      # `if: always()` so a verdict table (and, on a real failure, the
      # specific reason) still renders even when the test step above
      # failed — that is exactly the case a clear summary matters most for.
      - name: Render the nightly verdict summary
        if: always()
        run: node .github/scripts/perf-nightly-step-summary.mjs

  # The real-data replays that pin their own ClickHouse servers rather than a
  # matrix leg's, so they run once, beside the sentinel legs.
  perf-nightly-replays:
    name: perf-nightly-replays
    # A recalibration dispatch measures the sentinels only.
    if: ${{ !inputs.calibrate }}
    runs-on: ubuntu-latest
    # The ts_grid_instant measurement's dedicated server and real-data load,
    # plus the classic-histogram production-report replay (its recipe's own
    # go test timeout is 40 minutes).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Both replays load the LFS-tracked samples; see the sentinel legs.
          lfs: true

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: just@1.46.0
      - uses: ./.github/actions/registry-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          docker-hub-pat: ${{ secrets.DOCKER_HUB_PAT }}

      # The ts_grid_instant real-data memory measurement (#2748): reuses
      # this package's own real, trimmed production sample
      # (testdata/samples/svc_http_requests_total.parquet) in a dedicated
      # ClickHouse container (>= the 26.5 ts_grid_instant floor), issuing the
      # SAME instant `rate(m[1d])` query once through the fan-out
      # (emitWindowedArrayExtrapolated's per-series groupArray) and once
      # through the instant native lowering
      # (chplan.RangeWindowGridNativeInstant, a degenerate one-point grid),
      # and reading real peak memory_usage back from system.query_log for
      # both — the actual, measured memory win this feature exists to
      # deliver, not a synthetic estimate. See
      # realch_ts_grid_instant_memory_integration_test.go.
      - name: "Run the ts_grid_instant real-data memory measurement (real ClickHouse)"
        run: just ts-grid-instant-memory-integration

      - name: Run classic-histogram production-report replay
        run: just histogram-report-lfs-integration

  # The perf-nightly context release.yml's preflight waits on: green only
  # when every sentinel leg and the replays succeeded. It also reports each
  # leg's wall time. See perf-nightly-aggregate.mjs.
  perf-nightly:
    name: perf-nightly
    needs: [perf-nightly-sentinels, perf-nightly-replays]
    # Bare `always()`: this context reports on every run, so a failed,
    # cancelled or skipped leg fails it rather than leaving it unposted.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow-level block — contents: read
    # for checkout, actions: read to list this run's jobs for the wall times.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: gate on every leg and report their wall times
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SENTINELS_RESULT: ${{ needs.perf-nightly-sentinels.result }}
          REPLAYS_RESULT: ${{ needs.perf-nightly-replays.result }}
          CALIBRATE: ${{ inputs.calibrate && 'true' || 'false' }}
        run: node .github/scripts/perf-nightly-aggregate.mjs

  # Files/refreshes a single tracking issue when the SCHEDULE run does not
  # reach a clean pass, closes it on the next clean night. Same mechanism
  # e2e.yml's nightly-health-notify job uses (notify-nightly-failure.mjs,
  # #1861) via the shared lib/nightly-health-notify.mjs — see
  # notify-perf-nightly-failure.mjs's own header for the fuller "why".
  #
  # Scoped to `github.event_name == 'schedule'` only: a push-triggered run
  # (main / release/*.x) already has a visible required check-run for
  # release.yml's preflight to react to, and workflow_dispatch is a manual,
  # already-attended action — the silent-red gap this exists to close is
  # specifically the unattended cron trigger.
  perf-nightly-health-notify:
    name: perf-nightly-health-notify
    needs: [perf-nightly]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow-level block (see e2e.yml's
    # nightly-health-notify for the same note) — contents: read has to be
    # restated for checkout, and issues: write is what lets this
    # file/comment/close the tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: roll up the nightly run and notify on non-success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT_PERF_NIGHTLY: ${{ needs.perf-nightly.result }}
        run: node .github/scripts/notify-perf-nightly-failure.mjs
