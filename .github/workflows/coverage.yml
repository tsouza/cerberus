name: coverage

# Coverage floor workflow. Runs `just coverage` to produce a merged coverage
# profile (default-tag + chdb-tagged lanes), uploads the cover-merged.out
# artifact, and — via .github/scripts/coverage-summary.mjs, which `just
# coverage` invokes — writes the per-package summary into the step summary and
# holds every package to its floor in test/coverage-floor.json.
#
# The floor is what makes this a gate. The lane used to print a table nothing
# compared against, so coverage could rot one package at a time with every run
# still green; the script fails on a package below its floor, a package with no
# floor, and a floor with no package. Raise the floors with
# `just update-coverage-floor` — it ratchets up only, so a drop has to be a
# hand-edited, reviewable line in the diff.
#
# Informational on push/nightly, but ALSO a parity lane on the
# publish-on-merge release flow: it runs on EVERY pull_request so it can be a
# required status check, short-circuiting to a green no-op on a non-release PR
# and doing the real `just coverage` work only on a `release/*` PR (so a
# release PR's green status actually includes coverage). Mirrors chart-ci.yml's
# changes-filter no-op pattern, keyed on the release branch instead.
#
# Triggers: pull_request + push-to-main + nightly + manual dispatch.

on:
  pull_request:
  # `coverage` is a required context and must post on the projected trunk.
  merge_group:
  push:
    # `release/*.x` so `coverage` also runs on a maintenance-line hotfix push —
    # release.yml's preflight is the only gate on that path (no PR, so no
    # branch protection) and it requires this check-run to exist.
    branches: [main, 'release/*.x']
  schedule:
    # nightly at 05:30 UTC (45 min after compatibility.yml at 04:00 UTC
    # so the runner doesn't double-book; well clear of the chdb job).
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # RUN_HEAVY gates the real work: true on push / schedule / dispatch, and on
    # a release PR (head branch release/*). On a regular PR every heavy step is
    # skipped and the job reports green without work — so `coverage` can be a
    # required check that gates release PRs but never blocks ordinary PRs.
    #
    # A merge-queue entry is held to the PR posture, not the push posture. The
    # queue validates the projected trunk against the SAME contexts branch
    # protection asks a PR for; a queue that runs work the PR never ran can
    # dequeue a PR that was green, which is the livelock the queue exists to
    # remove. The real run is not lost — `main` advances to the merge group's
    # own head SHA, and the push trigger above sweeps coverage on that commit.
    env:
      RUN_HEAVY: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || startsWith(github.head_ref, 'release/') }}
    steps:
      - uses: actions/checkout@v7

      - if: env.RUN_HEAVY == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - if: env.RUN_HEAVY == 'true'
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: just

      - name: Install libchdb.so
        if: env.RUN_HEAVY == 'true'
        run: just chdb-install

      # `just coverage` ends by running .github/scripts/coverage-summary.mjs,
      # which writes the step summary AND holds every package to the floor
      # committed in test/coverage-floor.json. COVERAGE_REQUIRE_LANES makes the
      # gate refuse to run at all on a profile missing the chdb lane: without
      # it, a `just chdb-install` that fails soft would leave the script
      # comparing a narrower profile — so it skips the comparison, and the lane
      # reports green having gated nothing.
      - name: Run coverage
        if: env.RUN_HEAVY == 'true'
        env:
          COVERAGE_REQUIRE_LANES: default+chdb
        run: just coverage

      - name: No-op (non-release PR)
        if: env.RUN_HEAVY != 'true'
        run: echo "coverage is a green no-op on non-release PRs (real run on push/nightly/dispatch + release/* PRs)."

      - name: Upload coverage profile
        if: always() && env.RUN_HEAVY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: |
            cover.out
            cover-chdb.out
            cover-merged.out
          retention-days: 30
