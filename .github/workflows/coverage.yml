name: coverage

# Coverage floor workflow. Runs the default-tag and chdb-tagged `go test
# -coverpkg` sweeps `just coverage` used to run serially, produces a merged
# coverage profile, uploads the cover-merged.out artifact, and — via
# .github/scripts/coverage-summary.mjs, which `just coverage-merge` invokes —
# writes the per-package summary into the step summary and holds every
# package to its floor in test/coverage-floor/ (one shard file per package).
#
# The floor is what makes this a gate. The lane used to print a table nothing
# compared against, so coverage could rot one package at a time with every run
# still green; the script fails on a package below its floor, a package with no
# floor, a package whose floor is 0 (which no measurement can fall through),
# and a floor with no package. Raise the floors with
# `just update-coverage-floor` — it ratchets up only and never records a 0, so
# a drop has to be a hand-edited, reviewable line in the diff.
#
# # Sharding (tsouza/cerberus#2634)
#
# This used to be ONE job running `just coverage` — both lanes, back to back —
# on a single runner. It repeatedly hit or came within minutes of its
# 60-minute timeout on real pushes to main as the package/fixture corpus
# grew, and a stopgap bump to 90 minutes (2026-08-25, after #2624/#2627/#2628
# both hit or nearly hit the 60m cap and the merge that landed #2630 ran the
# full 60m0s and was killed) bought only headroom, not a fix: `-coverpkg`
# instruments every listed package into every test binary and counts every
# one of them at run time, so the job's cost scales with the WHOLE package
# graph, not just the packages under active test. That is a capacity
# problem, not a flake — widening the timeout again on the next regrowth is
# not a sustainable pattern.
#
# The fix mirrors `perf-guards-shard`/`perf-guards` in chdb.yml and
# `profile-shard`/`profile` in perf-profile.yml: split the WORK across
# parallel jobs and keep ONE aggregator job named exactly `coverage` — the
# name branch protection's required-contexts set and release.yml's
# RELEASE_REQUIRED_CHECKS both resolve by exact text, so neither ever sees a
# stale or missing context. This originally split into two lane jobs with no
# further fixture-corpus partitioning; tsouza/cerberus#2645 later gave
# `coverage-chdb`'s own `TestCardinalityRatchet` corpus walk its own 2-leg
# matrix (`coverage-chdb-ratchet`, below) once that walk alone caused two
# consecutive real timeouts running serially inside `coverage-chdb`. The
# lane jobs:
#
#   coverage-plan     computes RUN_HEAVY once (coverage-run-heavy.mjs) ahead
#                      of both lane jobs, and runs the gate scripts' own
#                      `node --test` suites — the always-on checks that ran
#                      unconditionally in the old single job, minus the
#                      package-floor enrollment scan (its own job now, see
#                      the next entry and the note below it).
#   coverage-enrollment  the always-on structural package-floor scan
#                      (coverage-package-floor.mjs), on EVERY PR. Depends on
#                      nothing and is depended on by nothing except the
#                      `coverage` aggregator, which reports its verdict.
#   coverage-default   the default-tag `go test -coverpkg` lane
#                      (`just coverage-default`), uploads cover.out.
#   coverage-chdb       the chdb-tagged lane (`just coverage-chdb`), uploads
#                      cover-chdb.out. Runs only 1/3 of TestCardinalityRatchet's
#                      corpus itself (PERF_SHARD_INDEX=1) — the other two
#                      shards run on their OWN runners, below.
#   coverage-chdb-ratchet  tsouza/cerberus#2645: a 2-leg matrix, one runner
#                      per leg, each running exactly ONE of
#                      TestCardinalityRatchet's remaining shards
#                      (perf-coverage-fanout.mjs's LEG_INDEX mode). This used
#                      to run INSIDE coverage-chdb, serially AFTER its main
#                      sweep, sharing that job's one runner — see the job's
#                      own comment for why that stopped fitting the budget.
#   coverage           the AGGREGATOR. Verifies the three lane jobs rolled up
#                      the way this run's RUN_HEAVY says they should
#                      (coverage-aggregate.mjs), then — on a heavy run —
#                      downloads every lane profile (including each
#                      coverage-chdb-ratchet leg's) and runs
#                      `just coverage-merge`, which folds the ratchet shard
#                      profiles into cover-chdb.out, folds that into
#                      cover.out as cover-merged.out, and hands that FULL
#                      merged profile to coverage-summary.mjs's floor gate. A
#                      shard boundary must never let a package's coverage go
#                      unmeasured, so the floor check always runs against the
#                      merge of every lane, never a partial profile.
#
# # Why enrollment is judged in its own job (tsouza/cerberus#2987)
#
# The package-floor scan used to be a step inside `coverage-plan`, and that
# closed a loop. A statement-carrying package with no committed floor failed
# `coverage-plan`; all three lane jobs are `needs: coverage-plan` with a plain
# `if:` (implicit `success()`), so all three skipped; no lane profile was
# produced; and `just update-coverage-floor` derives the ledger from
# cover-merged.out, which only the lanes can produce. No floor, no lanes, no
# profile, no floor — on `pull_request`, `push`, `schedule` and
# `workflow_dispatch` alike, because `run_heavy` is never consulted once the
# `needs` dependency has failed. The only way to enroll a new package was a
# complete local `just coverage`.
#
# Measuring and judging are separate jobs, so the judgement no longer
# suppresses the evidence its own remedy needs. `coverage-enrollment` judges;
# `coverage-plan` and the three lane jobs measure. The gate is not weakened:
# an unfloored package still fails `coverage-enrollment`, and the required
# `coverage` context still goes red on it — the aggregator's LAST step reads
# `needs.coverage-enrollment.result` and fails on anything but success. What
# changes is that a heavy run (push / nightly / `workflow_dispatch` on the
# branch) now still merges and uploads cover-merged.out alongside that red
# verdict, because `just coverage-merge` writes cover-merged.out BEFORE
# handing it to the floor gate and the upload step is `always()`. That
# artifact is the bootstrap: download it, run `just update-coverage-floor`
# against it, commit the ledger. docs/toolchain.md carries the procedure.
#
# Informational on push/nightly, but ALSO a parity lane on the
# publish-on-merge release flow: it runs on EVERY pull_request so it can be a
# required status check. Ordinary PRs run the cheap package-enrollment gate;
# release PRs additionally run full coverage, so their green status includes
# the measured floor comparison.
#
# tsouza/cerberus#2416 (part 2 of #2394): a push-to-main produced by a
# release/*-headed PR merging is REDUNDANT — that PR's own pull_request run
# already measured coverage on the identical tree and posted this job's
# required check-run on its own tip commit. .github/scripts/coverage-run-heavy.mjs
# resolves the PR that produced the pushed commit (lib/resolve-source-pr.mjs's
# exact-match contract) and skips the heavy run ONLY in that one provable
# case; release-preflight.mjs's SOURCE-PR CREDIT already knows to read the
# check-run off that PR's tip instead of demanding a fresh one here. Every
# other push — an ordinary-PR merge (the FIRST real run for that tree), an
# unresolved source PR, or a maintenance-line hotfix pushed with no PR at all
# — still runs heavy; see the script's own header for the full decision table.
#
# Triggers: pull_request + push-to-main + nightly + manual dispatch.

on:
  pull_request:
  # `coverage` is a required context and must post on the projected trunk.
  merge_group:
  push:
    # `release/*.x` so `coverage` also runs on a maintenance-line hotfix push —
    # release.yml's preflight is the only gate on that path (no PR, so no
    # branch protection) and it requires this check-run to exist.
    branches: [main, 'release/*.x']
  schedule:
    # nightly at 05:30 UTC (45 min after compatibility.yml at 04:00 UTC
    # so the runner doesn't double-book; well clear of the chdb job).
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # coverage-run-heavy.mjs (coverage-plan job) resolves the PR that produced
  # a pushed commit via GET /commits/{sha}/pulls (lib/resolve-source-pr.mjs)
  # — read-only, and only exercised on a `push` event.
  pull-requests: read

concurrency:
  # Main pushes and matching cron schedules replace only their own modes. PR,
  # queue, dispatch, and maintenance evidence stays unique and uncancelled.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'latest-main-push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') && format('latest-main-schedule-{0}', github.event.schedule) || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') }}

jobs:
  # coverage-enrollment — the cheap structural package-floor scan, which must
  # catch an unfloored new package on EVERY PR, not only on a heavy run. It
  # needs Go (coverage-package-floor.mjs shells out to `go list` and `go tool
  # cover`) but no chDB, no containers and no tests, so it is a sub-minute
  # job.
  #
  # It is deliberately a LEAF: no `needs:`, and nothing `needs:` it except the
  # `coverage` aggregator, which reports its verdict on the required context.
  # Putting it back inside coverage-plan would restore tsouza/cerberus#2987 —
  # see this file's header note for the loop that creates.
  coverage-enrollment:
    name: coverage-enrollment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Verify package floor enrollment
        run: node .github/scripts/coverage-package-floor.mjs

  # coverage-plan — computes the RUN_HEAVY decision ONCE, ahead of both lane
  # jobs (whose job-level `if:` needs it before either can even start), and
  # runs the gate scripts' own `node --test` suites, which must pass before a
  # lane spends 45 minutes measuring a profile those scripts will judge.
  coverage-plan:
    name: coverage-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_heavy: ${{ steps.run_heavy.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - name: Test coverage gates
        run: |
          node --test .github/scripts/lib/sharded-json.test.mjs
          node --test .github/scripts/coverage-summary.test.mjs
          node --test .github/scripts/coverage-package-floor.test.mjs
          node --test .github/scripts/coverage-run-heavy.test.mjs
          node --test .github/scripts/coverage-aggregate.test.mjs
          node --test .github/scripts/perf-coverage-fanout.test.mjs

      # Computed as a step output rather than a static job-level `env:` GHA
      # expression: a `push` event needs a network call (resolve the source PR
      # that produced the pushed commit) to know whether it is redundant with
      # that PR's own run, and job-level `env:` has no `steps` context to read
      # such a call's result from. See coverage-run-heavy.mjs's header for the
      # full decision table; GITHUB_TOKEN is used read-only and only reached on
      # a `push` event.
      - id: run_heavy
        name: decide run_heavy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: emit
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node .github/scripts/coverage-run-heavy.mjs

  # coverage-default — the default-tag `-coverpkg` lane, split out of the old
  # single job so it runs in parallel with coverage-chdb below
  # (tsouza/cerberus#2634). Job-level `if:` (not step-level): skips the WHOLE
  # job, runner and all, on an ordinary PR/merge-queue entry instead of
  # spinning one up to immediately no-op.
  coverage-default:
    name: coverage-default
    needs: coverage-plan
    if: needs.coverage-plan.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # `just coverage-default`'s own `go test` is capped at `-timeout 40m`
    # (see the recipe's comment for why); this leaves headroom for checkout,
    # Go module/build caching and the recipe's own fold step on top of that,
    # while still catching a genuine hang well inside the aggregator's own
    # budget.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      - name: Run default-tag coverage lane
        run: just coverage-default

      - name: Upload default-tag coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile-default
          path: cover.out
          if-no-files-found: warn
          retention-days: 1

  # coverage-chdb — the chdb-tagged `-coverpkg` lane, split out the same way
  # as coverage-default above (tsouza/cerberus#2634).
  coverage-chdb:
    name: coverage-chdb
    needs: coverage-plan
    if: needs.coverage-plan.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # `just coverage-chdb`'s own main-sweep `go test` is capped at
    # `-timeout 60m`. This job no longer also carries the ratchet fan-out
    # tail (SKIP_RATCHET_FANOUT below moved that to its own
    # coverage-chdb-ratchet matrix, tsouza/cerberus#2645), so the 75-minute
    # wrapper below now has real slack over that 60-minute internal cap —
    # left unchanged rather than retuned speculatively: the only real
    # measurement so far (main tip 4c16821f2) is the main sweep ALONE taking
    # 45m34s, comfortably inside 75m, and a future PR can tighten this once
    # a run without the fanout tail has actually reported its own timing.
    #
    # Bumped from 50 to 75 on 2026-08-26 (before this job stopped running the
    # fanout inline): the first real push-to-main run after this job existed
    # hit the old 50m wrapper exactly, the same corpus growth already
    # documented on the recipe itself.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      - name: Install libchdb.so
        run: just chdb-install

      # COVERAGE_REQUIRE_LANES makes the recipe's own tail check fail closed
      # rather than silently narrowing: a `just chdb-install` that failed
      # soft would otherwise leave cover-chdb.out missing and this job green
      # having gated nothing. See the recipe's own comment in the Justfile.
      #
      # SKIP_RATCHET_FANOUT=1 (tsouza/cerberus#2645): TestCardinalityRatchet's
      # shards 2..RATCHET_FANOUT now run on their own runners in the
      # coverage-chdb-ratchet matrix below instead of serially, in-process,
      # after this job's own main sweep — the source of the two consecutive
      # timeouts this lane hit. A bare local `just coverage-chdb` leaves this
      # unset and keeps running every shard itself, since it has no separate
      # CI job to fall back on.
      - name: Run chdb-tagged coverage lane
        env:
          COVERAGE_REQUIRE_LANES: default+chdb
          SKIP_RATCHET_FANOUT: '1'
        run: just coverage-chdb

      - name: Upload chdb-tagged coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile-chdb
          path: cover-chdb.out
          if-no-files-found: warn
          retention-days: 1

  # coverage-chdb-ratchet — tsouza/cerberus#2645: TestCardinalityRatchet's
  # remaining shards (2..RATCHET_FANOUT, perf-coverage-fanout.mjs's
  # RATCHET_FANOUT=3) as their own 2-leg CI matrix, ONE runner per leg,
  # mirroring chdb.yml's `roundtrip-promql-shard`/`roundtrip-promql` and
  # post-merge-drift.yml's `cardinality-leg`/`cardinality-seal` — "N parallel
  # shards, one aggregator downloads and merges". This used to run inside
  # coverage-chdb, serially AFTER its main sweep, on the SAME runner
  # (perf-coverage-fanout.mjs's old header comment): that was necessary only
  # while `just coverage` was one job and could not spin up separate CI
  # jobs; coverage-chdb became its own job in #2639 and can grow its own
  # matrix like every other multi-shard lane in this repo.
  #
  # Each leg now runs ALONE on its own runner — no sibling shard competing
  # for the same 4 cores, the oversubscription risk the old in-runner
  # fan-out's own RATCHET_FANOUT comment worried about — so per-leg timing
  # should improve on the ~16.3-minute isolated measurement
  # perf-coverage-fanout.mjs's RATCHET_TIMEOUT_MINUTES cites, not regress
  # past it.
  coverage-chdb-ratchet:
    name: coverage-chdb-ratchet (${{ matrix.leg }})
    needs: coverage-plan
    if: needs.coverage-plan.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # perf-coverage-fanout.mjs's RATCHET_TIMEOUT_MINUTES=30 is this leg's own
    # internal `go test -timeout`. 45 leaves 15 minutes for checkout, Go
    # module/build caching, `just chdb-install` and the compile itself on top
    # of that — a 1.5x internal-to-wrapper ratio, close to the ~1.4x
    # chdb.yml's `roundtrip-promql-shard` uses (25m internal / 35m wrapper)
    # for an analogous single-shard-per-runner leg, rather than the tighter
    # 3-minute abort-reporting margin a job that does nothing BUT run one
    # `go test` can get away with. perf-coverage-fanout.test.mjs pins
    # RATCHET_TIMEOUT_MINUTES against this number.
    timeout-minutes: 45
    strategy:
      # MANDATORY, matching every other multi-leg matrix in this repo: one
      # leg's failure (a real corpus-wide regression usually trips several
      # shards at once) must not cancel its sibling mid-profile.
      fail-fast: false
      matrix:
        # Shards 2..RATCHET_FANOUT — shard 1 is coverage-chdb's own main
        # sweep, above. RATCHET_FANOUT is perf-coverage-fanout.mjs's own
        # constant restated here because a GitHub Actions matrix cannot
        # import a JS constant; perf-coverage-fanout.test.mjs pins the two
        # back together the same way the Justfile's PERF_SHARD_COUNT=3
        # literal already is.
        leg: [2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      - name: Install libchdb.so
        run: just chdb-install

      # COVERPKG computed the identical way the Justfile's `coverage-chdb`
      # recipe does — see that recipe for the source of truth; deliberately
      # NOT its own named constant or shared script helper, so the two never
      # look like they could silently diverge without a diff touching both.
      - name: Run TestCardinalityRatchet shard ${{ matrix.leg }}/3
        env:
          TAGS: chdb,agpl_oracle,chdb_agpl_oracle
          LEG_INDEX: ${{ matrix.leg }}
        run: |
          COVERPKG="$(go list -tags chdb,agpl_oracle,chdb_agpl_oracle ./... | paste -sd, -)"
          COVERPKG="$COVERPKG" node .github/scripts/perf-coverage-fanout.mjs

      - name: Upload ratchet shard coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile-chdb-ratchet-${{ matrix.leg }}
          path: cover-chdb-ratchet-${{ matrix.leg }}.out
          if-no-files-found: warn
          retention-days: 1

  # coverage — the AGGREGATOR, named EXACTLY `coverage` so the required
  # status check still appears and gates (the lane jobs report as
  # `coverage-default` / `coverage-chdb`, never `coverage`). `always()` so it
  # still runs — and still reports — when the lane jobs skipped on an
  # ordinary PR/merge-queue entry. A required context that goes missing is
  # indistinguishable from one that is still running.
  coverage:
    name: coverage
    needs: [coverage-enrollment, coverage-plan, coverage-default, coverage-chdb, coverage-chdb-ratchet]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read once here (rather than repeating the `needs.coverage-plan...`
    # expression in every subsequent step's `if:`) because step `if:`s, unlike
    # a job `if:`, CAN read the `env` context — coverage-aggregate.mjs's own
    # drift check below needs the identical value verbatim to confirm the two
    # lane jobs rolled up consistently with coverage-plan's own answer.
    env:
      RUN_HEAVY: ${{ needs.coverage-plan.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v7

      # Fails the job — before anything else runs — unless every lane job
      # rolled up exactly the way this run's RUN_HEAVY says it should: all
      # skipped on an ordinary PR, all success on a heavy run. See the script
      # for the full decision table (a skipped-but-heavy or ran-but-not-heavy
      # result means the job-level gates drifted apart; `failure`/`cancelled`
      # means a lane genuinely broke or hung — for coverage-chdb-ratchet,
      # GitHub Actions reports that the moment ANY one of its two matrix legs
      # does, even with the others' fail-fast: false letting siblings finish).
      - name: Verify the coverage lane jobs rolled up cleanly
        run: node .github/scripts/coverage-aggregate.mjs
        env:
          PLAN_RESULT: ${{ needs.coverage-plan.result }}
          RUN_HEAVY: ${{ needs.coverage-plan.outputs.run_heavy }}
          DEFAULT_RESULT: ${{ needs.coverage-default.result }}
          CHDB_RESULT: ${{ needs.coverage-chdb.result }}
          CHDB_RATCHET_RESULT: ${{ needs.coverage-chdb-ratchet.result }}

      - if: env.RUN_HEAVY == 'true'
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      # No `pattern:`-per-name repetition and no explicit `path:` needed:
      # `coverage-profile-*` already matches coverage-profile-default,
      # coverage-profile-chdb AND both coverage-profile-chdb-ratchet-{2,3}
      # legs (tsouza/cerberus#2645) without widening, and `merge-multiple:
      # true` drops each artifact's file directly into the checkout root
      # instead of a per-artifact subdirectory, so cover.out,
      # cover-chdb.out and cover-chdb-ratchet-{2,3}.out all land exactly
      # where `just coverage-merge` (and a local run of the same recipe)
      # already expects them.
      - name: Download coverage lane profiles
        if: env.RUN_HEAVY == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-profile-*
          merge-multiple: true

      # `just coverage-merge` folds cover.out + cover-chdb.out into
      # cover-merged.out and hands that FULL merged profile to
      # coverage-summary.mjs's floor gate — never a partial, per-lane
      # profile. COVERAGE_REQUIRE_LANES makes the gate refuse to run at all
      # on a profile missing the chdb lane: without it, a `just chdb-install`
      # that failed soft in coverage-chdb (and so uploaded no cover-chdb.out)
      # would leave this comparing a narrower profile — so it skips the
      # comparison, and the lane reports green having gated nothing.
      - name: Merge lane profiles and run coverage floor gate
        if: env.RUN_HEAVY == 'true'
        env:
          COVERAGE_REQUIRE_LANES: default+chdb
        run: just coverage-merge

      - name: Full coverage deferred (ordinary PR / redundant push)
        if: env.RUN_HEAVY != 'true'
        run: echo "package enrollment passed; measured coverage runs on push/nightly/dispatch and release/* PRs (skipped here — see coverage-plan's 'decide run_heavy' step log for why)."

      - name: Upload merged coverage profile
        if: always() && env.RUN_HEAVY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: |
            cover.out
            cover-chdb.out
            cover-merged.out
            cover-merged.out.lanes.json
          retention-days: 30

      # The structural enrollment verdict lands HERE, and last. `coverage` is
      # the required context and `coverage-enrollment` is not, so an unfloored
      # package has to fail this job or it does not block a merge at all. Last
      # and `always()` so the merge and the upload above still happen first:
      # that uploaded cover-merged.out — with the cover-merged.out.lanes.json
      # record that proves it carries both lanes, without which
      # `update-coverage-floor` refuses it (tsouza/cerberus#2988) — is exactly
      # what the author of the unfloored package needs to run against,
      # and failing ahead of it would recreate tsouza/cerberus#2987's loop one
      # job further along. `always()` also means a genuinely cancelled or
      # errored coverage-enrollment fails here rather than passing silently.
      - name: Report the package floor enrollment verdict
        if: always()
        env:
          ENROLLMENT_RESULT: ${{ needs.coverage-enrollment.result }}
        run: |
          if [ "$ENROLLMENT_RESULT" != 'success' ]; then
            echo "::error title=coverage package floor::coverage-enrollment reported \"$ENROLLMENT_RESULT\" instead of \"success\" — open that job for the package list and the remedy."
            exit 1
          fi
          echo "coverage-enrollment passed: every statement-carrying full-lane package has a positive committed floor."
