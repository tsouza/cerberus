name: dependabot-pr-title

# Shortens a Dependabot PR title whose squash subject would exceed commitlint's
# `header-max-length`, so the required `pr-body` check (pr-hygiene.yml, which
# lints the title plus the ` (#N)` suffix) passes without a hand edit. The
# rewrite rule and its rationale live in `.github/scripts/dependabot-pr-title.mjs`.
#
# Trigger: `pull_request_target`, for two reasons. Actions secrets reach it
# (a Dependabot-triggered `pull_request` run sees only Dependabot secrets), and
# the edit needs RELEASE_PAT: a title edit made with GITHUB_TOKEN does not start
# workflow runs, so pr-hygiene's `edited` trigger would never fire and `pr-body`
# would stay red on the old title. `edited` is in the type list because
# Dependabot rewrites the title when it updates a PR to a newer version; the
# edit this job makes fires `edited` too, and that run finds a compliant title
# and does nothing.
#
# SECURITY: `pull_request_target` runs on the BASE ref with secrets. This
# workflow never checks out or executes PR head code: the checkout is the base
# ref's `.github/scripts` (plus the root commitlint config that cone-mode
# sparse checkout always includes), without persisted credentials. The PR title
# is read from the REST API inside the script and never interpolated into a
# shell line. The job is limited to PRs authored by `dependabot[bot]`, and the
# script repeats that check.

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shorten:
    name: shorten over-long title
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Shorten the title if its landing subject is over the limit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE_EDIT_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: node .github/scripts/dependabot-pr-title.mjs
