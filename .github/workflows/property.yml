name: property

# Nightly oracle property-test lane.
#
# Runs the chdb-tagged property tests under `./test/property/...` with
# a deeper rapid sweep than the local default. The test code itself
# uses rapid's default 100 iterations (so a developer running
# `go test -tags chdb,agpl_oracle,chdb_agpl_oracle ./test/property/...` locally gets a fast 100x
# sweep); this workflow overrides to `-rapid.checks=500` to widen the
# nightly search.
#
# Coverage today:
#
#   - TestPromQL_Property_FromScratch — PromQL instant + range +
#     aggregations against the from-scratch oracle.
#   - TestPromQL_InstantWindowSweep_FromScratch — sweeps the instant
#     eval time T (incl. the 60s/90s offsets the rc.8 window-anchor bug
#     hid in) across a continuous series; asserts the instant
#     range-vector result agrees with a from-scratch (T-range, T] window
#     oracle (non-empty when the window is non-empty).
#   - TestLogQL_Property              — LogQL stream + line filter +
#     `| label_format` against the from-scratch oracle.
#   - TestTraceQL_Property            — TraceQL spanset filter +
#     `| count() OP N` against the from-scratch oracle.
#
# All run in the same `property` job (one `go test` invocation walks
# every test in `./test/property/...`).
#
# Like `chdb.yml`, this workflow links `libchdb.so` and is therefore
# segregated from the standard required PR lane (`check` + `lint`, CGO-free).
# But it is ALSO a parity lane on the publish-on-merge release flow: it runs on
# EVERY pull_request so it can be a required status check, short-circuiting to a
# green no-op on a non-release PR and running the deep rapid sweep only on a
# `release/*` PR (so a release PR's green status includes the property tests).
# Mirrors chart-ci.yml's no-op pattern, keyed on the release branch.
#
# Triggers: pull_request + push to main + manual dispatch + nightly. On failure, the
# rapid seed is captured in the test output (and the workflow log).
# Authors can reproduce a failing run locally with:
#
#   go test -tags chdb,agpl_oracle,chdb_agpl_oracle -run TestPromQL_Property -rapid.seed=<N> ./test/property/...
#   go test -tags chdb,agpl_oracle,chdb_agpl_oracle -run TestPromQL_InstantWindowSweep -rapid.seed=<N> ./test/property/...
#   go test -tags chdb,agpl_oracle,chdb_agpl_oracle -run TestLogQL_Property -rapid.seed=<N> ./test/property/...
#   go test -tags chdb,agpl_oracle,chdb_agpl_oracle -run TestTraceQL_Property -rapid.seed=<N> ./test/property/...
#
# TestLogQL_Property needs `agpl_oracle` and `chdb_agpl_oracle` alongside
# `chdb`: its from-scratch oracle (test/property/oracle/logql) imports
# Loki's AGPL syntax + log packages, gated behind `agpl_oracle` so the
# default build and `go test ./...` stay AGPL-free (#1520), and
# logql_test.go itself carries the synthetic single-term tag
# `chdb_agpl_oracle` (every //go:build constraint in this tree must be a
# single term — see test/regression/lint_build_tags_test.go — so it can't
# spell `chdb && agpl_oracle` directly). The step below passes all three
# tags for every property test in one invocation.

on:
  pull_request:
  # `property (…)` is a required context and must post on the projected trunk.
  merge_group:
  push:
    # `release/*.x` so the `property (…)` check also runs on a maintenance-line
    # hotfix push — release.yml's preflight is the only gate on that path (no
    # PR, so no branch protection) and it requires this check-run to exist.
    branches: [main, 'release/*.x']
  workflow_dispatch:
  schedule:
    # nightly at 03:45 UTC, ahead of `chdb.yml` (04:00 UTC) so the
    # runners stagger and a libchdb cache primed here can be reused.
    - cron: '45 3 * * *'

# See chdb.yml: chDB's purego FFI can abort with "signal arrived during cgo
# execution" when Go's async preemption (SIGURG) interrupts a libchdb.so
# downcall. Disable async preemption for these chDB-tagged test processes;
# cooperative preemption still applies and the production binary is unaffected.
env:
  GODEBUG: asyncpreemptoff=1

permissions:
  contents: read

concurrency:
  # Main pushes and matching cron schedules replace only their own modes. PR,
  # queue, dispatch, and maintenance evidence stays unique and uncancelled.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'latest-main-push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') && format('latest-main-schedule-{0}', github.event.schedule) || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') }}

jobs:
  property:
    name: property (PromQL + LogQL + TraceQL, rapid N=500)
    runs-on: ubuntu-latest
    # Must stay comfortably above HISTOGRAM_TIMEOUT_MINUTES in
    # property-fanout.mjs (the slowest leg the job waits on) plus setup —
    # see that constant's comment for the real measured per-check cost this
    # is derived from, and why 30 was too tight in practice.
    timeout-minutes: 40
    # RUN_HEAVY gates the real work: true on push / schedule / dispatch, and on
    # a release PR (head branch release/*). On a regular PR every heavy step is
    # skipped and the job reports green without work — so `property …` can be a
    # required check that gates release PRs but never blocks ordinary PRs.
    #
    # A merge-queue entry is held to the PR posture, not the push posture: the
    # queue answers the same contexts branch protection asks a PR for, and a
    # queue that runs work the PR never ran can dequeue a PR that was green. The
    # rapid sweep is not lost — `main` advances to the merge group's own head
    # SHA and the push trigger above runs it there.
    env:
      RUN_HEAVY: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || startsWith(github.head_ref, 'release/') }}
    steps:
      - uses: actions/checkout@v7

      - if: env.RUN_HEAVY == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - if: env.RUN_HEAVY == 'true'
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      - name: Install libchdb.so
        if: env.RUN_HEAVY == 'true'
        run: just chdb-install

      - name: No-op (non-release PR)
        if: env.RUN_HEAVY != 'true'
        run: echo "property is a green no-op on non-release PRs (real run on push/nightly/dispatch + release/* PRs)."

      - name: Run property tests (rapid N=500)
        if: env.RUN_HEAVY == 'true'
        # `-tags chdb,agpl_oracle,chdb_agpl_oracle` enables the chdb-tagged
        # property entry points AND the LogQL property test's from-scratch
        # oracle (which additionally needs `agpl_oracle`) AND
        # logql_test.go itself (gated by the synthetic single-term
        # `chdb_agpl_oracle` tag — see the tag composition note above and
        # #1520); `-rapid.checks=500` widens beyond rapid's default of
        # 100; `-rapid.shrinktime=5m` lets the shrinker work on a failing
        # draw before the test gives up.
        #
        # The `go test` invocation lives in property-fanout.mjs, not here,
        # because it needs a fan-out with a failure-propagation contract —
        # exactly the "non-trivial step logic" invariant 15 keeps out of
        # workflow files. test/property is one Go package (one test
        # binary), and TestPromQL_Property_NativeHistogram now runs
        # 900-1190s at this depth (#2165 widened its query-shape space from
        # 3 to 16 legitimate shapes) — too close to its own 20-minute go
        # test -timeout to trust in isolation, let alone stacked serially
        # behind the rest of the package's tests in one binary, which is
        # what pushed the combined run past the timeout on every push since.
        # The script splits the histogram sweep's -rapid.checks across
        # several concurrent processes, runs the deterministic histogram
        # roster in its own process, and runs everything else in a fourth —
        # which removes the serial stacking without touching product code
        # or dropping a single test. It also cross-checks every rapid-based
        # leg's log for a real, measured hazard: pgregory.net/rapid derives
        # its OWN deadline from a leg's `-timeout` and silently stops early
        # (still logging "OK") when it estimates it is running short, so a
        # too-tight per-leg timeout would degrade coverage without ever
        # turning the job red — see the script's header for the full
        # account, including why t.Parallel() inside one process is not
        # safe here either (chdb-go's session-level global).
        env:
          TAGS: chdb,agpl_oracle,chdb_agpl_oracle
        run: node .github/scripts/property-fanout.mjs

      - name: Upload rapid failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: property-rapid-failures
          # rapid persists shrunk failing draws under testdata/rapid/
          # of the test package directory. Capture them so the seed +
          # the minimised dataset/query are downloadable from the run.
          path: |
            test/property/testdata/rapid/**
          if-no-files-found: ignore
          retention-days: 30
