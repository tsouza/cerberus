name: link-check-external

# EXTERNAL link checker. Deliberately split from the OFFLINE internal
# `link-check` job in ci.yml: external `http(s)://` links depend on third-
# party host availability, which is inherently flaky. A transient 5xx / DNS
# blip / rate-limit on someone else's server must NEVER red a PR or abort a
# release tag, so this lane runs ONLY on a weekly schedule + manual dispatch
# and reports rot without failing. The internal gate (offline, deterministic) is
# the one wired into PRs (and so, as a required check, into the release PR's
# merge-when-green gate).
on:
  schedule:
    # Mondays 06:00 UTC. Weekly is plenty for catching link rot.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# `issues: write` lets the tracking-issue step open/update the rot report.
# `contents: read` for the checkout.
permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-external
  cancel-in-progress: false

jobs:
  external-links:
    name: external-links
    runs-on: ubuntu-latest
    env:
      TRACKING_ISSUE_TITLE: Weekly external link check found dead links
      TRACKING_ISSUE_LABEL: link-rot
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-lychee

      # Persist lychee's response cache across runs so a known-good link is
      # not re-fetched every week (and a known-bad one is not hammered).
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: |
            lychee-

      # ONLINE check: no `--offline`. `--cache` + `--max-cache-age 1d` reuse
      # recent verdicts; `GITHUB_TOKEN` is passed so github.com links are
      # checked authenticated (dodging the anonymous API rate-limit that
      # otherwise yields false 429/404 negatives). The exit code is ignored:
      # the JSON verdict is classified by the next step, which carries the
      # signal, so the job stays green even with dead links.
      # The same upstream-snapshot + node_modules excludes as the internal gate.
      #
      # `--exclude 'https://slsa\.dev'`: slsa.dev has fired "Connection
      # failed. Check network connectivity and firewall settings" on every
      # run that has hit it (#1315, #2272) despite being reachable from a
      # browser — it blocks the GitHub Actions runner range / lychee's
      # non-browser user agent, not an actual outage. The link itself is
      # valid; this checker cannot verify it, so stop asking it to.
      - name: lychee (external links)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          lychee \
            --cache \
            --max-cache-age 1d \
            --format json \
            --output ./lychee.json \
            --exclude-path compatibility/prometheus/upstream \
            --exclude-path compatibility/tempo/upstream \
            --exclude-path compatibility/loki/upstream \
            --exclude-path node_modules \
            --exclude 'https://slsa\.dev' \
            "**/*.md" || true

      # Split lychee's errors into dead links and links a host hid behind a
      # bot challenge (a vendor `*-mitigated: challenge` header on the
      # re-probe), render the report, and find the open tracking issue so a
      # rerun updates it instead of opening a duplicate.
      - name: Classify link errors
        id: classify
        env:
          LYCHEE_JSON: ./lychee.json
          REPORT_PATH: ./lychee-report.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ env.TRACKING_ISSUE_TITLE }}
          ISSUE_LABEL: ${{ env.TRACKING_ISSUE_LABEL }}
        run: node .github/scripts/link-check-external.mjs

      # Open the tracking issue, or update the open one, when a link is dead.
      # Never fails the job.
      - name: Open/update link-rot tracking issue
        if: steps.classify.outputs.dead_count != '0'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # v6
        with:
          title: ${{ env.TRACKING_ISSUE_TITLE }}
          content-filepath: ./lychee-report.md
          issue-number: ${{ steps.classify.outputs.issue_number }}
          labels: ${{ env.TRACKING_ISSUE_LABEL }}, automated
