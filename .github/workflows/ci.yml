name: ci

on:
  push:
    # `release/*.x` so the required check / lint / forbid-skip gates also run on
    # a maintenance-line hotfix push (release/1.4.x, …) — release.yml's
    # maintenance preflight reads these check-runs before publishing.
    branches: [main, 'release/*.x']
  pull_request:
  # `check` / `lint` / `forbid-skip` are required contexts, so they must post on
  # the merge queue's projected trunk as well — a required context the merge
  # group never produces leaves the entry queued forever. See the merge-queue
  # section of docs/test-strategy.md.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `changes` computes whether the PR is docs-only. Docs-only PRs short-
  # circuit the heavy `check-test` / `check-build` jobs — `lint` and
  # `forbid-skip` still run unconditionally because they are the gates
  # that catch broken markdown / discipline regressions in the docs
  # themselves. See `.github/workflows/compatibility.yml`,
  # `compose-smoke.yml`, and `chdb.yml` for the matching short-circuit
  # in the other PR-gate workflows.
  #
  # Only computed on `pull_request`. On `push` events (main + tags) the
  # output is the empty string, so the boolean check `!= 'true'` in
  # downstream `if:` clauses falls through and the heavy job runs — that
  # is the safe-by-default behaviour for force-pushes, tag pushes, and
  # any other event where the diff isn't a clean two-commit range.
  #
  # The filter convention: `code` matches "any changed file that is NOT
  # documentation". If `code == 'false'` we know every changed file was
  # a doc file → docs_only. If `code == 'true'` at least one non-doc
  # file changed → full suite.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.compute.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # `every` makes the negation patterns subtractive: a file is
          # in `code` iff it matches `**` AND does NOT match any of the
          # `!`-prefixed doc patterns. Under the default `some`
          # quantifier, `**` matches everything and the negations never
          # fire — every PR would be flagged as code-touching.
          predicate-quantifier: 'every'
          # `code` matches "any changed file that is NOT documentation".
          # The `!`-prefixed patterns subtract docs files from the `**`
          # baseline. If `code == 'false'` after the filter runs, every
          # changed file was a doc file → docs_only short-circuit. If
          # `code == 'true'`, at least one non-doc file changed → full
          # suite.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.markdown'
              - '!docs/**'
              - '!LICENSE*'
              - '!CHANGELOG.md'
              - '!.markdownlint*'
              - '!CLAUDE.md'
              - '!AGENTS.md'
              - '!README*'

      - id: compute
        # On non-PR events, leave docs_only as the empty string so the
        # downstream `!= 'true'` guard falls through and heavy jobs run.
        # This is the safe-by-default branch for tag pushes, force-
        # pushes, and any event where the diff isn't a clean two-commit
        # range.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.filter.outputs.code }}" = "false" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # `check` is the test + build gate, split across two CONCURRENT jobs plus an
  # aggregator that carries the branch-protection name. Linting is separate
  # again (the `lint` job below) so lint and test failures surface independently.
  #
  # The split is drawn where the measured cost is, not where the tasks feel
  # different. `go test -race ./...` is the long pole, and inside it ONE package
  # — internal/api/prom — accounts for ~58% of all package test time, ten times
  # the next largest (149s against 110s for the other 58 packages COMBINED).
  # Sharding the test set by package therefore buys nothing: every split still
  # has to wait for that package, and inside it a single test is the longest
  # thing running, so splitting further by test name hits the same floor. What
  # the suite does NOT need to wait for is the build / type-check / oracle /
  # tidy work — pure serial tail hanging off the same runner. That moved to
  # `check-build`, and the two halves now overlap instead of queueing.
  check-test:
    name: check-test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: test
        run: just test-unit

  check-build:
    name: check-build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: build + type-check the tagged lanes
        run: |
          just build
          just vet-tagged

      # The test/oracle nested module quarantines cerberus's test-only
      # consumers of the AGPLv3 grafana/loki / grafana/tempo parsers out
      # of the root module graph (so they never reach the Apache-2.0
      # `cmd/cerberus` binary — see the agpl-clean job below). Its tests
      # still have to RUN, so exercise the module here rather than silently
      # dropping coverage. `just test-unit` / root `go test ./...` stop at the
      # nested go.mod, so this is a separate invocation.
      - name: test oracle module
        run: go test ./...
        working-directory: test/oracle

      # goreleaser's `before` hook runs `go mod tidy` on every release, so a
      # go.mod that isn't tidy means the release mutates the tree it is cutting
      # from. That is how `spf13/pflag` sat marked `// indirect` while
      # cmd/cerberus imported it directly. Both modules, since the nested
      # oracle module drifts the same way and the root suite never reaches it.
      - name: go.mod is tidy
        run: |
          for mod in . test/oracle; do
            (cd "$mod" && go mod tidy)
          done
          if ! git diff --quiet -- '**/go.mod' '**/go.sum' go.mod go.sum; then
            echo "::error::go mod tidy changed go.mod/go.sum — commit the result:"
            git --no-pager diff -- '**/go.mod' '**/go.sum' go.mod go.sum
            exit 1
          fi

  # The AGGREGATOR, and the only branch-protection context of the three: one
  # rolled-up verdict over both halves, so the required check name survives the
  # split unchanged. `always()` is load-bearing — with a plain `needs:` this job
  # would be SKIPPED when a half fails, and a skipped required check is green to
  # branch protection. So it always runs and reads the results explicitly.
  check:
    name: check
    needs: [changes, check-test, check-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gate on both halves
        run: |
          echo "check-test  = ${{ needs.check-test.result }}"
          echo "check-build = ${{ needs.check-build.result }}"
          # A docs-only change compiles and tests nothing, so both halves are
          # skipped by design and the gate reports green without work — the
          # behaviour the single `check` job had via its own `if:`.
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            echo "docs-only change — no Go code to build or test."
            exit 0
          fi
          # Otherwise the strict `!= 'success'` form catches failure AND
          # cancelled AND skipped: anything that is not a clean pass fails the
          # gate rather than being read as an absent problem.
          if [ "${{ needs.check-test.result }}" != "success" ]; then
            echo "::error::check-test did not succeed (${{ needs.check-test.result }})."
            exit 1
          fi
          if [ "${{ needs.check-build.result }}" != "success" ]; then
            echo "::error::check-build did not succeed (${{ needs.check-build.result }})."
            exit 1
          fi
          echo "both halves green."

  # `lint` consolidates ALL linting in one job:
  #   - Go (golangci-lint v2 = formatters + linters from .golangci.yml)
  #   - Commit messages (commitlint, PR-only)
  #   - Markdown (markdownlint-cli2)
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # commitlint needs full history

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint (Go + formatters)
        # v7+ is required for golangci-lint v2; v6 caps at v1.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # Honours .golangci.yml; runs across the whole module.
          args: ./...
          # Analyse cold. The action's analysis cache is a shared GitHub
          # Actions entry, and those entries are immutable: once a key holds
          # a partially-written cache, every later run that hits that key
          # reuses it, and lint's verdict becomes a function of cache state
          # rather than of the code. That is unsound in both directions — it
          # can invent findings in files a PR never touched (staticcheck
          # without its cross-package facts stops knowing t.Fatalf is
          # terminating and reports SA5011 nil-derefs on correct code), and
          # it can drop real ones just as silently. A required check has to
          # be reproducible from the source alone. setup-go's module/build
          # cache above stays on: Go's build cache is content-addressed, so
          # a bad entry fails verification instead of being trusted.
          skip-cache: true

      # The Tier-0 migration runner is `migration`-tagged, so neither the
      # test job nor golangci-lint (which sets no build-tags) compiles it —
      # a type error there would surface only on the scheduled migration
      # lane. `go vet` with the tag type-checks the runner plus its step
      # library on every PR: seconds, no Docker, no binary build.
      - name: vet the migration harness (tagged runner)
        run: go vet -tags=migration ./test/e2e/migration/...

      # Vetting proves the runner compiles; it proves nothing about whether
      # the committed explain goldens still describe what the emitter emits.
      # Those goldens are the migration lane's only assertion over generated
      # SQL, and the lane has no `pull_request:` trigger — so a change to a
      # query shape merged green and turned `main` red on the next push,
      # where release.yml's preflight (which requires migration-e2e green on
      # the released commit) then refuses to publish. Diagnosing that on
      # `main` costs a whole release cycle; the PR that moved the SQL is the
      # cheapest place to notice. The Tier-0 slice is offline — committed
      # fixtures, no Docker, no reference backend, no network — and runs in
      # seconds, which is why the coverage ratchet and detector guard below
      # already live here rather than waiting for the next push to main.
      - name: run the Tier-0 migration scenarios (explain-golden drift)
        run: go test -tags=migration ./test/e2e/migration/tiers/tier0-offline/... -count=1

      # go-arch-lint enforces the cerberus layering (parse → lower →
      # optimize → emit → execute) declared in .go-arch-lint.yml.
      # No first-party Action exists; install via `go install` so it
      # reuses setup-go's module cache.
      - name: install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.15.0

      - name: go-arch-lint
        run: go-arch-lint check

      # opt-feature-table drift gate. The structural feature table (id /
      # minVersion / stability) in docs/clickhouse-optimizations.md is
      # GENERATED from internal/chopt/registry.go by `cerberus optdocs`. Regenerate
      # and fail if the committed block differs from what the registry
      # produces, so a new registry feature can never go missing from the doc
      # (the ts_grid_changes / ts_grid_resets audit gap, made structurally
      # impossible). Same git-diff-exit-code pattern as chart-ci's
      # helm-docs-drift gate. Runs on every PR and on push to main, so as a
      # required status check it gates a release PR's merge-when-green too (a
      # release publishes only after the PR merges with every required check
      # green on a tree up to date with main).
      - name: opt-feature-table drift check
        run: |
          go generate ./internal/chopt/
          git diff --exit-code -- docs/clickhouse-optimizations.md \
            || { echo "::error::docs/clickhouse-optimizations.md is stale — run 'just gen-opt-docs' and commit the result"; exit 1; }

      # actionlint validates the workflow files themselves (expression
      # contexts, action inputs, shellcheck of run blocks). GitHub
      # rejects invalid workflow files SERVER-side as zero-job
      # "invalid workflow file" failure runs, which silently prevents
      # required pull_request checks from ever being scheduled — the
      # #749 secrets-in-step-if incident left a PR BLOCKED on four
      # required contexts that could never report. Version pinned in
      # lock-step with Justfile's ACTIONLINT_VERSION; no first-party
      # Action exists, `go install` reuses setup-go's module cache
      # (same pattern as go-arch-lint above).
      - name: install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: actionlint
        run: actionlint

      # commitlint runs over the PR's commit range. This used to be
      # wagoid/commitlint-github-action, but that action is Docker-based
      # and pulls its image from Docker Hub on every run — an anonymous
      # image-pull rate-limit flake failed the lint job (run
      # 27249869293). The npm path below installs @commitlint/cli from
      # the npm registry instead, removing the Docker Hub dependency,
      # and lints the same range the wagoid action used for
      # pull_request events: base.sha..head.sha, i.e. the commits
      # unique to the PR head. `fetch-depth: 0` on the checkout above
      # guarantees both SHAs exist locally.
      # Shared by commitlint (pull_request only) and the Playwright
      # typecheck below (every event) — set up unconditionally so both
      # consumers find a Node toolchain.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: test/e2e/playwright/package-lock.json

      # The Playwright e2e specs run via Playwright's transpile-only
      # esbuild loader, which strips types and NEVER type-checks. A
      # latent TS error (e.g. a self-referential `as typeof x` cast that
      # collapsed an error-envelope to `never` in
      # iterate-time-ranges.spec.ts) therefore compiled green and the
      # required compose-smoke gate stayed green over it. This step
      # closes that hole: `tsc --noEmit` over the whole playwright
      # tsconfig, no browser, sub-second. Fast enough to live in the
      # lint job rather than gate behind the compose stack.
      - name: typecheck e2e Playwright specs
        working-directory: test/e2e/playwright
        run: |
          npm ci
          npx --no -- tsc --noEmit -p tsconfig.json

      - name: commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
          npx --no -- commitlint --config .commitlintrc.json \
            --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !compatibility/prometheus/upstream/**
            !compatibility/tempo/upstream/**
            !compatibility/loki/upstream/**
            !**/node_modules/**

      # doc-to-code reference integrity. Greps docs/**/*.md for inline
      # `(internal|cmd|test|deploy)/<path>.go[:line]` (+ dir) citations and
      # HARD-FAILS on a path that no longer exists or a line pin past EOF.
      # See .github/scripts/doc-refs.mjs + .github/scripts/README.md. The
      # `--test` guard pins the extraction regex + verdict logic so the
      # detectors can't silently rot into a no-op (same idiom as the
      # compose-smoke / dashboard matrix guards).
      - name: doc-refs self-test (regex + verdict guard)
        run: node --test .github/scripts/doc-refs.test.mjs

      - name: doc-to-code reference check
        run: node .github/scripts/doc-refs.mjs

      # Layer-14 story <-> scenario coverage ratchet. The 26 migration
      # user-stories in docs/migration-testing.md section 4 are the
      # durable anchor; every one of them is executed by a tagged Gherkin
      # Scenario under test/e2e/migration/features. The ratchet also
      # enforces the scenario-language rules the Gherkin AST is needed
      # for — a Scenario with no `Then` asserts nothing, and a number or
      # an operator in step text means an epsilon or a relation escaped
      # from Go into feature prose.
      #
      # It lives here rather than on migration-e2e.yml because the anchor
      # is a markdown table: e2e.yml's `gate` job is skipped on docs-only
      # PRs, and the migration lane has no `pull_request:` trigger at
      # all, so a PR deleting a story row would sail past both. MODE=verify
      # is pure file walking — seconds — so the drift is a blocking PR
      # failure rather than a nightly surprise.
      #
      # The unit guard runs first: it proves each detector still FIRES,
      # so the ratchet cannot rot into a no-op that reports zero
      # violations forever and looks exactly like a healthy one.
      - name: migration coverage-ratchet self-test (detector guard)
        run: node --test .github/scripts/migration-e2e.test.mjs

      - name: enumerate migration scenarios
        run: |
          mkdir -p build
          go run ./test/e2e/migration/cmd/scenarios --out build/migration-scenarios.json

      - name: migration story/scenario coverage ratchet
        run: node .github/scripts/migration-e2e.mjs
        env:
          MODE: verify
          SCENARIOS_JSON: build/migration-scenarios.json

      # The release gate's own guards. release.yml has NO `pull_request:`
      # trigger, so `release-preflight.mjs --self-test` and the brew smoke only
      # ever execute while a release is being cut — the one moment a regression
      # in them is most expensive. These two suites are pure (no network, no
      # brew, no GitHub API), so they run here, on every PR, where a break is
      # cheap.
      #
      # The preflight suite's headline case is that a REQUIRED lane which posted
      # no check-run blocks the publish, with the negative control that the same
      # world is green once the name leaves the required set — the gate used to
      # be observation-derived, so "lane X now gates the release" was satisfiable
      # by changing nothing.
      - name: release-preflight self-test (required-set guard)
        run: node --test .github/scripts/release-preflight.test.mjs

      # Same reasoning one level out: release-gate-drift.yml is schedule-only, so
      # its detector would otherwise go unexercised between weekly runs. The pure
      # half — the release.yml block-scalar parse and the two drift comparisons —
      # runs here. Its own negative controls matter most: a required name covered
      # exactly, a protected context covered only by an informational PREFIX, and
      # the `property (…, rapid N=500)` name surviving as ONE name, since a parser
      # that split it would report permanent lane drift on a healthy repo.
      - name: release-gate-drift self-test (gate rot detector)
        run: node .github/scripts/release-gate-drift.mjs --self-test

      - name: brew-smoke self-test (cask-freshness guard)
        run: node --test .github/scripts/brew-smoke.test.mjs

      # The upgrade harness itself needs Homebrew and several minutes, so it runs
      # weekly in brew-verify.yml. Its VERDICT does not, and that is the half
      # deciding whether a silently-skipped migration is reported — a verdict
      # that reads Homebrew's silence as success would leave the weekly lane
      # green while every existing formula install stayed on the old binary.
      - name: brew-upgrade-path self-test (formula -> cask migration verdict)
        run: node --test .github/scripts/brew-upgrade-path.test.mjs

      # goreleaser deprecation gate. `goreleaser check` reports a deprecated
      # config section as an advisory line and still exits 0, and release.yml is
      # the only other place goreleaser runs — so a deprecation first becomes
      # visible in the scroll-back of a release that already published. That is
      # how `brews:` outlived its replacement by several releases. The action is
      # pinned to the same distribution/version release.yml uses, so this gate
      # reports exactly what the next release run would warn about.
      - name: goreleaser-deprecations self-test (detector guard)
        run: node --test .github/scripts/goreleaser-deprecations.test.mjs

      - name: install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: goreleaser config has no deprecated sections
        run: node .github/scripts/goreleaser-deprecations.mjs

      # The migration lane's artifact resolver, here for the same reason:
      # migration-e2e.yml has no `pull_request:` trigger either, so this is the
      # only place a loosening of `resolvePlan` — accepting a half-supplied
      # (cerberus_image, expect_version) pair and quietly building from source
      # under an artifact-shaped job name — is caught before a release run
      # depends on it.
      - name: migration-artifact self-test (build-once seam guard)
        run: node --test .github/scripts/migration-artifact.test.mjs

  # `forbid-skip` is the GA test-discipline gate. The maintainer's
  # NON-NEGOTIABLE rule is "no t.Skip in test files — fix the bug, do
  # not skip." Greps `*_test.go` for `t.Skip` / `t.Skipf` / `t.SkipNow`
  # via `git ls-files` (already excludes .gitignored paths) and fails
  # the build if any match.
  #
  # The remaining steps enforce test-skipping BEHAVIOUR, not prose:
  # soft-assertion / silent-recover patterns, non-empty `should_skip:`
  # overlay entries, test escape-hatch primitives, and "not implemented"
  # in production code. A prior `wording-tests` scan that banned the
  # words "not implemented" / "skipped" / "deferred" in test files +
  # TXTAR fixtures was removed: it policed vocabulary rather than
  # behaviour and false-positived on honest descriptions of correct,
  # version-gated tests, without catching anything the behavioural scans
  # miss.
  #
  # Vendored upstream snapshots under `compatibility/*/upstream/**`
  # are excluded — reference material outside cerberus's authorship
  # boundary (and pinned by their respective VERSION files). Runs in
  # parallel with `check` + `lint`; flip on as a required status check
  # via branch protection.
  forbid-skip:
    name: forbid-skip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The new-should_skip-additions guard diffs against
          # origin/main, so we need both refs reachable.
          fetch-depth: 0
      # The discipline scans below are implemented in
      # .github/scripts/forbid-skip.mjs (one $CHECK per scan) — see
      # `.github/scripts/README.md` for the convention. The regexes are
      # kept byte-identical to scripts/test-forbid-skip.sh (the self-test
      # step at the end of this job pins them).
      - name: Reject t.Skip in test files
        run: node .github/scripts/forbid-skip.mjs
        env:
          CHECK: t-skip
      # Production code (non-test) must not advertise "not implemented".
      # The bare words "skipped" / "deferred" are *not* gated here
      # because Go has legitimate uses of both — `defer` statements
      # described in docstrings, runtime "X is skipped" behaviour
      # prose — that would all false-positive. "not implemented" has
      # no legitimate prod meaning: either implement the feature or
      # rewrite to a factual verb (rejected / unsupported / falls back).
      - name: Reject "not implemented" in production code
        run: node .github/scripts/forbid-skip.mjs
        env:
          CHECK: not-implemented
      # Reject soft-assertion patterns that look like real verification
      # but pass tautologically — a discipline pin against fake-pass
      # regressions.
      #
      # Patterns rejected:
      #   - assert.Contains(x, "")           — empty string matches anything
      #   - assert.ElementsMatch(x, []...{}) — empty slice trivially matches
      #   - defer recover()                  — silently swallows panics
      #   - defer func() { _ = recover() }   — explicit silent recover
      #     (single-line AND multi-line; perl slurp catches both)
      #
      # New additions must use the matching deep-assertion form: assert
      # actual content, assert specific panic, or remove the recover.
      # Soft-assertion + multi-line silent-recover scan. The `[^{}]*`
      # clamp keeps the silent-recover match inside a single brace level
      # so it does not over-reach into surrounding bodies, while
      # `_\s*=\s*recover` discriminates a silent swallow from the
      # legitimate `r := recover(); if r == nil { t.Fatal(...) }`
      # assert-the-panic pattern. Both the grep ERE and the perl slurp
      # live in forbid-skip.mjs verbatim.
      - name: Reject soft-assertion / silent-recover patterns
        run: node .github/scripts/forbid-skip.mjs
        env:
          CHECK: soft-assert
      # Reject any non-empty `should_skip:` overlay entry. The harness
      # consumer code was removed, so an entry would be silently
      # ignored. `should_skip: []` is the only accepted form (kept
      # for schema documentation); any element under the key
      # re-introduces the anti-pattern. The rule is structural: every
      # failure must surface as a real bug to fix at the source.
      # Multi-line scan: detect `should_skip:` followed by a block child
      # (`- source:`) — i.e. a non-empty entry. The accepted empty form
      # `should_skip: []` does not match. Perl slurp lives in forbid-skip.mjs.
      - name: Reject should_skip overlay entries
        run: node .github/scripts/forbid-skip.mjs
        env:
          CHECK: should-skip
      # Regex self-test for the forbid-skip gate. Every pattern
      # documented in docs/forbid-skip.md has a canonical match-example
      # and a counter-example; this step asserts the regexes still
      # classify both correctly. When a future PR widens or normalises
      # the gate, update docs/forbid-skip.md AND
      # scripts/test-forbid-skip.sh in the same change.
      - name: Self-test forbid-skip regex set
        run: |
          scripts/test-forbid-skip.sh
      # Reject test-suite escape-hatch primitives. Each pattern below
      # is a documented anti-pattern that masks real bugs:
      #
      #   - `EXPECTED_EMPTY` / `EXPECTED_TOLERATED` / `isKnownTolerated*` /
      #     `tolerated404` — allow-list arrays consulted before failing.
      #   - `expect.soft(...)` — assertion that records a failure but
      #     lets the test "continue" (Playwright); easy to miss in CI
      #     summaries.
      #   - `should_skip` / `should_tolerate` in code — the YAML schema
      #     was removed; any occurrence here is a re-introduction.
      #   - `skipReason` / `SkipReason` — the loki driver's
      #     overlay-driven skip field, removed.
      #
      # If a real test surfaces noise, fix the noise at the source
      # (cerberus code, seed, dashboard, panel). Never silence it
      # with one of these.
      - name: Reject test escape-hatch patterns
        run: node .github/scripts/forbid-skip.mjs
        env:
          CHECK: escape-hatch
      # Gherkin-scenario discipline for the Layer-14 migration lane. A
      # Cucumber runner carries two suppression routes Go's testing
      # package does not: a `@wip`-style tag that filters a Scenario out
      # of the run, and a step reported as *pending* instead of failed.
      # godog's `--strict` closes the second at runtime, but the
      # migration lane has no `pull_request:` trigger — so without this
      # step a `@skip` tag would merge and only surface on the next
      # scheduled run. The scan also covers the godog skip routes in the
      # harness's NON-test .go step definitions, which the `t-skip` scan
      # over `*_test.go` structurally cannot see.
      - name: Reject scenario-suppressing tags and godog skip routes
        run: node .github/scripts/forbid-skip.mjs
        env:
          CHECK: feature-discipline
      # ClickHouse version-consistency gate. versions.yaml is the single
      # source of truth for the ClickHouse versions the deployment surface
      # depends on (min floor, quickstart image, chDB substrate); this check
      # asserts the docker-compose quickstart + compatibility image tags,
      # the preflight floor, and the substrate all match it, AND - the
      # critical one - that the quickstart is new enough to demo every
      # optimization it enables (floors derived from internal/chopt/registry.go,
      # which stays the SoT for per-feature floors). When a new optimization's
      # floor exceeds the quickstart, this fails until the quickstart and
      # versions.yaml are bumped - see docs/optimization-rules.md (Rule 1).
      - name: ClickHouse version-sync self-test
        run: node .github/scripts/clickhouse-version-sync.mjs --self-test
      - name: ClickHouse version-sync gate
        run: node .github/scripts/clickhouse-version-sync.mjs
      # Assert-from-source doc-count gate. Doc prose states integer counts
      # that DESCRIBE source structures ("N forbid-skip checks", "N-layer
      # test map"); those literals rot the moment the structure grows. This
      # step derives each count LIVE from the source (the forbid-skip CHECK
      # switch arms; the `### Layer N` headings in docs/test-strategy.md) and
      # fails on any doc that drifts from it. The `--self-test` run proves
      # each assertion still FAILS on a deliberate mismatch — see
      # .github/scripts/README.md.
      - name: Assert doc-stated counts match source
        run: |
          node .github/scripts/doc-counts.mjs --self-test
          node .github/scripts/doc-counts.mjs

      # Coverage-discipline pins for the two e2e shard planners. e2e.yml is a
      # RELEASE lane — it does not run on an ordinary PR at all — so a spec file
      # that no shard claims would go unnoticed until a release stalled on it.
      # These are pure in-process unit tests over the planner modules (no
      # substrate, ~50ms both), which is exactly why they belong on the PR path
      # even though the lane they plan does not.
      - name: Assert every e2e spec is claimed by a shard
        run: |
          node --test .github/scripts/compose-smoke-matrix.test.mjs
          node --test .github/scripts/dashboard-matrix.test.mjs

      # The subprocess helper every script above runs its commands through.
      # capture() names the spawnSync options it forwards rather than spreading
      # `opts`, so an unsupported key used to vanish without a word — and a
      # vanished `shell: true` turns the command string into an argv[0] that
      # never resolves, which the caller reads as a legitimate non-zero answer.
      # The tests pin that unknown options now throw.
      - name: Assert the shared subprocess helper honours its option contract
        run: node --test .github/scripts/gh.test.mjs

      # The compose lane's scope gate, same discipline one level up: it decides
      # whether an ordinary PR boots the stack at all, and a wrong `false` is
      # invisible — a clean short-circuit and a real one look identical from the
      # outside. The tests pin the in/out decisions exactly and assert every
      # declared path still resolves, so a rename cannot quietly retire the gate.
      - name: Assert the compose-smoke scope gate decides correctly
        run: node --test .github/scripts/compose-smoke-scope.test.mjs

      # The compose pre-pull's model→image decision. A service compose BUILDS
      # must never be handed to `docker pull`: its ref exists in no registry, so
      # the pre-pull burns every retry on a manifest that cannot resolve and
      # fails the lane minutes in. Cheap to pin here, expensive to learn there.
      - name: Assert the compose pre-pull fetches only fetchable images
        run: node --test .github/scripts/compose-pull-images.test.mjs

      # The GHCR mirror's inventory→ref mapping. A mapping bug is INVISIBLE at
      # runtime: `mirroredRef` returning null is the documented miss path, so a
      # broken mapping degrades every consumer back to the anonymous Docker Hub
      # quota without a word. Two upstream refs colliding on one mirror ref is
      # worse still — the second copy overwrites the first and a consumer gets
      # the wrong image rather than no image. Both are pinned here; the
      # completeness half (does the inventory name every image the tree pulls?)
      # is `TestMirrorInventoryCoversEveryUpstreamImage` in test/regression.
      - name: Assert the image mirror maps its inventory correctly
        run: node --test .github/scripts/mirror-images.test.mjs

      # The login that populates that mirror, and specifically the ORDER its
      # failure classes are asked in. Three of the four can match one output —
      # a quota refusal reaches BuildKit as `unexpected status from HEAD
      # request … 429`, which also reads as a transport fault — and each wrong
      # order is silent in its own way: a retried quota refusal spends the
      # window it was refused for, and a handshake blip classed as fatal is the
      # run (30724446834) that shipped the mirror inert.
      - name: Assert the registry login retries only what retrying can fix
        run: node --test .github/scripts/registry-login.test.mjs

      # Same discipline for the mutation lane's phase planner, one step further:
      # its selector decides which legs an ordinary PR runs, so a bug there is
      # not a slow release but a SILENT one — legs quietly deselected while the
      # required `mutation` context still reports green. The tests pin the phase
      # table against this tree (every scope a real directory, every
      # exclude_files pattern legal under Go's RE2) and pin the selection
      # EXACTLY, not merely non-empty.
      - name: Assert the mutation phase selector scopes correctly
        run: node --test .github/scripts/mutation-matrix.test.mjs

      # Whether a job that pulls an image logged in first. An anonymous pull is
      # not an error: it succeeds until the shared per-runner-IP quota happens to
      # be spent, and then reads as flake — which is how #1572 fixed the class by
      # construction and three jobs were still on the anonymous path afterwards.
      # The detector resolves each step to the registry it reaches (through
      # `just`, through the scripts, through the composite actions) rather than
      # grepping for `docker pull`, because the one shape that looks like a
      # violation and is not — this lane's own `node --test` of an image-pulling
      # module — has to be excluded by a fact about the command and never by a
      # list of job names. The tests run first: they prove the gate still FAILS
      # on the real workflow text with a login step deleted, without which
      # "clean" and "not reading the workflows" report the same green.
      - name: Assert every image-acquiring job authenticates first
        run: |
          node --test .github/scripts/assert-image-jobs-authenticate.test.mjs
          node .github/scripts/assert-image-jobs-authenticate.mjs

      # The two auto-labelers, same discipline: neither is a required check,
      # so a broken mapping never turns anything red — it just quietly stops
      # labeling, which is exactly how 62 issues ended up bare. The issue
      # labeler's tests prove every area arm and every type arm is reachable
      # from a real issue, and prove the CLI FAILS on each vacuity shape it
      # exists to catch (zero issues scanned, a body never fetched, an issue
      # no rule classifies). `pr-type-label.mjs --self-test` pins the shared
      # type table the issue labeler imports rather than restates.
      - name: Assert the auto-labelers still label
        run: |
          node .github/scripts/pr-type-label.mjs --self-test
          node --test .github/scripts/issue-label.test.mjs

      # Committed-artefact discipline. Every other gate asks whether the tree
      # COMPILES and PASSES; none asks what it CONTAINS, so a build artefact
      # that gets `git add`-ed by accident survives indefinitely — a compiled
      # ELF binary and a generated release-PR-body scratch file both did, at
      # the repository root. Two scans close the class: no tracked blob may be
      # a compiled binary (detected by CONTENT — executable magic or a NUL
      # byte in git's own sniff window — never by extension, since the
      # motivating artefact had none), and the repository root must match an
      # exhaustive allow-list rather than a "dotfiles are fine" pattern.
      #
      # The self-test runs FIRST and proves every scan actually fires: it
      # builds throwaway git repos, plants a synthetic ELF blob, a stray root
      # file and a workflow step using docker/login-action, and asserts a
      # non-zero exit naming each — a gate never shown to fail is
      # indistinguishable from one that does nothing.
      - name: Self-test the committed-artefact gate
        run: node --test .github/scripts/repo-hygiene.test.mjs
      - name: Reject tracked binary artefacts
        run: node .github/scripts/repo-hygiene.mjs
        env:
          CHECK: binary
      - name: Reject unsanctioned repository-root entries
        run: node .github/scripts/repo-hygiene.mjs
        env:
          CHECK: root-allowlist
      # docker/login-action has no retry input, so a login that loses one
      # handshake fails the job before it pulls anything — and a failed GHCR
      # login is SILENT at the point of use, because a mirror miss falls back
      # to Docker Hub. Without this scan the Action creeps back one step at a
      # time, which is how it reached 32 sites.
      - name: Reject registry logins that cannot retry
        run: node .github/scripts/repo-hygiene.mjs
        env:
          CHECK: registry-login

      # Same rationale, one lane over: the compat-scores badge publisher only
      # runs on push-to-main, so a break in it surfaces either as stale README
      # badges nobody is watching or — as it did once — as a job that fails
      # in its POST phase because the publish left the checkout on the orphan
      # branch. The test publishes against a real bare-repo remote in a temp
      # dir (offline; ~6s, one real retry backoff), pinning the orphan
      # bootstrap, the sibling-badge preservation, and the invariant that the
      # checkout comes out untouched, on the PR path.
      - name: Assert the compat-scores badge publisher still publishes
        run: node --test .github/scripts/compat-publish-score.test.mjs

      # The parity ratchet is the gate behind the three required
      # compatibility/* checks, and it only executes after a
      # docker-compose harness has produced its artefacts — so a hole in
      # it surfaces as a green required check over a regressed head,
      # which is precisely the failure a count-only ratchet had. These
      # tests drive the real script over fixture artefacts in a temp dir
      # (offline, <1s) and include the negative control: a case regresses
      # while an unrelated one starts passing, leaving every aggregate
      # count satisfied, and the gate must still fail.
      - name: Assert the parity ratchet gates on per-case identity
        run: node --test .github/scripts/compat-ratchet.test.mjs

      # The baseline updater writes the roster the ratchet gates on, so a
      # bug in it either burns a CI cycle or records a divergence. The
      # round-trip case pins that a freshly synced baseline gates green on
      # the very run it was taken from.
      - name: Assert the parity baseline updater writes a gateable roster
        run: node --test .github/scripts/compat-baseline-sync.test.mjs

      # Discipline gate for the typed chsql API rule: no raw SQL token writes
      # outside the Frag-constructor layer in builder.go. Automated enforcement
      # of the "CI can't catch this" manual-grep in CLAUDE.md — it CAN catch
      # the token-writing primitives (strings.Builder, sb.Write*, writeSQL);
      # only the semantic shape (whether a valid Frag could replace the write)
      # requires reviewer judgement. See #1441.
      - name: Reject raw SQL writes outside the chsql Frag layer
        run: node .github/scripts/forbid-sql-raw.mjs

  # `forbid-deferral` used to live here. It moved to its own workflow file,
  # `.github/workflows/forbid-deferral.yml`, because one of its three surfaces
  # is the PR DESCRIPTION and this workflow's bare `pull_request:` trigger does
  # not include `edited` — a body corrected exactly as the gate instructs
  # produced no new check-run. Adding `types:` here would re-run the whole
  # suite on every title tweak, so the gate got its own cheap trigger instead.

  # `link-check` is the INTERNAL markdown link + anchor integrity gate. It
  # runs lychee in pure OFFLINE mode (`--offline --include-fragments`): no
  # network is touched, so it CANNOT flake on a slow/blocked host — every
  # check is a same-process filesystem + in-document anchor resolution. It
  # validates that every relative `[text](./other.md#anchor)` link points at a
  # file that exists AND, for `#fragment` links, that the target heading /
  # anchor exists in the target document. External `http(s)://` links are
  # NOT checked here — host availability is inherently flaky and must never
  # red a PR or abort a tag; that lives in the schedule-only
  # `link-check-external.yml` workflow instead.
  #
  # Runs on pull_request AND push-to-main so it is eligible as a required
  # status check (branch protection); as a required check it gates a release
  # PR's merge-when-green too (a release publishes only after the PR merges
  # with every required check green), making it a release gate too.
  #
  # Vendored upstream snapshots under `compatibility/*/upstream/**` are
  # excluded, mirroring the markdownlint + forbid-skip exclude set — they are
  # reference material outside cerberus's authorship boundary.
  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fetching the checker is this lane's only network dependency, and it is
      # retried - see the action for why that matters.
      - uses: ./.github/actions/setup-lychee

      # OFFLINE link + fragment check. `--root-dir` anchors absolute-style
      # `/foo` links at the repo root; `--include-fragments` turns on the
      # in-document `#anchor` existence check. lychee exits non-zero on a
      # broken link/anchor, which fails the step. No `GITHUB_TOKEN` and no
      # network: the check itself is deterministic by construction.
      - name: lychee (offline internal links + anchors)
        run: |
          lychee \
            --offline \
            --include-fragments \
            --root-dir "$GITHUB_WORKSPACE" \
            --exclude-path compatibility/prometheus/upstream \
            --exclude-path compatibility/tempo/upstream \
            --exclude-path compatibility/loki/upstream \
            --exclude-path node_modules \
            "**/*.md"

  # `agpl-clean` is the provably-clean-build licence gate. Cerberus ships
  # under Apache-2.0. Its LogQL / TraceQL parsers are in-house clean-room
  # Apache reimplementations (internal/logql/lsyntax, internal/logql/logpattern,
  # internal/drain, internal/traceql/ast), and PromQL uses the upstream Apache
  # prometheus parser — so no AGPLv3 grafana/loki or grafana/tempo code reaches
  # the binary. The only grafana/tempo subtree the binary may link is the
  # Apache-licensed pkg/tempopb wire types. Test-only AGPL oracles + the
  # compatibility harnesses are quarantined in the test/oracle nested module
  # and never enter the binary graph.
  #
  # ENFORCING: the gate runs `go list -deps ./cmd/cerberus` and FAILS (exit 1)
  # if any AGPL package is reachable from the binary (grafana/loki/* or
  # grafana/tempo/* except pkg/tempopb). Logic lives in
  # .github/scripts/agpl-clean.mjs (node: builtins only). Add to branch
  # protection as a required status check.
  agpl-clean:
    name: agpl-clean
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: AGPL clean-build gate
        run: node .github/scripts/agpl-clean.mjs
