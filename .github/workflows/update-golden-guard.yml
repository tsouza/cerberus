name: update-golden-guard

# Blocks a pull request from merging while an update-golden.yml dispatch
# against its own branch is still queued or in progress.
#
# Issue #2350: PR #2347 dispatched update-golden.yml against its own branch
# while the PR was open, then merged (deleting its head branch, per this
# repo's normal `--delete-branch` convention) before the dispatch finished.
# Every regenerate leg had already succeeded; the publish job's own
# assertTargetUnmoved correctly refused to push into a branch that no longer
# existed. The already-computed, correct regenerated diff was simply lost,
# and the PR's own code — which needed it — landed on `main` with stale
# goldens. Nothing in the merge path saw the in-flight dispatch coming; this
# is the thing that does: reporting, on every PR and merge-group entry,
# whether the dispatch (if any) against that branch has finished. It is
# Info-only today — not in `main`'s required_status_checks ruleset (see the
# CI-gate inventory in docs/test-strategy.md) — so it does not yet itself
# block a merge; the design below targets its intended eventual role as a
# required check, where it makes the race structurally impossible rather
# than merely loud.
#
# See .github/scripts/update-golden-guard.mjs for the single-snapshot
# mechanism and why there are three triggers below: the pull_request and
# merge_group ones each take one snapshot of the in-flight update-golden.yml
# runs — never reading a run's conclusion — and fail fast rather than block
# when one targets their branch; the workflow_run one closes issue #2350's
# race for a dispatch made AFTER the PR's required check already went green
# — or already failed fast — which the pull_request trigger alone cannot
# re-evaluate on its own since nothing re-runs it. That handler CREATES a
# fresh `update-golden-guard` check-run on the PR's head SHA through the
# Checks API (the same object, name and app as the pull_request job's own
# check-run, so GitHub's newest-check-run-wins rule supersedes it): in
# progress while a dispatch is in flight, failed when the dispatch that just
# completed did not conclude `success` (a cancelled or failed regeneration
# pushed nothing, so the goldens are still stale), success otherwise.
#
# merge_group is not a formality. A required context that never posts on the
# queue's projected trunk never resolves and the entry waits forever, so the
# check has to report there — but reporting a free pass would REGRESS #2350
# rather than being conservative about it: a queued pull request sits between
# "last green on its own head" and "merged" for the whole duration of
# merge-group CI, which is the widest instance of exactly the window this
# guard closes. The merge-group run therefore takes the SAME single snapshot
# against the head branch of the pull request the group would merge, resolved
# from the group's own `gh-readonly-queue/<base>/pr-<n>-<sha>` ref (GitHub
# builds one such branch per queued pull request, so that resolution is
# complete, not a sample of a batch). An unparseable ref fails the check
# rather than passing it. The mjs header carries the full argument, including
# why a merge_group snapshot that fails does not self-heal in place the way
# the pull_request one does, and names the one residual window — a dispatch
# created between the snapshot and the merge — which no in-band mechanism can
# close.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_run:
    workflows: [update-golden]
    types: [requested, completed]

permissions:
  actions: read
  # workflow_run path: list the open PR(s) an update-golden.yml dispatch
  # targets, and create a check-run on their head SHA (see the mjs file
  # header). merge_group path: read the queued pull request to learn its head
  # branch name, which the queue's own ref carries only as a number. The
  # pull_request path relies solely on its own check-run result and needs
  # neither.
  pull-requests: read
  checks: write

concurrency:
  # A check run against a superseded head SHA can never gate the CURRENT one,
  # which is all branch protection ever evaluates — so the newest push should
  # win outright rather than share the runner with a stale, now-pointless
  # snapshot. workflow_run events group by the triggering run's own id
  # instead: requested/completed are two events for the SAME run, and only
  # the later one's status snapshot is worth keeping — an in-between
  # cancellation is fine to drop. merge_group events group by the projected
  # trunk's own head SHA, so two queue entries never share a group and never
  # serialise behind one another.
  group: update-golden-guard-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.workflow_run.id || github.event.merge_group.head_sha }}
  # GitHub reads a CANCELLED check-run as a failed one, so a merge-group run
  # cancelled by this group would dequeue the pull request it was validating.
  # The queue's own batching must never be a source of spurious dequeues, so
  # cancellation is switched off there and only there — the pull_request and
  # workflow_run paths keep the newest-wins behaviour described above.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  update-golden-guard:
    name: update-golden-guard
    runs-on: ubuntu-latest
    # No longer needs to be anywhere near the old ~65-minute ceiling: every
    # path here is a self-test plus a handful of fast API calls (a single
    # in-flight-runs snapshot, or — on workflow_run — a PR lookup and a
    # check-run create), matching the other pull_request-triggered required
    # checks' own timeouts (pr-hygiene.yml: 5). Generous margin over the
    # normal sub-minute run for a slow GitHub API response.
    timeout-minutes: 5
    steps:
      # Plain checkout, matching every other `pull_request`-triggered required
      # check in this repo (forbid-deferral.yml, pr-hygiene.yml): it runs
      # whatever this step contains from the PR's own merge ref, same as
      # every other required gate's own script. update-golden.yml's internal
      # "Checkout trusted workflow controller" split is a DIFFERENT threat
      # model — one workflow_dispatch run executing target-branch code with
      # elevated credentials later in the same run — and does not generalise
      # here: pinning to the PR's base sha would also make this check
      # permanently unable to find its own script before its introducing PR
      # merges, since the base branch cannot contain a script this PR is
      # still adding. The workflow_run trigger runs this same checkout from
      # the default branch — its only source of this script — which is fine:
      # that path never reads anything from the dispatch's own target branch.
      - uses: actions/checkout@v7

      - name: update-golden-guard self-test
        run: node --test .github/scripts/update-golden-guard.test.mjs

      - name: Check for any in-flight update-golden.yml dispatch against this branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: node .github/scripts/update-golden-guard.mjs

      # The merge queue's copy of the snapshot above. `github.head_ref` is
      # empty on a merge_group event — the projected trunk has no pull
      # request of its own — so the script resolves the queued pull request
      # from the group's refs and checks ITS head branch instead. Same
      # snapshot, same loud failure; see this workflow's `on:` comment and
      # the mjs header for why a free pass here would re-open #2350, and for
      # why a failure here does not self-heal in place the way the
      # pull_request one does.
      - name: Check for any in-flight update-golden.yml dispatch against the queued PR's branch
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: node .github/scripts/update-golden-guard.mjs

      # `conclusion` is empty on `requested` and set on `completed`; the
      # script reads it only on the latter (see its env contract).
      - name: Reflect an update-golden.yml dispatch onto its target PR's own check
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_RUN_ACTION: ${{ github.event.action }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          WORKFLOW_RUN_HTML_URL: ${{ github.event.workflow_run.html_url }}
        run: node .github/scripts/update-golden-guard.mjs
