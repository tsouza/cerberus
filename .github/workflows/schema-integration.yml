name: schema-integration

# Schema-provisioning integration lane: runs internal/schema/ddl's
# `integration`-tagged tests against a REAL ClickHouse (spun up via
# testcontainers-go), exercising the DDL cerberus's AUTO_CREATE_SCHEMA hook
# emits end to end — CREATE DATABASE + every signal's CREATE TABLE actually
# executed and accepted by the server, not just string-asserted.
#
# Why this lane exists: the required PR gates (`check` / `lint` / `forbid-skip`)
# and the chDB lanes assert on RENDERED SQL strings or run against the embedded
# single-node chDB engine. Neither can observe whether the emitted DDL is
# ACCEPTED by a real ClickHouse, nor whether a Replicated database actually
# replicates DATA (system.replicas). Three production bugs shipped through that
# blind spot in a row — rc.2 (a Replicated database left its tables plain
# MergeTree, never replicating), rc.3 (the fix emitted ReplicatedMergeTree WITH
# explicit args, which a strict cluster rejects with code 36), and the cold-DB
# bootstrap. The unit tests "passed" each time because they asserted the
# then-current (buggy) emitted string. This lane closes that gap: it runs
# `ApplyWithConfig` against a real server (incl. a Replicated database backed by
# an embedded Keeper) and asserts the DDL is accepted and the tables register in
# system.replicas — see internal/schema/ddl/ddl_replicated_integration_test.go.
#
# A required PR gate (branch protection): it is one of the fast,
# build/correctness merge-gate checks (#2230's two-tier split) even though it
# pulls ClickHouse images and starts containers, because it catches a class of
# bug (DDL a real server rejects, or that silently doesn't replicate) that
# `check` / `lint` / `forbid-skip` and the chDB lanes structurally cannot see —
# see the rationale above. It runs on PRs, on push-to-main + `release/*.x`
# (release.yml's preflight requires this check-run to exist on the maintenance
# publish path too), on the merge queue's projected trunk, and nightly to
# catch drift.

on:
  push:
    branches: [main, 'release/*.x']
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # nightly at 04:30 UTC (offset from the chdb lane's 04:00)
    - cron: '30 4 * * *'

permissions:
  contents: read
  # Pulling this project's own mirrored copies of the upstream images out of
  # ghcr.io (.github/scripts/lib/mirror.mjs); the packages are private.
  packages: read

concurrency:
  # Main pushes and matching cron schedules replace only their own modes. PR
  # and manual qualification remain unique and cannot be cancelled.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'latest-main-push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') && format('latest-main-schedule-{0}', github.event.schedule) || github.run_id }}
  # NEVER cancel a run that is already in progress (tsouza/cerberus#2994).
  #
  # The GROUP above is what makes deep-main work replaceable, and it keeps
  # working: GitHub holds at most ONE pending run per group, so a burst of
  # pushes is still superseded at QUEUE time, where a pending run holds no
  # runner and costs nothing. Killing a run that is already EXECUTING is a
  # separate act, and it only pays when the killed work was nearly worthless.
  #
  # READ THAT DIRECTION BEFORE "OPTIMISING" THIS LINE BACK TO AN EXPRESSION.
  # `false` looks like the setting that wastes runners and the measurement says
  # the opposite: cancellation SPENT the minutes below and threw the result
  # away, then re-ran the same work on the next commit. The tier and the
  # decision rule behind it live in QUEUE_COALESCED_WORKFLOWS in
  # .github/scripts/main-coalescing.mjs, whose audit fails this workflow if the
  # two halves ever disagree.
  #
  # Measured on this lane: only 21% of its main-push runs CANCELLED, but the
  # median kill lands at 86% of a completed run — the LATEST kill point of any
  # enrolled workflow — with 8 of 21 past the 90% mark, so 17% of the lane's
  # runner minutes (135 min in 74.5 h) buy nothing. Cancelling here almost
  # never saves work: it discards an all-but-finished real-ClickHouse DDL
  # differential a few seconds before it would have reported.
  cancel-in-progress: false

jobs:
  # Docs-only PRs short-circuit the Docker work. See ci.yml / chdb.yml for the
  # `every` predicate-quantifier rationale.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.compute.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.markdown'
              - '!docs/**'
              - '!LICENSE*'
              - '!CHANGELOG.md'
              - '!.markdownlint*'
              - '!CLAUDE.md'
              - '!AGENTS.md'
              - '!README*'

      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.filter.outputs.code }}" = "false" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  schema-ddl:
    name: schema-ddl
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Generous: the suite pulls two ClickHouse images (24.8 + 25.8 alpine) and
    # starts a container per test, including a Keeper-backed Replicated case.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      - uses: ./.github/actions/registry-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          docker-hub-pat: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Run schema/ddl integration tests (real ClickHouse)
        run: just schema-ddl-test
