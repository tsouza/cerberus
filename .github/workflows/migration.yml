name: migration

# Layer 14 — the migration lane's Tier-1 three-signal substrate.
#
# `just migration-tier1` brings up the pinned reference stack (reference
# Prometheus + Loki + Tempo alongside one ClickHouse, one OTel collector and
# one cerberus serving all three heads), seeds ONE deterministic all-signal
# fixture into both sides, and runs the `migration_tier1`-tagged assertions
# that compare each side against the fixture oracle.
#
# The lane needs a Docker stack, so it is not a PR gate: it runs on
# push-to-main, nightly and manual dispatch, and its result is informational.
# Informational is not "tolerated" — a red run here is a real substrate or
# parity failure to fix. What keeps the tagged sources from rotting between
# runs is the required `check` lane: `just test` type-checks them under the
# tag, and test/regression/migration_tier1_test.go pins the substrate's
# structural contract from pure file reads.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # nightly at 05:00 UTC, after the chDB lane's 04:00 slot
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-tier1:
    name: migration-tier1
    runs-on: ubuntu-latest
    # The stack build + boot + seed + assertions; generous enough that a slow
    # image pull is not a failure, tight enough that a hung backend releases
    # the runner instead of riding to the 6h ceiling.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Tier-1 substrate + parity assertions
        run: just migration-tier1

      # The seeder's manifest is what every assertion reads its window and
      # cardinalities from, so a failing run is only diagnosable with it in
      # hand. Uploaded on failure as well as success.
      - name: upload seed manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-tier1-manifest
          path: test/e2e/migration/.out/manifest.json
          if-no-files-found: warn

      # Teardown is the last dependency of `just migration-tier1`, so it does
      # not run when an assertion fails. Reclaim the volumes explicitly —
      # otherwise a self-hosted or reused runner carries one run's reference
      # data into the next.
      - name: tear the stack down
        if: always()
        run: just migration-tier1-down
