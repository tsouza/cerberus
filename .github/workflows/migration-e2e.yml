name: migration-e2e

# Layer-14 migration-scenario lane. The Tier-0 slice is an offline godog
# suite over committed fixtures — no Docker, no reference backend, no
# network — driving `cerberus migrate` against the eight archetype rule /
# dashboard sets and asserting the emitted artifacts against goldens. The
# Tier-1 slice brings up the dual-backend compose stack (reference
# Prometheus/Loki/Tempo alongside ClickHouse and cerberus), seeds it, then
# runs both the plain-Go substrate self-checks and the `@tier1`-tagged
# Gherkin scenarios against it — one compose lifecycle, not two separate
# Docker-backed lanes (this consolidates the former migration.yml). The
# Tier-2 slice extends that same stack with the ruler leg (Grafana-managed
# alerting against cerberus, the recording-rule write-back bridge, and the
# dead-end notification receiver) and runs the `@tier2`-tagged scenarios plus
# its own substrate self-check.
#
# migration-tier2 `needs:` migration-tier1, not just migration-setup: docs
# section 8's build order is that alert-firing parity cannot be proven before
# query parity is, so a Tier-2 verdict reached while Tier 1 is red asserts
# nothing. It also keeps two Docker-heavy stacks off one runner concurrently.
#
# There is deliberately NO `pull_request:` trigger, so this workflow can
# never become a branch-protection check. Informational does not mean
# tolerated: a red run here is a real failure to fix, not a signal to
# ignore. The cheap halves of the lane — the coverage ratchet, its
# detector guard, and `go vet -tags=migration` over the harness — run on
# ci.yml's required `lint` job instead, so scenario/story drift blocks a
# PR rather than waiting for the next scheduled run.

on:
  push:
    # `release/*.x` is here because release.yml's `preflight` REQUIRES a green
    # `migration-e2e` check-run on the released commit, and a maintenance
    # backport publishes from its own line. Without this branch the required
    # lane would simply never run there and every patch release would (correctly)
    # block forever.
    branches: [main, 'release/*.x']
  schedule:
    # Nightly, offset from the e2e and compatibility lanes.
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'which tier(s) to run'
        type: choice
        options: [all, tier0, tier1, tier2]
        default: all
      story:
        description: 'a single MIG id to drive, e.g. MIG-04'
        type: string
        required: false
  # Called by release.yml to re-run this lane against the sealed, unpublished
  # candidate. The source invocation and the candidate invocation are distinct
  # required release proofs over the same source SHA/tree.
  #
  # This is still NOT a `pull_request:` trigger: the workflow remains ineligible
  # as a branch-protection check, and release.yml's preflight is what makes it
  # blocking.
  workflow_call:
    inputs:
      tier:
        description: 'which tier(s) to run'
        type: string
        default: all
      story:
        description: 'a single MIG id to drive, e.g. MIG-04'
        type: string
        required: false
      candidate_artifact:
        description: 'caller-run artifact containing the sealed unpublished candidate; empty = source tree'
        type: string
        default: ''
      candidate_digest:
        description: 'exact sha256 digest of the candidate manifest'
        type: string
        default: ''
      expect_version:
        description: 'version the candidate binary and server must report'
        type: string
        default: ''
      source_sha:
        description: 'exact candidate source commit'
        type: string
        default: ''
      source_tree:
        description: 'exact candidate source tree'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Only replaceable source-tree push/schedule work on main shares a group.
  # Candidate workflow calls, dispatches, and maintenance qualification use a
  # unique run-id group and can neither queue behind nor cancel source work.
  group: ${{ github.workflow }}-${{ ((github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main') && 'latest-main' || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}

jobs:
  # Enumerate the Gherkin features, hold them to the 26-story anchor, and
  # emit the tier list the three tier jobs gate on.
  migration-setup:
    name: migration-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # The tiers this run selected — what the roll-up holds to `success`, and
      # what gates the three tier jobs below.
      tiers: ${{ steps.emit.outputs.tiers }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: enumerate migration scenarios
        run: |
          mkdir -p build
          go run ./test/e2e/migration/cmd/scenarios --out build/migration-scenarios.json

      - name: coverage ratchet
        run: node .github/scripts/migration-e2e.mjs
        env:
          MODE: verify
          SCENARIOS_JSON: build/migration-scenarios.json

      - name: emit the tier list
        id: emit
        run: node .github/scripts/migration-e2e.mjs
        env:
          MODE: emit
          SCENARIOS_JSON: build/migration-scenarios.json
          TIER: ${{ inputs.tier || 'all' }}

      # migration-tier0 runs on a separate runner with a fresh checkout, so
      # the enumerator output above must travel as an artifact — the job
      # `tiers` output only carries the small tier-list JSON, not this file.
      - name: upload migration scenarios enumeration
        uses: actions/upload-artifact@v7
        with:
          name: migration-scenarios
          path: build/migration-scenarios.json
          retention-days: 1

  # Tier-0 offline slice: godog over committed fixtures, no Docker, no
  # reference backend. A fixed job like its two siblings — it drives one
  # tag filter on one runner, so there is nothing to fan out over.
  migration-tier0:
    name: migration-tier0
    needs: migration-setup
    # `tiers` is emit's own answer to "what does this run execute", so the
    # gate and the roll-up read the same source and cannot disagree.
    if: contains(fromJSON(needs.migration-setup.outputs.tiers), 'tier0')
    runs-on: ubuntu-latest
    # Offline fixtures and a `go build`; the ceiling only has to outlast a
    # cold module cache. Mirrors TIER0_TIMEOUT_MIN in migration-e2e.mjs.
    timeout-minutes: 15
    concurrency:
      # The workflow-level policy owns latest-main replacement. Keep every
      # qualification run's Tier-0 evidence in its own group.
      group: migration-tier0-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: download migration scenarios enumeration
        uses: actions/download-artifact@v8
        with:
          name: migration-scenarios
          path: build

      # Source mode compiles from the checkout. Candidate mode downloads the
      # sealed caller-run artifact, verifies its complete digest roster, and
      # loads its exact OCI digest into an ephemeral loopback registry.
      - uses: ./.github/actions/resolve-migration-artifact
        with:
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-digest: ${{ inputs.candidate_digest }}
          expect-version: ${{ inputs.expect_version }}
          source-sha: ${{ inputs.source_sha }}
          source-tree: ${{ inputs.source_tree }}

      - name: run the migration scenarios
        run: node .github/scripts/migration-e2e.mjs
        env:
          MODE: run
          SCENARIOS_JSON: build/migration-scenarios.json
          TIER: tier0
          STORY: ${{ inputs.story }}

      # The cucumber-JSON run report MODE=run made the suite write. This is
      # the EVIDENCE half of the coverage ratchet: migration-aggregate
      # downloads every tier's report and runs MODE=attest over them, so a
      # scenario that is enumerated but never executed fails the lane instead
      # of counting as coverage. Uploaded on failure too — a red tier's report
      # is exactly what names the scenario that broke.
      - name: upload the tier run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-report-tier0
          path: build/migration-reports/*.json
          retention-days: 1
          if-no-files-found: warn

      - name: remove the candidate registry
        if: always()
        run: node .github/scripts/migration-artifact.mjs cleanup

  # Tier-1 dual-backend substrate + parity + Gherkin (Layer 14). Unlike
  # migration-tier0 it brings a compose stack up, seeds every @tier1 archetype
  # and tears it down around the suite. It drives the fixed `TIER=tier1` slice
  # alongside the plain-Go substrate self-checks that prove the stack, seeder
  # and comparator are sound. Consolidated here (formerly its own
  # migration.yml workflow) so the dual-backend compose stack is brought up
  # and torn down exactly once per run instead of running two separate
  # Docker-backed lanes side by side.
  migration-tier1:
    name: migration-tier1
    needs: migration-setup
    # A dispatch that narrows to another tier must not pay for this stack.
    # `tiers` is emit's own answer to "what does this run execute", so the
    # gate and the roll-up read the same source and cannot disagree.
    if: contains(fromJSON(needs.migration-setup.outputs.tiers), 'tier1')
    runs-on: ubuntu-latest
    # The stack build + boot + seed + assertions; generous enough that a slow
    # image pull is not a failure, tight enough that a hung backend releases
    # the runner instead of riding to the 6h ceiling. Mirrors
    # TIER1_TIMEOUT_MIN in migration-e2e.mjs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Free runner disk BEFORE the compose stack boots. The stack builds
      # cerberus from the repo-root Dockerfile.local and then runs ClickHouse
      # plus three reference backends; the build layers and CH's data exhaust
      # bone-stock ubuntu-latest's ~14 GB free root fs, which surfaces as "no
      # space left on device" / unhealthy-container compose aborts rather than
      # as a scenario failure. Reclaim the unused pre-baked toolchains; KEEP
      # Docker images, the stack needs them. Same shape as compatibility.yml's
      # reclaim, pinned to a commit SHA (the action only ships @main).
      - name: Disk free (before reclaim)
        run: df -h
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main as of 2026-06-18
        with:
          docker-images: false
          large-packages: false
          tool-cache: false
      - name: Disk free (after reclaim)
        run: df -h

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2.85.10
        with:
          tool: just

      # Anonymous Docker Hub pulls are rate-limited hard enough to fail a cold
      # runner mid-`compose up` from a shared runner IP, and this stack pulls
      # five upstream images; the other Docker-backed lanes log in first for
      # exactly this reason. Gated on the secret being present so a fork PR
      # degrades to anonymous rather than erroring on an empty password.
      #
      # An unreachable Docker Hub no longer takes this job down with it: the
      # login exhausts its retries on a transport fault and downgrades the job
      # to MIRROR-ONLY (registry-login.mjs), where every image comes from the
      # mirror and one the mirror cannot serve fails the job naming itself
      # rather than being pulled anonymously. A quota refusal or a rejected
      # credential still fails here on the first attempt.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_HUB_PAT_SET == 'true' }}
        env:
          DOCKER_HUB_PAT_SET: ${{ secrets.DOCKER_HUB_PAT != '' }}
          USERNAME: tsouza
          PASSWORD: ${{ secrets.DOCKER_HUB_PAT }}
        run: node .github/scripts/registry-login.mjs

      # migration-tier1 runs on a separate runner with a fresh checkout, so
      # the enumerator output from migration-setup must travel as an
      # artifact — same reason migration-tier0 downloads it too.
      - name: download migration scenarios enumeration
        uses: actions/download-artifact@v8
        with:
          name: migration-scenarios
          path: build

      - uses: ./.github/actions/resolve-migration-artifact
        with:
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-digest: ${{ inputs.candidate_digest }}
          expect-version: ${{ inputs.expect_version }}
          source-sha: ${{ inputs.source_sha }}
          source-tree: ${{ inputs.source_tree }}

      - name: bring the Tier-1 stack up
        run: just migration-tier1-up

      - name: seed the Tier-1 stack
        run: just migration-tier1-seed

      # Gherkin before the substrate self-checks, not after: the substrate's
      # negative control (TestTier1Parity/negative_control_the_lane_can_see_disagreement)
      # deliberately and permanently corrupts ClickHouse to prove drift is
      # observable, and nothing undoes that injection — see the
      # migration-tier1-run recipe's comment in the Justfile. The Gherkin
      # corpus replay must read the seeded stack before that happens.
      - name: run the Tier-1 Gherkin scenarios
        run: node .github/scripts/migration-e2e.mjs
        env:
          MODE: run
          SCENARIOS_JSON: build/migration-scenarios.json
          TIER: tier1
          STORY: ${{ inputs.story }}

      # Same evidence contract as migration-tier0's upload: the report the
      # Gherkin step's MODE=run wrote is what migration-aggregate's
      # MODE=attest holds every counted @tier1 scenario to.
      - name: upload the tier run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-report-tier1
          path: build/migration-reports/*.json
          retention-days: 1
          if-no-files-found: warn

      - name: Tier-1 substrate + parity assertions
        run: go test -tags=migration_tier1 -count=1 ./test/e2e/migration/

      # A red tier-1 run is only diagnosable with the stack's own account of
      # what it was doing. Without this, a failure that originates in the
      # collector or a reference backend shows up here as an opaque assertion
      # message and the evidence dies with the runner.
      - name: dump the stack's logs
        if: failure()
        run: just migration-tier1-logs

      # Every seeded archetype's manifest is what its scenarios read their
      # window and cardinalities from, so a failing run is only diagnosable
      # with all of them in hand — migration-tier1-seed's default writes one
      # per archetype (manifest.json for three-signal, manifest-<name>.json
      # for every other archetype). Uploaded on failure as well as success.
      - name: upload seed manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-tier1-manifest
          path: test/e2e/migration/.out/manifest*.json
          if-no-files-found: warn

      # Evidence dump BEFORE teardown — teardown deletes the containers this
      # reads from. The recipe self-guards every command, so this step cannot
      # turn a passing lane red or mask the real failure with its own.
      - name: dump the Tier-1 compose state and logs on failure
        if: failure()
        run: just migration-tier1-logs

      # Teardown always runs, even when an earlier step fails. Reclaim the
      # volumes explicitly — otherwise a self-hosted or reused runner
      # carries one run's reference data into the next.
      - name: tear the stack down
        if: always()
        run: just migration-tier1-down

      - name: remove the candidate registry
        if: always()
        run: node .github/scripts/migration-artifact.mjs cleanup

  # Tier-2 ruler substrate + the @tier2 Gherkin scenarios (Layer 14). Same
  # shape as migration-tier1, over the Tier-1 compose file PLUS
  # tiers/tier2-ruler's, merged into the one compose project
  # (see docker-compose.ruler.yml's header comment).
  #
  # `needs: migration-tier1` is a real ordering constraint, not tidiness: docs
  # section 8 builds firing parity on top of proven query parity, and every
  # @tier2 scenario reads the same cerberus/ClickHouse pair Tier 1 proves. A
  # green tier-2 over a red tier-1 would be a verdict about nothing.
  migration-tier2:
    name: migration-tier2
    needs: [migration-setup, migration-tier1]
    # `tiers` is emit's own answer to "what does this run execute", so the gate
    # and the roll-up read the same source and cannot disagree. A dispatch that
    # narrows to another tier must not pay for this stack.
    if: contains(fromJSON(needs.migration-setup.outputs.tiers), 'tier2')
    runs-on: ubuntu-latest
    # Strictly larger than Tier 1's: the same stack plus the ruler leg, and the
    # scenarios then wait on real evaluation cadences (a rule-group tick, an
    # alert hold-down, a notification-policy flush) that no runner speed
    # shortens. Mirrors TIER2_TIMEOUT_MIN in migration-e2e.mjs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # See the identical block in migration-tier1 — this stack is a strict
      # superset of that one, so the disk pressure is strictly worse.
      - name: Disk free (before reclaim)
        run: df -h
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main as of 2026-06-18
        with:
          docker-images: false
          large-packages: false
          tool-cache: false
      - name: Disk free (after reclaim)
        run: df -h

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2.85.10
        with:
          tool: just

      # An unreachable Docker Hub no longer takes this job down with it: the
      # login exhausts its retries on a transport fault and downgrades the job
      # to MIRROR-ONLY (registry-login.mjs), where every image comes from the
      # mirror and one the mirror cannot serve fails the job naming itself
      # rather than being pulled anonymously. A quota refusal or a rejected
      # credential still fails here on the first attempt.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_HUB_PAT_SET == 'true' }}
        env:
          DOCKER_HUB_PAT_SET: ${{ secrets.DOCKER_HUB_PAT != '' }}
          USERNAME: tsouza
          PASSWORD: ${{ secrets.DOCKER_HUB_PAT }}
        run: node .github/scripts/registry-login.mjs

      - name: download migration scenarios enumeration
        uses: actions/download-artifact@v8
        with:
          name: migration-scenarios
          path: build

      - uses: ./.github/actions/resolve-migration-artifact
        with:
          candidate-artifact: ${{ inputs.candidate_artifact }}
          candidate-digest: ${{ inputs.candidate_digest }}
          expect-version: ${{ inputs.expect_version }}
          source-sha: ${{ inputs.source_sha }}
          source-tree: ${{ inputs.source_tree }}

      - name: bring the Tier-2 stack up
        run: just migration-tier2-up

      - name: seed the Tier-2 stack
        run: just migration-tier2-seed

      # Gherkin first, substrate self-check second — the same ordering
      # migration-tier2-run's Justfile recipe documents: both halves assert a
      # notification arrived by bracketing their own trigger with a read of the
      # ONE dead-end receiver's count, so they must not observe each other's
      # traffic. Two steps rather than one `just migration-tier2-run` so a
      # Gherkin failure and a substrate failure are separate lines in the log.
      - name: run the Tier-2 Gherkin scenarios
        run: node .github/scripts/migration-e2e.mjs
        env:
          MODE: run
          SCENARIOS_JSON: build/migration-scenarios.json
          TIER: tier2
          STORY: ${{ inputs.story }}

      # Same evidence contract as migration-tier0's and migration-tier1's
      # uploads: the report the Gherkin step's MODE=run wrote is what
      # migration-aggregate's MODE=attest holds every counted @tier2 scenario
      # to. Without it the aggregate downloads two reports for three tiers and
      # every @tier2 story reads as enumerated-but-never-run — which is what it
      # did, while the tier itself was passing all five scenarios.
      - name: upload the tier run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-report-tier2
          path: build/migration-reports/*.json
          retention-days: 1
          if-no-files-found: warn

      - name: Tier-2 ruler substrate assertions
        run: go test -tags=migration_tier2 -count=1 ./test/e2e/migration/

      - name: upload seed manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-tier2-manifest
          path: test/e2e/migration/.out/manifest*.json
          if-no-files-found: warn

      # Before teardown, for the same reason as migration-tier1's dump. Grafana
      # and the write-back bridge are in the service list, since a Tier-2
      # failure is usually a rejected rule fixture or a dropped write-back
      # sample rather than anything a scenario message can name.
      - name: dump the Tier-2 compose state and logs on failure
        if: failure()
        run: just migration-tier2-logs

      - name: tear the stack down
        if: always()
        run: just migration-tier2-down

      - name: remove the candidate registry
        if: always()
        run: node .github/scripts/migration-artifact.mjs cleanup

  # Roll-up. `contains(needs.*.result, 'failure')` is the shape e2e.yml
  # documents as unsafe: a job rolls up to `cancelled`, not `failure`, when it
  # is cancelled, so a cancelled tier would pass the fold silently.
  # The fold is `MODE=rollup` rather than inline bash because it is real logic
  # — it holds every tier emit SELECTED to `success`, and separately refuses a
  # tier that ran without being selected — and this repo keeps that in a .mjs
  # so it is testable (see .github/scripts/README.md).
  migration-aggregate:
    name: migration-e2e
    needs: [migration-setup, migration-tier0, migration-tier1, migration-tier2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The enumeration the ratchet counted, and every tier's run report. Both
      # halves of the attestation live here rather than in a tier job, because
      # attestation is a statement about the WHOLE run: one tier cannot know
      # that another was skipped.
      #
      # Gated on migration-setup having succeeded only because a failed setup
      # publishes no enumeration to attest AGAINST — the roll-up below runs
      # unconditionally and fails the lane on that case with the honest
      # message, so nothing is waved through.
      - name: download migration scenarios enumeration
        if: needs.migration-setup.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: migration-scenarios
          path: build

      - name: download the tier run reports
        if: needs.migration-setup.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: migration-report-*
          merge-multiple: true
          path: build/migration-reports

      # The execution gate. Coverage means EXECUTED, not enumerated: every
      # scenario the ratchet counts for a SELECTED tier must appear in a run
      # report with every step passed. Selection comes from the same
      # `tiers` output the roll-up below reads, so a dispatch narrowed to
      # `tier=tier0` does not fail because tier1's scenarios did not run —
      # and a tier that WAS selected but got skipped by a `needs:` cascade
      # cannot pass by leaving no evidence.
      - name: attest that every counted scenario executed
        if: needs.migration-setup.result == 'success'
        run: node .github/scripts/migration-e2e.mjs
        env:
          MODE: attest
          SCENARIOS_JSON: build/migration-scenarios.json
          REPORT_DIR: build/migration-reports
          EXPECTED_TIERS: ${{ needs.migration-setup.outputs.tiers }}
          STORY: ${{ inputs.story }}

      - name: roll up the migration lane
        if: always()
        run: node .github/scripts/migration-e2e.mjs
        env:
          MODE: rollup
          SETUP_RESULT: ${{ needs.migration-setup.result }}
          EXPECTED_TIERS: ${{ needs.migration-setup.outputs.tiers }}
          RESULT_TIER0: ${{ needs.migration-tier0.result }}
          RESULT_TIER1: ${{ needs.migration-tier1.result }}
          RESULT_TIER2: ${{ needs.migration-tier2.result }}
