name: auto-merge-deps

# Queues Dependabot PRs that meet two conditions into the Mergify merge
# queue (.github/mergify.yml) by adding the `queue` label:
#
#  1. The PR was opened by dependabot[bot] (job-level actor guard).
#  2. The update-type matches the allowed set for the affected dep
#     (patch-only for upstream parsers; patch+minor for GitHub Actions).
#
# Trigger is `pull_request` — the pattern GitHub documents for
# Dependabot auto-merge. An earlier revision chained off
# `workflow_run: [ci]` so non-Dependabot PRs wouldn't grow a "Skipped"
# `queue-trusted-bump` entry in their checks list, but
# `dependabot/fetch-metadata` only reads `pull_request` /
# `pull_request_target` event payloads — on `workflow_run` it
# hard-fails with "Event payload missing pull_request key", so the
# workflow never queued a PR even once (0 successes across its
# entire run history; every real Dependabot CI completion produced a
# red run). The skipped-check entry on human PRs is the accepted
# cosmetic cost of using the action the way it's designed.
#
# Dependabot-triggered workflow runs get a read-only GITHUB_TOKEN by
# default; the explicit `permissions` block elevates exactly the scope
# labelling a pull request needs.
#
# The queue still gates the actual merge: it brings the PR up to date
# with main, waits for every check the main ruleset requires to pass on
# that head, and only then squash-merges. Labelling never bypasses a
# required check. See docs/upstream-forks.md for the full rationale.

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  queue-trusted-bump:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch-only auto-merge covers the modules that flow through
      # tsouza/* forks. The forks-monitor cron only mints tags when
      # commits touch the narrow cerberus subtree, so any tag-bump PR
      # opened by Dependabot here is by construction "an upstream change
      # that affects us". CI is still the merge gate via branch
      # protection.
      - name: Queue trusted patch-only bumps
        if: |
          (steps.meta.outputs.update-type == 'version-update:semver-patch' &&
            (contains(steps.meta.outputs.dependency-names, 'github.com/prometheus/prometheus') ||
             contains(steps.meta.outputs.dependency-names, 'github.com/grafana/loki/v3') ||
             contains(steps.meta.outputs.dependency-names, 'github.com/grafana/tempo') ||
             contains(steps.meta.outputs.dependency-names, 'github.com/grafana/dskit') ||
             contains(steps.meta.outputs.dependency-names, 'github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter') ||
             contains(steps.meta.outputs.dependency-names, 'github.com/open-telemetry/opentelemetry-collector-contrib/internal/coreinternal') ||
             contains(steps.meta.outputs.dependency-names, 'github.com/open-telemetry/opentelemetry-collector-contrib/pkg/core/xidutils') ||
             contains(steps.meta.outputs.dependency-names, 'github.com/open-telemetry/opentelemetry-collector-contrib/pkg/translator/jaeger') ||
             contains(steps.meta.outputs.dependency-names, '@playwright/test')))
          ||
          (steps.meta.outputs.package-ecosystem == 'github_actions' &&
            (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
             steps.meta.outputs.update-type == 'version-update:semver-minor'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit --add-label queue -R "$REPO" "$PR_NUMBER"
