name: strict-scan

# Strict-scan differential lane: executes the matrix-shaped spec golden SQL
# corpus against a REAL ClickHouse (spun up via testcontainers-go) through the
# production cursor's strict positional scan, and fails on any type-coercion
# error.
#
# Why this lane exists: the chdb-tagged round-trip goldens and the text goldens
# are both structurally BLIND to a documented production incident class. chDB
# (libchdb, an embedded ClickHouse behind chdb-go's Parquet driver) leniently
# COERCES result-column types into the Go destinations a Scan supplies — a
# UInt8/UInt64 column lands happily in a *float64. Production cerberus does NOT
# use chDB: it talks to a real ClickHouse over the native protocol via
# clickhouse-go/v2, whose Scan is STRICT — a column type that doesn't match the
# destination is a hard error (code 47, "cannot convert", "converting … to …"),
# which the API layer surfaces to Grafana as a 502. An emitter that projects a
# Value column as a CH integer expression instead of wrapping it in
# toFloat64(...) passes every chDB golden yet 502s in production; the chdb cells
# only ever observe the COERCED value, so they can never catch the emit-type
# bug. This lane re-runs the same emitted SQL (native Map / DateTime64 / Float64
# columns — NOT the chDB toJSONString Map-wrap that masks the divergence)
# through the exact production cursor scan, so a type mismatch fails here exactly
# as it would in prod. See test/spec/strictscan_integration_test.go.
#
# A REQUIRED status check on main. It pulls a ClickHouse image and starts a
# container, so it is one of the slower lanes, but it is the only gate that
# observes the strict production scan — nothing else in the required set can
# catch the emit-type class described above. It runs on PRs (blocking),
# push-to-main, and nightly to catch drift.

on:
  push:
    # `release/*.x` so `strict-scan` also runs on a maintenance-line hotfix
    # push — release.yml's preflight is the only gate on that path (no PR, so
    # no branch protection) and it requires this check-run to exist.
    branches: [main, 'release/*.x']
  pull_request:
  # `strict-scan` is a required context and must post on the projected trunk.
  merge_group:
  workflow_dispatch:
  schedule:
    # nightly at 04:45 UTC (offset from the chdb 04:00 and schema 04:30 lanes)
    - cron: '45 4 * * *'

permissions:
  contents: read
  # Pulling this project's own mirrored copies of the upstream images out of
  # ghcr.io (.github/scripts/lib/mirror.mjs); the packages are private.
  packages: read

concurrency:
  group: strict-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs short-circuit the Docker work. See ci.yml / chdb.yml for the
  # `every` predicate-quantifier rationale.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.compute.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.markdown'
              - '!docs/**'
              - '!LICENSE*'
              - '!CHANGELOG.md'
              - '!.markdownlint*'
              - '!CLAUDE.md'
              - '!AGENTS.md'
              - '!README*'

      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.filter.outputs.code }}" = "false" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  strict-scan:
    name: strict-scan
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Generous: the lane pulls one ClickHouse image and seeds + executes the
    # full matrix-shaped golden corpus (~330 fixtures) against it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf  # v2.85.5
        with:
          tool: just

      # The mirror below is reached for FIRST, but a mirror miss falls back to
      # Docker Hub — and that fallback spends the anonymous shared
      # per-runner-IP quota unless this step has run.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_HUB_PAT_SET == 'true' }}
        env:
          DOCKER_HUB_PAT_SET: ${{ secrets.DOCKER_HUB_PAT != '' }}
          USERNAME: tsouza
          PASSWORD: ${{ secrets.DOCKER_HUB_PAT }}
        run: node .github/scripts/registry-login.mjs

      # Cerberus's own copy of every upstream image this job pulls lives in a
      # PRIVATE GHCR namespace, and `pullImageWithRetry` reaches for it before
      # Docker Hub. That reach works only once this step has written ghcr.io
      # credentials; without it the pull falls back to the shared anonymous
      # Docker Hub quota. See .github/scripts/lib/mirror.mjs.
      - name: Log in to the image mirror (GHCR)
        env:
          REGISTRY: ghcr.io
          USERNAME: ${{ github.repository_owner }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/registry-login.mjs

      - name: Run strict-scan differential (real ClickHouse)
        run: just strict-scan-test

      # The router-calibration corpus has two CH seams — the WRITE path
      # (optcorpus.CHTableSink: real CREATE DDL + columnar Enum8 batch) and the
      # READ path (routerrules.chCorpusSource: strict-scanned aggregates) — that
      # run against a real ClickHouse via clickhouse-go/v2 in production but,
      # being OFFLINE (never on the data plane), are exercised nowhere in CI:
      # compose-smoke / e2e drive the gateway, and their only unit coverage uses
      # a no-op fake batch / chDB (which leniently coerces integer columns into
      # *float64 — the exact #1064 strict-scan blind spot). This step runs both
      # seams through the same testcontainers real-CH harness this lane already
      # owns. See internal/routerrules/realch_integration_test.go.
      - name: Run router-corpus write+read differential (real ClickHouse)
        run: just router-corpus-integration

      # The TraceQL whole-trace drilldown legs (Grafana Traces Drilldown
      # Structure + Comparison tabs) read otel_traces through recursive CTEs and
      # matrix metric scans. PR #1154 made "every spans scan is resource-bounded"
      # an invariant; its delta-N1 prune embeds a NON-recursive `TraceId IN
      # (SELECT …)` subquery inside a recursive arm, a shape ClickHouse rejects
      # with error 49 if mis-emitted. The chDB round-trip lane does not execute
      # these recursive-CTE drilldown shapes, so that seam is invisible to it.
      # This step lowers + emits the real Structure + Comparison queries and runs
      # them against the real ClickHouse this lane already owns, proving they
      # execute without error 49, that partition pruning fires at runtime, and
      # that the compare scan fails closed on an absent window. See
      # test/spec/traces_scan_resource_bound_integration_test.go.
      - name: Run TraceQL spans-scan resource-bound differential (real ClickHouse)
        run: just traces-scan-bound-integration

      # The Tempo HTTP traces-scan WINDOW invariant (#1154's follow-up,
      # tracked as an orphaned test by #1509): `TraceId IN (<seed>)` membership
      # prunes NO partitions on its own (otel_traces is PARTITION BY
      # toDate(Timestamp)), so the recursive numbering / structural closures
      # and the compare root-lookup rely on the request-window predicate
      # sitting DIRECTLY on the physical scan to prune. This step drives the
      # real /api/search + /api/metrics/query_range handlers against a real
      # ClickHouse seeded with a dataset that is small inside the request
      # window but large across out-of-window partitions, under a session
      # memory cap, and asserts each drilldown query both completes (no
      # ClickHouse memory error 241) and reads strictly fewer rows than the
      # whole table. The test existed fully written but was wired into no CI
      # lane before #1509. See
      # internal/api/tempo/traces_scan_window_integration_test.go.
      - name: Run Tempo traces-scan WINDOW differential (real ClickHouse)
        run: just traces-scan-window-integration

      # The failure-driven route memo's mandatory per-shard memory
      # apportionment (Executor.runShard) stamps a max_memory_usage override
      # via chclient.WithQuerySetting. chDB is known-lenient about settings
      # in ways the real clickhouse-go/v2 driver isn't (the same class of
      # blind spot this lane documents for type coercion), so only a real
      # ClickHouse server can prove the setting is actually forwarded AND
      # enforced server-side. See internal/solver/executor_realch_integration_test.go.
      - name: Run solver memory-apportionment differential (real ClickHouse)
        run: just solver-memory-apportion-integration

      # Route B (the sharded-pushdown solver) has no lane that drives it
      # against a real ClickHouse server through the real production
      # emitter — every other route-B test either runs entirely on chDB
      # (compatibility/prometheus-forced-route) or drives a fake emitter
      # that returns identical hand-written SQL for every shard regardless
      # of the input plan (solver-memory-apportion-integration, above,
      # which proves a SETTING is honoured, not that a real plan's
      # per-shard SQL is correct). A route-B-specific emit-type bug would
      # therefore pass every existing gate and 502 on its first real
      # sharded query — exactly the strict-scan blind spot this lane
      # exists for, on the OOM-relief path that runs hardest when a
      # deployment is already under memory pressure. This step answers the
      # identical query_range request once via route A and once forced
      # route B, both against the SAME real ClickHouse, and asserts the
      # results are byte-identical. See
      # internal/api/prom/handler_route_b_realch_integration_test.go.
      - name: Run route-B real-CH result differential (real ClickHouse)
        run: just route-b-differential-integration

      # The Loki + Prometheus metadata/label-values endpoints (/series,
      # /labels, /label/<name>/values, /index/stats, /index/volume,
      # /metadata) call a chclient.Client decoder method directly from the
      # handler — QueryLabelSets / QueryIndexStats / QueryStrings /
      # QueryIndexVolume / QueryMetricMeta — bypassing engine.QueryPlan
      # entirely, so the SQL these handlers build is exactly what
      # production sends. Every other spec fixture is query-body-shaped (a
      # PromQL/LogQL/TraceQL string that lowers into a chplan); these
      # endpoints are matcher + time-range driven and carried no fixture
      # corpus at all before this step (#1634) — the same strict-scan blind
      # spot documented above, left open on six decoder methods never
      # exercised against a real server. This step drives a real
      # loki.Handler + prom.Handler through one real case per endpoint
      # against a real ClickHouse. See
      # test/spec/metadata_endpoints_realch_integration_test.go.
      - name: Run metadata-endpoints real-CH differential (real ClickHouse)
        run: just metadata-endpoints-integration

      # TestHistogram_RealExporterSchema_Integration provisions the table
      # shapes the REAL upstream clickhouseexporter creates — LowCardinality-
      # keyed attribute maps (Map(LowCardinality(String), String), not the
      # plain Map(String, String) every other fixture uses) and the
      # exponential-histogram table under its true name,
      # otel_metrics_exponential_histogram — and drives the Prometheus HTTP
      # surface with columnar_result_decode ON. Every other layer validates
      # cerberus against a fixture cerberus itself created, so the seed DDL
      # and the reader always agree; this is the only test that pins a native
      # exp-histogram quantile against the real exporter table name, the
      # columnar-decode fall-back off a LowCardinality-keyed map, and
      # classic-histogram _bucket/_count/_sum discovery off the real schema.
      # Was gated behind the `integration` build tag but wired into no CI
      # lane (#1642); this step reuses the real ClickHouse image this job
      # already pre-pulls rather than adding a new substrate. See
      # internal/api/prom/handler_histogram_integration_test.go.
      - name: Run histogram real-exporter-schema differential (real ClickHouse)
        run: just histogram-realexporter-integration

      # Whether a pooled ClickHouse connection SURVIVES a cursor teardown is
      # observable only against a real driver + server: clickhouse-go releases a
      # connection when a query ends on a live context and destroys the socket
      # when it ends on a cancelled one, and the difference shows up purely as a
      # pool statistic. chDB has no pool, and a fake cursor cannot model either
      # branch, so every layer below this one passes identically whichever
      # ordering the gateway uses. This step drives both orderings through the
      # real driver and asserts the pool. See
      # internal/chclient/conn_teardown_integration_test.go.
      - name: Run chclient connection-teardown differential (real ClickHouse)
        run: just chclient-integration
