# `forbid-deferral` is the sibling of `forbid-skip` for PROSE. Where
# forbid-skip rejects a test that declines to assert, this rejects a change that
# names work it is not doing and walks away: the repository's rule is that
# out-of-scope findings become GitHub Issues, never a sentence in a PR body, a
# commit message, or a comment.
#
# Scope is the change's OWN additions — the description, the commit messages in
# its range, and the `+` lines of its diff. The tree at large is not scanned,
# because the phrases involved are also ordinary architecture prose ("out of
# scope for the unknown-name fan-out" describes a boundary, not a deferral), and
# a gate that fired on those would be unusable — an unusable gate gets routed
# around, which is worse than no gate. This is scoping, not an allow-list: there
# is no tolerance file and no way to park a violation. The one accepted
# resolution is an OPEN issue cited next to the marker.
#
# The commit-message surface is not decoration. A sweep of all 1326 commits on
# `main` found 217 carrying deferral text, and 178 of those carry it ONLY in
# intra-branch commit messages — absent from the PR description entirely. A
# description-only gate would miss ~82% of the real population.
#
# WHY THIS IS ITS OWN WORKFLOW rather than a job in ci.yml, where it started:
# one of this gate's three surfaces is the PR DESCRIPTION, and its own remedy
# text asks the author to edit that description. `ci.yml` triggers on a bare
# `pull_request:`, which means opened + synchronize + reopened — `edited` is NOT
# in the default set. A body fixed exactly as instructed therefore produced no
# new check-run and the stale red stood; the only escape was an empty commit
# that re-ran the whole ~20-job suite to re-read one paragraph. As a REQUIRED
# check that is a deadlock: a body-only violation has no code to push. Adding
# `types:` to ci.yml would re-run everything on every title tweak, so the gate
# moves here instead, where `edited` costs a checkout and two node invocations.
name: forbid-deferral

on:
  pull_request:
    # `edited` is the whole reason this workflow is separate — see above. It
    # fires on a description or title change, which is precisely how a body-only
    # violation gets fixed. `ready_for_review` covers a draft being promoted.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    # push-to-main and to the maintenance lines so the check-run also posts on
    # the commit being shipped, which is what release.yml's preflight and
    # release-gate-drift.yml read.
    branches: [main, 'release/*.x']
  # The queue builds a projected trunk and dispatches `merge_group` against it.
  # `forbid-deferral` is a required context, so a workflow that did not declare
  # this trigger would never post the check-run there and every queued entry
  # would sit unmergeable until it timed out — the failure this gate's own
  # regression pin (`TestEveryRequiredContextPostsOnTheMergeGroup`) exists to
  # reject. The surface on a queue run is the same one a push resolves: the
  # head commit's associated pull request.
  merge_group:

permissions:
  contents: read

concurrency:
  # Successive edits to one description supersede each other; the last body is
  # the only one that matters. Pushes to main are never cancelled, and neither
  # are queue runs: GitHub reads a cancelled check-run as a failure and dequeues
  # the entry, so this expression must stay provably false on `merge_group`.
  group: forbid-deferral-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  forbid-deferral:
    name: forbid-deferral
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Every cited number is resolved through the API: a deferral is only
      # tracked if the number names an issue (not a pull request) that is open.
      issues: read
      # On a push there is no event payload body, so the description surface is
      # resolved from the head commit's associated pull request.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate walks a commit range and diffs base against head.
          fetch-depth: 0
      # Pure-unit guard over the marker table, the two scanners and the verdict.
      # It runs FIRST and it is the anti-hollow-green pin: it proves each table
      # row fires on a real example AND that the measured false-positive shapes
      # (Go's `defer` statement, the phrase used to record COMPLETED work, a
      # change that only DELETES a marker line, and a heading whose section
      # cites its issue below it) stay clean. A gate never shown to reject is
      # indistinguishable from one that inspects nothing.
      - name: Assert the deferral scanner matches, and does not over-match
        run: node --test .github/scripts/forbid-deferral.test.mjs
      - name: Reject untracked deferrals
        run: node .github/scripts/forbid-deferral.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bodies are attacker-controlled: passed via env, never interpolated
          # into a shell `run:` line.
          PR_BODY: ${{ github.event.pull_request.body }}
          # Each event names its own range start. A merge group carries neither
          # `pull_request.base.sha` nor `event.before`, so without its own term
          # the range would collapse to `HEAD^` and inspect one commit of a
          # batch. `github.sha` already IS the merge group's head commit, so the
          # range end below needs no extra term.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # test/rejection-parity/catalogue/'s class=divergence entries carry
      # the same tracking-issue liveness contract this job already enforces
      # for deferral markers, just read off the catalogue's own state instead
      # of a diff — see rejection-parity-divergence-liveness.mjs's header. It
      # runs unconditionally (not diff-scoped) because the failure mode it
      # exists to catch is someone closing the tracking issue without ever
      # touching this repository's tree at all.
      - name: Assert the divergence liveness scanner matches
        run: node --test .github/scripts/rejection-parity-divergence-liveness.test.mjs
      - name: Reject a divergence entry with a dead tracking-issue citation
        run: node .github/scripts/rejection-parity-divergence-liveness.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # #2370's same-PR obligation gate: a change to a memory-bounding
      # settings file (internal/engine/query_settings_rules.go,
      # internal/engine/spill.go) must add sentinel coverage or cite an
      # open-issue waiver — the same #2364 postmortem this whole lane
      # traces back to. Reuses forbid-deferral.mjs's own citation-
      # resolution machinery, so it rides this same job/workflow rather
      # than re-deriving the PR-description-as-a-surface trigger setup
      # above (the `edited` type is exactly as load-bearing for a
      # waiver-in-the-body fix as it is for a deferral-marker one).
      - name: Assert the perf-sentinel obligation scanner matches
        run: node --test .github/scripts/perf-sentinel-obligation.test.mjs
      - name: Reject a memory-bounding change with no sentinel coverage or waiver
        run: node .github/scripts/perf-sentinel-obligation.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # #2899's merge-risk gate: what this PR's green does NOT cover. It rides
      # this job for the same reason the obligation gate above does — it needs
      # the full history a `fetch-depth: 0` checkout gives, and it is a required
      # context on every PR without adding a new one to branch protection.
      # `origin/main` is fetched explicitly first: a `pull_request` checkout
      # populates the PR refs, not the target branch's remote-tracking ref, and
      # the stale-base half compares against it.
      #
      # WHY THIS JOB NOW SETS GO UP. Since #2902 the gate attributes a change to
      # a lane through the Go import graph rather than through the lane's
      # declared `package_globs`, because those globs name only each head's own
      # directories and so missed PR #2824 — the change that caused #2895 —
      # entirely. Reading the graph needs `go list`. Measured against this
      # repository: the wrapper costs ~16s on a warm module cache, and the
      # derivation ~20s (one `go list -json ./...` per distinct build-tag set,
      # not one per lane, which would be ~80s). That is the price of the
      # attribution being right; a Go-less job could only have kept the wrong
      # one. The wrapper — never `actions/setup-go` directly — is what
      # `assert-go-setup-hardened.mjs` requires, and it also keeps this job from
      # archiving an empty module cache.
      - uses: ./.github/actions/setup-go
      - name: Fetch the merge target for the stale-base comparison
        run: git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
      - name: Assert the lane affected-path derivation matches, and does not over-match
        run: node --test .github/scripts/lib/lane-closure.test.mjs
      - name: Assert the merge-risk scanner matches, and does not over-match
        run: node --test .github/scripts/merge-risk.test.mjs
      - name: Reject a golden shard regenerated against a base main has moved past
        run: node .github/scripts/merge-risk.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
