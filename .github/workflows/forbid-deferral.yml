# `forbid-deferral` is the sibling of `forbid-skip` for PROSE. Where
# forbid-skip rejects a test that declines to assert, this rejects a change that
# names work it is not doing and walks away: the repository's rule is that
# out-of-scope findings become GitHub Issues, never a sentence in a PR body, a
# commit message, or a comment.
#
# Scope is the change's OWN additions — the description, the commit messages in
# its range, and the `+` lines of its diff. The tree at large is not scanned,
# because the phrases involved are also ordinary architecture prose ("out of
# scope for the unknown-name fan-out" describes a boundary, not a deferral), and
# a gate that fired on those would be unusable — an unusable gate gets routed
# around, which is worse than no gate. This is scoping, not an allow-list: there
# is no tolerance file and no way to park a violation. The one accepted
# resolution is an OPEN issue cited next to the marker.
#
# The commit-message surface is not decoration. A sweep of all 1326 commits on
# `main` found 217 carrying deferral text, and 178 of those carry it ONLY in
# intra-branch commit messages — absent from the PR description entirely. A
# description-only gate would miss ~82% of the real population.
#
# WHY THIS IS ITS OWN WORKFLOW rather than a job in ci.yml, where it started:
# one of this gate's three surfaces is the PR DESCRIPTION, and its own remedy
# text asks the author to edit that description. `ci.yml` triggers on a bare
# `pull_request:`, which means opened + synchronize + reopened — `edited` is NOT
# in the default set. A body fixed exactly as instructed therefore produced no
# new check-run and the stale red stood; the only escape was an empty commit
# that re-ran the whole ~20-job suite to re-read one paragraph. As a REQUIRED
# check that is a deadlock: a body-only violation has no code to push. Adding
# `types:` to ci.yml would re-run everything on every title tweak, so the gate
# moves here instead, where `edited` costs a checkout and two node invocations.
name: forbid-deferral

on:
  pull_request:
    # `edited` is the whole reason this workflow is separate — see above. It
    # fires on a description or title change, which is precisely how a body-only
    # violation gets fixed. `ready_for_review` covers a draft being promoted.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    # push-to-main and to the maintenance lines so the check-run also posts on
    # the commit being shipped, which is what release.yml's preflight and
    # release-gate-drift.yml read.
    branches: [main, 'release/*.x']

permissions:
  contents: read

concurrency:
  # Successive edits to one description supersede each other; the last body is
  # the only one that matters. Pushes to main are never cancelled.
  group: forbid-deferral-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  forbid-deferral:
    name: forbid-deferral
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Every cited number is resolved through the API: a deferral is only
      # tracked if the number names an issue (not a pull request) that is open.
      issues: read
      # On a push there is no event payload body, so the description surface is
      # resolved from the head commit's associated pull request.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate walks a commit range and diffs base against head.
          fetch-depth: 0
      # Pure-unit guard over the marker table, the two scanners and the verdict.
      # It runs FIRST and it is the anti-hollow-green pin: it proves each table
      # row fires on a real example AND that the measured false-positive shapes
      # (Go's `defer` statement, the phrase used to record COMPLETED work, a
      # change that only DELETES a marker line, and a heading whose section
      # cites its issue below it) stay clean. A gate never shown to reject is
      # indistinguishable from one that inspects nothing.
      - name: Assert the deferral scanner matches, and does not over-match
        run: node --test .github/scripts/forbid-deferral.test.mjs
      - name: Reject untracked deferrals
        run: node .github/scripts/forbid-deferral.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bodies are attacker-controlled: passed via env, never interpolated
          # into a shell `run:` line.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
