name: update-golden

# Manual golden regeneration for an existing same-repository branch. Generation
# fans out by requested shard with read-only credentials. Matrix legs upload
# shard-owned patches; one trusted publisher validates and pushes them together,
# avoiding both concurrent non-fast-forward pushes and line-merging generated
# artifacts. RELEASE_PAT is required because GitHub suppresses workflow triggers
# for pushes made with the default GITHUB_TOKEN.
#
# The target branch is not otherwise visible on a run: the Actions API never
# exposes workflow_dispatch INPUTS outside the run itself (only head_branch,
# which for a dispatch is the ref the workflow was TRIGGERED from — always
# main here, never the target). update-golden-guard.yml (issue #2350) has to
# tell which branch an in-flight run targets from OUTSIDE that run, to block a
# merge racing it, and this is the one field the list-runs API does expose.
# Keep the exact `update-golden[<branch>]` shape in sync with that workflow's
# runTargetsBranch().
run-name: update-golden[${{ inputs.branch }}]
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Space/comma-separated update-golden shards, or all
        required: true
        type: string
      branch:
        description: Existing same-repository branch to regenerate and push
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-golden-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: update-golden contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test .github/scripts/manual-golden-update.test.mjs

  plan:
    name: plan golden shards
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      # has_regenerate_rows / cardinality_selected tell an EMPTY downstream
      # matrix or an intentionally-skipped job apart from one that never ran —
      # the same ambiguity mutation.yml's `has_phases` exists to remove. Both
      # can legitimately be empty: `shards=cardinality` alone leaves
      # `matrix.include` empty (cardinality is sharded separately, see the
      # `cardinality-leg`/`cardinality-seal` jobs below), and any dispatch that
      # does not name `cardinality` leaves the cardinality jobs with nothing to
      # do.
      has_regenerate_rows: ${{ steps.plan.outputs.has_regenerate_rows }}
      cardinality_selected: ${{ steps.plan.outputs.cardinality_selected }}
      cardinality_predecessors: ${{ steps.plan.outputs.cardinality_predecessors }}
    steps:
      - name: Checkout trusted workflow controller
        uses: actions/checkout@v7

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Validate dispatch and build matrix
        id: plan
        env:
          MODE: plan
          TARGET_ROOT: target
          BRANCH: ${{ inputs.branch }}
          SHARDS_INPUT: ${{ inputs.shards }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
          PUSH_TOKEN_SET: ${{ secrets.RELEASE_PAT != '' }}
        run: node .github/scripts/manual-golden-update.mjs

      - name: Verify requested shards cover the target branch diff
        working-directory: target
        env:
          GOLDEN_SHARDS: ${{ steps.plan.outputs.shards }}
          GOLDEN_UPDATE_BASE_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
          GOLDEN_UPDATE_CHECK_ONLY: '1'
        run: node "$GITHUB_WORKSPACE/.github/scripts/golden-update.mjs"

  # One matrix row per selected shard EXCEPT `cardinality`, which is sharded
  # further into its own `cardinality-leg` matrix below (#2341) rather than
  # regenerated by a single row here — see manual-golden-update.mjs's header.
  #
  # The `if:` also requires has_regenerate_rows: a dispatch selecting only
  # `cardinality` leaves this matrix empty, and an EMPTY strategy.matrix
  # never creates a job run at all (it reports `skipped`, not `success`) —
  # gating the job itself off the same way mutation.yml gates `mutate` off
  # `has_phases` is what keeps that a deliberate, legible skip rather than a
  # matrix silently expanding to zero.
  regenerate:
    name: regenerate (${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.has_regenerate_rows == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # One shard's failure must not cancel every other concurrent shard's
      # in-progress run: each leg is independent (its own checkout, its own
      # patch), so cancelling a leg that would otherwise have SUCCEEDED
      # discards up to this job's whole 45-minute budget for nothing. With
      # fail-fast off, an unrelated leg still fails on its own merits, but the
      # rest finish and upload their patches — and a follow-up "re-run failed
      # jobs" only has to redo the one shard that actually failed, not every
      # shard in the dispatch (issue #2368).
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout trusted workflow controller
        uses: actions/checkout@v7

      - name: Checkout target commit without write credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          persist-credentials: false
          path: target

      - uses: actions/setup-go@v7
        with:
          go-version-file: target/go.mod
          # Target-branch code runs below. A shared dependency cache would let
          # that code persist bytes into later workflows, crossing the exact
          # read-only boundary this job is meant to provide.
          cache: false

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      - name: Install libchdb.so
        if: matrix.needs_chdb
        working-directory: target
        run: just chdb-install

      - name: Regenerate shard with predecessor context
        working-directory: target
        env:
          GOLDEN_UPDATE_BASE_REF: HEAD
          # test/e2e/migration/lib's AssertGolden refuses to rewrite a golden
          # under plain CI — the rule post-merge-drift.yml needs, since it
          # regenerates unreviewed, directly on main. This leg is the other
          # trust model: read-only credentials, output constrained to this
          # shard's own declared paths by the "Package" step below, and pushed
          # only through the publisher job's own revalidation into a branch
          # that still goes through a reviewed PR. Setting this only here,
          # never in post-merge-drift.yml, keeps that lane's refusal absolute.
          UPDATE_GOLDEN_WORKFLOW: '1'
        run: just update-golden ${{ matrix.command_shards }}

      - name: Package only this shard's generated paths
        env:
          MODE: package
          TARGET_ROOT: target
          SHARD: ${{ matrix.shard }}
          ALLOWED_SHARDS: ${{ matrix.allowed_shards }}
          OUTPUT_PATH: patches/${{ matrix.shard }}.patch
        run: node .github/scripts/manual-golden-update.mjs

      - name: Upload shard patch
        uses: actions/upload-artifact@v7
        with:
          name: golden-patch-${{ matrix.shard }}
          path: patches/${{ matrix.shard }}.patch
          if-no-files-found: error
          retention-days: 1

  # `cardinality-leg` / `cardinality-seal` — the CI-matrix split of the
  # `cardinality` shard's own regeneration (#2341), mirroring mutation.yml's
  # `mutate` (per-phase matrix job) / `mutation` (aggregator) shape:
  #
  #   cardinality-leg   the matrix; each leg profiles ONLY the corpus slice its
  #                     PERF_SHARD_INDEX names, on its OWN runner — the exact
  #                     partition `just update-cardinality-baseline` already
  #                     fans out across PROCESSES inside one job, now fanned
  #                     out across JOBS instead (cardinality-baseline-
  #                     update.mjs's MODE=leg). That is the whole fix: before
  #                     this, N-way parallelism bought at most N/cores of one
  #                     job's wall-clock; now it buys N runners.
  #   cardinality-seal  the aggregator AND the shard's patch producer: applies
  #                     every leg's patch, re-runs TestCardinalityBaselineCovers
  #                     TheCorpus — the same closing assertion the local seal
  #                     step runs — to turn "every leg exited 0" into "the legs
  #                     together covered the corpus" (closing coverage across
  #                     JOBS rather than across processes), then packages the
  #                     result as the one `golden-patch-cardinality` artifact
  #                     `publish` already expects. `publish` therefore needs no
  #                     cardinality-specific code for this split at all.
  #
  # A leg needs its OWN predecessor context first — the freshly regenerated
  # `test/spec/**` `-- sql --` text of every OTHER selected shard, which is
  # exactly what `cardinality` profiles. Rather than re-running that
  # regeneration N times (once per leg, as a literal `cardinality` matrix row's
  # own `command_shards` would have done), each leg downloads and applies the
  # SAME `golden-patch-<shard>` artifacts the `regenerate` matrix above already
  # produced for those shards: the predecessor work happens exactly once,
  # shared by every leg, whether or not cardinality is even selected.
  cardinality-leg:
    name: cardinality-leg (${{ matrix.leg }})
    needs: [plan, regenerate]
    # `always()` because `regenerate` legitimately reports `skipped` — an empty
    # matrix, e.g. `shards=cardinality` alone — as well as `success` (see the
    # has_regenerate_rows comment above `regenerate`). A REAL regenerate
    # failure still blocks: a predecessor's patch would then be missing or
    # stale, and a leg that profiled the previous (uncommitted) SQL text would
    # silently record the wrong baseline.
    if: |
      always() &&
      needs.plan.outputs.cardinality_selected == 'true' &&
      (needs.regenerate.result == 'success' || needs.regenerate.result == 'skipped')
    runs-on: ubuntu-latest
    # Same ceiling as perf-guards-shard's per-leg profiling pass (chdb.yml) —
    # this runs the identical TestCardinalityRatchet call, just in UPDATE mode,
    # over the same partition. A leg finishes in a couple of minutes at today's
    # corpus size; the bound is a hang detector, not an estimate.
    timeout-minutes: 30
    permissions:
      # actions: read is what lets `gh run download` (the predecessor-patch
      # step below) read this run's own artifacts — the same grant `publish`
      # already needed for the identical call.
      actions: read
      contents: read
    strategy:
      # MANDATORY, matching perf-guards-shard and the `regenerate` matrix
      # above: one leg's failure must not cancel its siblings mid-profile.
      fail-fast: false
      matrix:
        # The leg count. Matches BASELINE_FANOUT (cardinality-baseline-
        # update.mjs) and productionShardCount (test/perf/profile/shard_test.go)
        # — an inline literal by the same precedent as perf-guards-shard's own
        # `shard: [1..8]` list in chdb.yml: the partition is computed at RUN
        # TIME from the fixture id, so the matrix carries no membership
        # information and there is nothing for a generator script to compute.
        # test/regression/cardinality_ci_matrix_test.go pins this list against
        # that same count from the Go side.
        leg: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout trusted workflow controller
        uses: actions/checkout@v7

      - name: Checkout target commit without write credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          persist-credentials: false
          path: target

      - uses: actions/setup-go@v7
        with:
          go-version-file: target/go.mod
          cache: false

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      # Deliberately NOT cached, unlike perf-guards-shard's identical-looking
      # step in chdb.yml: THIS job runs the TARGET branch's own (unreviewed)
      # `just chdb-install` recipe (`working-directory: target`, no write
      # credentials) — the same read-only trust boundary `regenerate` above
      # keeps by avoiding `actions/cache@` entirely. perf-guards-shard runs on
      # `pull_request`/`push`/`schedule`, where GitHub scopes a run's cache
      # writes to its own PR/branch; this workflow instead executes an
      # arbitrary `-f branch=` target picked at dispatch time, so a write here
      # could plant a poisoned `libchdb.so` under a well-known cache key for a
      # later, more trusted run to restore. The 45-minute-per-job budget
      # already assumes an uncached install (see `regenerate` above); this
      # costs the same ~500 MB download per leg, not a new cost class.
      - name: Install libchdb.so
        working-directory: target
        run: just chdb-install

      - name: Download predecessor shard patches
        if: needs.plan.outputs.cardinality_predecessors != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --pattern 'golden-patch-*' --dir patches

      # Apply every selected predecessor's patch and commit it, so this leg's
      # OWN packaging step (below) sees only what IT changed. Without the
      # commit, manual-golden-update.mjs's ownership check (assertOwnedChanges)
      # would see the predecessor's paths as "changed but not owned by
      # cardinality" and refuse to package — that check is deliberately
      # whole-tree, not scoped to a pathspec, which is what makes it a real
      # safety check rather than a rubber stamp.
      - name: Apply predecessor context
        if: needs.plan.outputs.cardinality_predecessors != ''
        working-directory: target
        env:
          PREDECESSORS: ${{ needs.plan.outputs.cardinality_predecessors }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          applied=0
          for shard in $PREDECESSORS; do
            patch="../patches/golden-patch-${shard}/${shard}.patch"
            if [ ! -s "$patch" ]; then
              continue
            fi
            git apply --index "$patch"
            applied=1
          done
          if [ "$applied" = "1" ]; then
            git commit -m "predecessor context for cardinality-leg (not published)" --quiet
          fi

      - name: Profile this leg's corpus slice
        working-directory: target
        env:
          MODE: leg
          CHDB_INSTALL_PATH: /usr/local/lib/libchdb.so
          PERF_SHARD_INDEX: ${{ matrix.leg }}
          PERF_SHARD_COUNT: ${{ strategy.job-total }}
        run: node .github/scripts/cardinality-baseline-update.mjs

      - name: Package only this leg's generated paths
        env:
          MODE: package
          TARGET_ROOT: target
          SHARD: cardinality
          ALLOWED_SHARDS: cardinality
          OUTPUT_PATH: patches-out/cardinality-leg-${{ matrix.leg }}.patch
        run: node .github/scripts/manual-golden-update.mjs

      - name: Upload leg patch
        uses: actions/upload-artifact@v7
        with:
          name: cardinality-leg-patch-${{ matrix.leg }}
          path: patches-out/cardinality-leg-${{ matrix.leg }}.patch
          if-no-files-found: error
          retention-days: 1

  cardinality-seal:
    name: cardinality-seal
    needs: [plan, cardinality-leg]
    # Every leg must have actually run for the seal to mean anything: an empty
    # or partially-skipped leg matrix here is exactly the "leg never dispatched"
    # hazard the seal test's own doc comment describes, and `success` is the
    # only leg-matrix result that says every one of the 8 ran and wrote its
    # slice. `always()` is still needed so this job can see and report that
    # gap (a REAL leg failure) rather than being cascaded to `skipped` itself
    # — but the outcome is the same either way: no golden-patch-cardinality
    # artifact, so `publish` below correctly refuses to push.
    if: always() && needs.plan.outputs.cardinality_selected == 'true' && needs.cardinality-leg.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # actions: read is what lets `gh run download` (the leg-patch step
      # below) read this run's own artifacts — the same grant `publish`
      # already needed for the identical call.
      actions: read
      contents: read
    steps:
      - name: Checkout trusted workflow controller
        uses: actions/checkout@v7

      - name: Checkout target commit without write credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          persist-credentials: false
          path: target

      - uses: actions/setup-go@v7
        with:
          go-version-file: target/go.mod
          cache: false

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: just

      # Deliberately NOT cached — same read-only trust-boundary reasoning as
      # `cardinality-leg`'s identical step above.
      - name: Install libchdb.so
        working-directory: target
        run: just chdb-install

      - name: Download every leg's patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --pattern 'cardinality-leg-patch-*' --dir patches

      # No commit here, unlike the leg's own predecessor-context step: the seal
      # test reads test/perf/cardinality-baseline/** straight off disk, and the
      # packaging step below re-stages from scratch (`git add -A`) before
      # diffing, so there is nothing that needs to already be committed first.
      - name: Apply every leg's patch
        working-directory: target
        run: |
          set -euo pipefail
          for patch in ../patches/cardinality-leg-patch-*/*.patch; do
            if [ ! -s "$patch" ]; then
              continue
            fi
            git apply --index "$patch"
          done

      - name: Assert the legs together covered the corpus
        working-directory: target
        env:
          MODE: seal
          CHDB_INSTALL_PATH: /usr/local/lib/libchdb.so
        run: node .github/scripts/cardinality-baseline-update.mjs

      - name: Package the combined cardinality patch
        env:
          MODE: package
          TARGET_ROOT: target
          SHARD: cardinality
          ALLOWED_SHARDS: cardinality
          OUTPUT_PATH: patches/cardinality.patch
        run: node .github/scripts/manual-golden-update.mjs

      - name: Upload shard patch
        uses: actions/upload-artifact@v7
        with:
          name: golden-patch-cardinality
          path: patches/cardinality.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish golden updates
    # `always()` is load-bearing here, not decoration: without it a bare
    # custom `if:` is implicitly ANDed with `success()` by GitHub Actions, so
    # `needs.regenerate.result == 'skipped'` (the legitimate `shards=
    # cardinality`-alone case) would never even be evaluated — the job would
    # just silently not run, cascading the skip instead of the explicit
    # per-need checks deciding.
    #
    # That cascade protection has to be rebuilt by hand once `always()` is
    # in play, which is why every condition below is explicit rather than
    # leaning on GitHub's default: `needs.plan.result == 'success'` (plan
    # itself failing must not read as "nothing to publish"), `regenerate`
    # accepts `skipped` unconditionally (its own `if:` already proves that
    # only ever means "no non-cardinality shard was selected"), and
    # `cardinality-seal` accepts `skipped` ONLY when cardinality was never
    # selected — a `cardinality-seal` skip while cardinality WAS selected
    # means a real `cardinality-leg` failure blocked it, and that must still
    # block the push.
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.plan.result == 'success' &&
      (needs.regenerate.result == 'success' || needs.regenerate.result == 'skipped') &&
      (needs.cardinality-seal.result == 'success' ||
        (needs.cardinality-seal.result == 'skipped' && needs.plan.outputs.cardinality_selected != 'true'))
    needs: [plan, regenerate, cardinality-seal]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted workflow controller
        uses: actions/checkout@v7

      - name: Checkout unchanged target with trigger-capable credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          token: ${{ secrets.RELEASE_PAT }}
          path: target

      - name: Download shard patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --pattern 'golden-patch-*' --dir patches

      - name: Validate, commit, and push once
        id: publish
        env:
          MODE: apply-push
          TARGET_ROOT: target
          PATCH_ROOT: patches
          BRANCH: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHARDS_INPUT: ${{ needs.plan.outputs.shards }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        run: node .github/scripts/manual-golden-update.mjs

      - name: Summary
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
          TARGET_BRANCH: ${{ inputs.branch }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          {
            echo '### Golden update'
            echo
            echo "- Branch: \`$TARGET_BRANCH\`"
            echo "- Shards: \`$SHARDS\`"
            echo "- Changed: \`$CHANGED\`"
            echo "- Result: \`$NEW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
