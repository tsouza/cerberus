name: brew-verify

# ON-DEMAND + weekly re-verification that `brew install tsouza/tap/cerberus`
# still works for an ALREADY-PUBLISHED release.
#
# Why this exists, separately from release.yml's `brew-smoke`:
#   * `brew-smoke` fires exactly once, inside the release run, and only when
#     that run publishes a new version. When it goes red there is no way to
#     re-verify a fix: `rerun-failed-jobs` replays the workflow as it existed
#     at the release commit, so a correction to the job (a different runner, a
#     different tap path) can never be exercised against the release that
#     needed it. v1.12.0 hit exactly that wall.
#   * The tap is a separate repository. A cask can rot after publish —
#     someone edits the tap, an asset is deleted, a checksum stops matching —
#     and nothing in this repo would notice until the NEXT release ran its
#     smoke.
#
# It reuses `brew-smoke.mjs` unchanged, so there is one implementation of what
# "the published cask is healthy" means; this lane only differs in when it
# runs and which version it targets.
#
# The second job, `brew-migration`, covers a different question: not whether a
# fresh install works, but whether an EXISTING formula install is carried across
# to the cask. Every install path CI performs starts from an empty runner and is
# therefore blind to it, which is how cerberus shipped the formula -> cask move
# with no tap_migrations.json and left early adopters running the old binary with
# no error printed anywhere. It lives here rather than in release.yml because it
# takes minutes and re-verifies a property of the TAP, which changes on its own
# schedule.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          BARE app version to verify, e.g. `1.12.0` (no leading `v`). Defaults
          to the repository's latest published non-prerelease release.
        required: false
        type: string
  schedule:
    # Mondays 07:00 UTC, an hour after link-check-external so the two weekly
    # rot detectors do not contend for runners.
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: brew-verify-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  brew-verify:
    name: brew-verify (${{ matrix.os }})
    # Both platforms the cask serves, mirroring release.yml's brew-smoke matrix
    # — see the comment there for why the Linux leg exists and why the Ubuntu
    # image needs a PATH step to reach the Homebrew it already ships.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.os }}
    steps:
      # Resolve the target version BEFORE checkout, because the checkout has to
      # land on that version's tag: the `config-docs -check` payload compares
      # the installed binary's config registry against the working tree's
      # docs/configuration.md, so checking out `main` would compare a released
      # binary against unreleased docs and red on drift that is not a defect.
      - name: Resolve target version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.version }}
        run: |
          # The HIGHEST stable release, not the most recently PUBLISHED one. A
          # maintenance backport publishes after the line above it, so
          # `--limit 1` returned v1.11.3 while v1.13.0 was the newest cerberus.
          # The tap holds one cask and the highest tag owns it, so that is
          # both the right default target and the signal brew-smoke.mjs needs to
          # pick its assertion branch.
          highest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$highest" ]; then
            echo "::error::brew-verify: could not resolve the highest stable release."
            exit 1
          fi
          version="${REQUESTED#v}"
          [ -n "$version" ] || version="$highest"
          if [ "$version" = "$highest" ]; then
            is_latest=true
          else
            is_latest=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "::notice::brew-verify: verifying $version (highest stable $highest, RELEASE_IS_LATEST=$is_latest)"

      - uses: actions/checkout@v7
        with:
          ref: v${{ steps.resolve.outputs.version }}

      # See release.yml's brew-smoke: the Ubuntu image ships Homebrew under
      # /home/linuxbrew but leaves it off PATH.
      - name: put Homebrew on PATH
        if: runner.os == 'Linux'
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew || {
            echo "::error::brew-verify: the ${{ matrix.os }} image no longer ships Homebrew at /home/linuxbrew/.linuxbrew — the Linux leg needs an install step."
            exit 1
          }
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: brew-smoke self-test
        run: node --test .github/scripts/brew-smoke.test.mjs

      - name: install from the tap and smoke the published binary
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          # Verifying a version that is NOT the highest stable tag asserts the
          # tap is still ahead of it, which is the state a maintenance backport
          # must have left behind.
          RELEASE_IS_LATEST: ${{ steps.resolve.outputs.is_latest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}
        run: node .github/scripts/brew-smoke.mjs

  # The upgrade path, which no install-from-empty can see. `brew-verify` above
  # and `brew-smoke` in release.yml both start from a runner with no cerberus on
  # it, so both are structurally blind to what happens to a machine that already
  # had the FORMULA — the shape cerberus shipped through 1.13.1. That gap is how
  # the missing tap_migrations.json reached users: every fresh install was
  # correct while every existing one silently stayed on the old binary.
  #
  # Separate from the job above rather than a step inside it, because it rewinds
  # the tap clone and installs a superseded release: sharing a runner with the
  # published-cask assertions would have each job's brew state decide the other's
  # verdict.
  brew-migration:
    name: brew-migration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Same as the job above: the Ubuntu image ships Homebrew under
      # /home/linuxbrew but leaves it off PATH.
      - name: put Homebrew on PATH
        if: runner.os == 'Linux'
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew || {
            echo "::error::brew-migration: the ${{ matrix.os }} image no longer ships Homebrew at /home/linuxbrew/.linuxbrew — the Linux leg needs an install step."
            exit 1
          }
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: brew-upgrade-path self-test
        run: node --test .github/scripts/brew-upgrade-path.test.mjs

      - name: migrate a formula install to the cask
        run: node .github/scripts/brew-upgrade-path.mjs
