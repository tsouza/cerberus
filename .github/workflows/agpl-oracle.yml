name: agpl-oracle

# Differential oracle lane for the in-house LogQL and TraceQL parser
# reimplementations, plus the drift-check regeneration tests for the
# surface-parity package's pinned reference-verdict artifacts.
#
# The test files in the root module that carry `//go:build agpl_oracle`
# compare cerberus's own clean-room parsers against the upstream AGPL
# reference parsers (grafana/loki/pkg/logql for LogQL; grafana/tempo/pkg/traceql
# for TraceQL). These files are compiled and run by NO other lane (except
# test/property/oracle/logql, additionally exercised — under BOTH `chdb` and
# `agpl_oracle` — by property.yml's LogQL property test) — the default
# `check` gate is CGO-free and passes no build tags beyond the defaults, so
# without this workflow the oracle diffs are never exercised and a parser
# regression can reach main undetected (see #1610 for the full evidence).
#
# Tagged evidence covered:
#   internal/logql/logpattern/pattern_agpl_test.go
#   internal/logql/jsonpath_agpl_test.go
#   internal/logql/parse_permissive_agpl_test.go
#   internal/logql/lsyntax/oracle_agpl_test.go
#   test/agpl_oracle/oracle_test.go
#   test/surface-parity/logql_reference_agpl_test.go
#   test/surface-parity/traceql_reference_agpl_test.go
#   test/property/oracle/logql/evaluator.go
#   test/property/oracle/logql/line_filters.go
#   test/spec/parityoracle/logql/oracle.go
#   test/spec/parityoracle/traceql/oracle.go
#   test/spec/parityoracle/traceql/oracle_test.go
#
# The tests do NOT require CGO, Docker, or libchdb. The property oracle package
# is a compile probe here; its live HTTP differential runs under the composite
# tag set in the property workflow. The focused Just recipe filters the
# internal and surface packages to the tagged assertions, avoiding a duplicate
# pass over their untagged tests.
#
# Required status check name: `agpl-oracle`
# Required on: all PRs (docs-only PRs short-circuit to a green no-op so
# the context always appears in the PR rollup without doing work).
# Path note: the `changes` job shares the docs-only filter from ci.yml /
# chdb.yml; see chdb.yml's matrix-expansion note for why the guard lives
# on the STEPS rather than the job.
#
# Tag composition note (#1520): test/property/logql_test.go carries the
# synthetic single-term tag `//go:build chdb_agpl_oracle` (every
# //go:build constraint in this tree is a single term — see
# test/regression/lint_build_tags_test.go — so it can't spell
# `chdb && agpl_oracle` directly). This lane passes `-tags agpl_oracle`
# only (neither `chdb` nor `chdb_agpl_oracle`, no libchdb.so) so that
# file compiles OUT here — its real exercise happens in property.yml,
# which passes `-tags chdb,agpl_oracle,chdb_agpl_oracle` and installs
# libchdb.so. This lane still compiles the sibling
# test/property/oracle/logql package (evaluator.go / line_filters.go),
# proving the agpl_oracle-tagged code itself builds, without taking on a
# chdb dependency this lane doesn't otherwise need. The same applies to
# test/spec/parity_loki_chdb.go, the runner half of the LogQL parity
# oracle: it compiles OUT here and is exercised by chdb.yml's
# `roundtrip (logql)` leg, which passes all three tags. This lane still
# compiles test/spec/parityoracle/logql (the oracle itself).
#
# test/surface-parity/logql.go and traceql.go read pinned reference-verdict
# artifacts (logql-reference-verdicts.json / traceql-reference-verdicts.json)
# instead of calling the AGPL parsers live, so the default `check` gate
# stays AGPL-free. The agpl_oracle-tagged *_reference_agpl_test.go files in
# that package re-probe the live reference and fail on drift; regenerate via
# `CERBERUS_UPDATE_LOGQL_REFERENCE_VERDICTS=1` / `CERBERUS_UPDATE_TRACEQL_REFERENCE_VERDICTS=1`.
#
# Regression test: test/regression/agpl_oracle_tag_set_test.go asserts
# that every `//go:build agpl_oracle` file in the root module is known to
# this lane, so a new tagged file cannot arrive without a lane-coverage
# update.

on:
  pull_request:
  push:
    branches: [main, 'release/*.x']
  workflow_dispatch:
  schedule:
    # nightly at 03:30 UTC (ahead of property at 03:45 and chdb at 04:00)
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  # Main pushes replace only older main pushes; matching cron schedules replace
  # only that scheduled mode. Every other event gets its own run-id group.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'latest-main-push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') && format('latest-main-schedule-{0}', github.event.schedule) || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') }}

jobs:
  # Docs-only short-circuit — see chdb.yml for the full rationale. The
  # `agpl-oracle` job uses per-step guards (not a job-level `if:`) so the
  # required context is always published.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.compute.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.markdown'
              - '!docs/**'
              - '!LICENSE*'
              - '!CHANGELOG.md'
              - '!.markdownlint*'
              - '!CLAUDE.md'
              - '!AGENTS.md'
              - '!README*'

      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.filter.outputs.code }}" = "false" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # `agpl-oracle` compiles and runs the `//go:build agpl_oracle` test
  # files. A failure means the in-house parser has diverged from the AGPL
  # reference in a way the test corpus exposes, or a pinned reference-verdict
  # artifact under test/surface-parity has drifted from the live parser.
  #
  # The job also runs the regression test (test/regression) which includes
  # agpl_oracle_tag_set_test.go — it asserts the set of tagged files matches
  # what this lane covers, so a new oracle test file is caught immediately
  # rather than silently running under no lane.
  agpl-oracle:
    name: agpl-oracle
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - uses: ./.github/actions/setup-go
        if: needs.changes.outputs.docs_only != 'true'

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2.86.5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          tool: just

      - name: Run agpl_oracle differential oracle tests
        if: needs.changes.outputs.docs_only != 'true'
        run: just test-agpl-oracle

      - name: Verify agpl_oracle tag set coverage (regression)
        if: needs.changes.outputs.docs_only != 'true'
        run: go test -run TestAGPLOracleTagSetCoverage -count=1 ./test/regression/...

      - name: No-op (docs-only PR)
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "agpl-oracle is a green no-op on docs-only PRs."
