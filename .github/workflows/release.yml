name: release

# Publish-on-merge (release-please-style). The OLD raw-tag trigger
# (`on: push: tags: [v*, chart-v*]`) is RETIRED — nothing publishes from a
# pushed tag any more. Instead a release ships when a VALIDATED release PR is
# MERGED to main:
#
#   prepare-release.yml  (label / dispatch)  ->  opens a `release/*` PR
#     -> the PR runs the FULL matrix (every required check + the four parity
#        lanes coverage/mutation/perf-profile/property, which run their heavy
#        work on release/* PRs) and the e2e split + crawl legs (#1036)
#     -> maintainer merges when green  ->  this workflow runs on push-to-main
#     -> per-line version gates decide what actually changed, then publish +
#        auto-tag ONLY the changed artifact(s).
#
# The merge-when-green branch protection (every required check green on a tree
# that is up to date with main) covers the lanes that CAN be branch-protection
# checks. It does NOT cover the lanes that carry no `pull_request:` trigger:
# `migration-e2e` is deliberately push/schedule-only, so it can never become a
# branch-protection check and has therefore NEVER run on the tree being
# released — the merge commit is the first tree it sees. That is why the
# `preflight` job below now runs on the MAIN path too, and why it is handed an
# EXPECTED set (`RELEASE_REQUIRED_CHECKS`) rather than left to gate on whatever
# the API happens to return: a lane that never ran contributes zero check-runs,
# zero problems, and publishes in silence.
#
# `preflight` is PUBLISH-gated, not path-gated: it is skipped entirely on the
# ordinary merges that publish nothing, so no runner time is spent waiting for
# CI on a commit that ships no artifact.
#
# Idempotency / no-op safety: a merge that bumped NEITHER version line is a
# complete no-op. The app gate (release-version-gate.mjs) sets publish=false
# when `v<appVersion>` already exists; the chart gate (chart-publish.mjs
# version-gate) sets publish=false when the chart `version:` is already in the
# OCI registry. So an ordinary code/docs PR merging to main publishes nothing.

on:
  push:
    branches:
      - main
      # MAINTENANCE-LINE hotfixes. A backport cherry-picked onto a
      # `release/<major>.<minor>.x` branch (e.g. release/1.4.x, release/1.3.x)
      # publishes the same way a main-line release does. The `*.x` glob matches
      # ONLY the maintenance lines: `release/1.4.x` matches, but a main release
      # PR branch like `release/v1.5.0-chart-0.6.4` does NOT (it doesn't end in
      # `.x`), so the two branch families stay cleanly distinguishable.
      - 'release/*.x'
  # Manual re-drive (e.g. if a publish step failed after the gate said
  # publish=true). The gates are idempotent, so a re-run that finds the tag /
  # chart already published is a clean no-op.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # SLSA provenance attestation needs `id-token` (Sigstore OIDC) +
  # `attestations` (writes the attestation record back to the repo).
  id-token: write
  attestations: write

# A second push to main while a release is mid-publish must not race the first
# (two goreleaser runs cutting the same tag). Serialise per-ref; never cancel a
# publish in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Per-line version gates. On a push to main (a merged PR), decide which
  # artifact actually changed:
  #   - app:   Chart.yaml appVersion vs the latest `v*` git tag
  #            (release-version-gate.mjs).
  #   - chart: Chart.yaml version vs the chart already in the OCI registry
  #            (chart-publish.mjs version-gate — the SAME gate the old tag-
  #            triggered chart-release used, reused verbatim).
  # Each gate is fail-safe: an unchanged line yields publish=false, so the
  # downstream publish job is skipped entirely.
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      app_publish: ${{ steps.app.outputs.publish }}
      app_version: ${{ steps.app.outputs.version }}
      app_tag: ${{ steps.app.outputs.tag }}
      chart_publish: ${{ steps.chart.outputs.publish }}
      chart_version: ${{ steps.chart.outputs.version }}
    env:
      CHART_DIR: deploy/helm/cerberus
      OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/cerberus/charts
      CHART_NAME: cerberus
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + every tag so the app gate's `git tag -l v*` sees the
          # complete release-tag set (a shallow clone would hide older tags and
          # could wrongly publish an already-released appVersion).
          fetch-depth: 0

      # Pin both gates' own logic before they decide anything.
      - name: app-version-gate self-test
        run: node .github/scripts/release-version-gate.mjs --self-test

      - name: chart version-gate self-test
        run: node .github/scripts/chart-publish.mjs --self-test

      # helm is needed for the chart gate's `helm show chart oci://…` probe.
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.1

      # The chart gate probes the OCI registry — authenticate so the probe of a
      # private/rate-limited GHCR repo is reliable (it fails CLOSED on an
      # indeterminate registry error, so an unauthenticated probe could abort
      # the whole release).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: app
        name: App version gate (publish iff appVersion un-tagged)
        run: node .github/scripts/release-version-gate.mjs app-version-gate

      - id: chart
        name: Chart version gate (publish iff chart version unpublished)
        run: node .github/scripts/chart-publish.mjs version-gate

      - name: Summarise gate decision
        run: |
          echo "app:   publish=${{ steps.app.outputs.publish }} version=${{ steps.app.outputs.version }} tag=${{ steps.app.outputs.tag }}"
          echo "chart: publish=${{ steps.chart.outputs.publish }} version=${{ steps.chart.outputs.version }}"

  # Green-check guard — BOTH release paths, gated on "something actually
  # publishes" rather than on which branch was pushed.
  #
  # MAIN path: branch protection already refused to merge a PR whose REQUIRED
  # checks were red, but `migration-e2e` has no `pull_request:` trigger by
  # design, so it never ran on the PR and the merge commit is the first tree it
  # sees. Without this job nothing re-reads main at all, and a red (or absent)
  # migration lane publishes unobserved.
  #
  # MAINTENANCE path (`release/*.x`): no PR gate whatsoever — a maintainer
  # cherry-picks a hotfix straight onto the line — so on top of the green gate
  # the script additionally requires the pushed commit to be the branch TIP and
  # the line to be inside the support window (EOL lines get no hotfixes). Both
  # rules are maintenance-only; `release-preflight.mjs` derives the mode from
  # GITHUB_REF_NAME.
  #
  # The `if:` is a PUBLISH gate, not a path gate: an ordinary merge that bumps
  # neither version line skips this job entirely, so no runner sits waiting on
  # CI for a commit that ships nothing. The publish jobs still wrap their guards
  # in `always()` — a SKIPPED preflight would otherwise cascade its skip down the
  # chain — but they require `preflight == 'success'` outright: the old
  # `|| skipped` disjunction existed only because preflight was maintenance-only,
  # and keeping it would let a mis-edited `if:` publish unguarded.
  #
  # ABSENCE IS A FAILURE: `RELEASE_REQUIRED_CHECKS` is the EXPECTED set the
  # script does not derive from the API response. Every name in it must have
  # posted a check-run on the commit; an empty value, or a required name that
  # `RELEASE_INFORMATIONAL_CHECKS` would swallow by prefix, is itself a blocking
  # problem. test/regression/release_gate_test.go pins this wiring at PR time —
  # this workflow has no `pull_request:` trigger, so nothing else does.
  preflight:
    name: preflight
    needs: gate
    if: needs.gate.outputs.app_publish == 'true' || needs.gate.outputs.chart_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7

      - name: preflight self-test
        run: node .github/scripts/release-preflight.mjs --self-test

      - name: preflight required-set guard
        run: node --test .github/scripts/release-preflight.test.mjs

      - name: Verify every required lane ran and the commit is fully green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This release run's own jobs are necessarily in-progress while the
          # preflight reads check-runs, so they're excluded structurally (gating
          # on them would deadlock). A reusable workflow called from one of them
          # posts children as "<job> / <child>"; release-preflight.mjs matches
          # that prefix too, so release-artifact-migration's tier jobs are
          # excluded without being named individually.
          # All three lists are NEWLINE-separated, one name per line: check-run
          # names are job display names and may contain commas (see `property
          # (…, rapid N=500)` below), so a comma cannot be the separator.
          RELEASE_SELF_JOBS: |
            gate
            preflight
            goreleaser
            release-artifact-migration
            publish
            brew-smoke
            chart-release
          # The EXPECTED set — exact check-run names that MUST have posted a run
          # on this commit. The invariant is TOTALITY: every branch-protection
          # required context is accounted for here, either by being named below
          # or by being named in RELEASE_INFORMATIONAL_CHECKS with a reason. A
          # context in neither list is certified by absence, which is exactly
          # what this gate exists to prevent — and it matters most on the
          # MAINTENANCE path, where there is no PR and therefore no branch
          # protection, leaving this preflight as the only gate. Plus
          # `migration-e2e`, which can never BE a branch-protection check
          # because migration-e2e.yml has no `pull_request:` trigger.
          # release_required_checks_test.go asserts the totality invariant, and
          # that every name here is owned by a workflow that actually triggers
          # on `release/*.x` — a name with no lane behind it stalls the gate.
          RELEASE_REQUIRED_CHECKS: |
            check
            lint
            forbid-skip
            chart-validate
            compatibility/prometheus
            compatibility/loki
            compatibility/tempo
            compatibility/prometheus-forced-route
            probe
            roundtrip (promql)
            roundtrip (logql)
            roundtrip (traceql)
            compose-smoke
            coverage
            profile
            property (PromQL + LogQL + TraceQL, rapid N=500)
            migration-e2e
          # De-gated INFORMATIONAL lanes, matched by name prefix (matrix children
          # carry a "(shard-…)" suffix). The required `compose-smoke` aggregate
          # does NOT `needs:` the crawl info shard, and `dashboard` is informational
          # on merges — a flake in either must not block a release. `mutation` is
          # a test-QUALITY ratchet rather than a correctness gate on the artifact
          # being shipped; it already ran green under branch protection on the
          # release PR, and requiring it here would put its ~11-leg matrix on the
          # critical path of every publish, including maintenance hotfixes. A
          # prefix here that swallows a RELEASE_REQUIRED_CHECKS name fails the
          # preflight as a wiring error rather than quietly de-gating it.
          RELEASE_INFORMATIONAL_CHECKS: |
            compose-smoke-shard-info
            dashboard
            mutation
        # On the maintenance path this also enforces the support-window / EOL
        # policy: a push to a line 3+ minors behind the current minor is refused
        # (the line is EOL, gets no hotfixes). See docs/operations.md "Release
        # support window / EOL policy".
        run: node .github/scripts/release-preflight.mjs

  # App release — binary archives + multi-arch images (GHCR + Docker Hub) +
  # SLSA provenance. Runs ONLY when the app gate says appVersion is new.
  #
  # Tag-creation timing: the raw-tag trigger is gone, so this job CREATES the
  # `v<appVersion>` annotated tag at the merge commit (github.sha) and pushes
  # it, THEN runs goreleaser. goreleaser derives `{{ .Version }}` from the tag,
  # so the tag must exist before it runs. Pushing the tag does NOT recurse into
  # another release run (the workflow no longer triggers on tags — only on
  # push-to-main). The tag is created idempotently: a workflow_dispatch re-run
  # that finds the tag already present skips re-creating it.
  goreleaser:
    name: goreleaser
    needs: [gate, preflight]
    # Publish when the app gate says the appVersion is new AND the green-check
    # guard is satisfied. `preflight` is gated on the SAME publish condition, so
    # on every run that reaches here it ran — requiring SUCCESS outright, with no
    # `|| skipped` disjunction. That used to be there because preflight was
    # maintenance-only; keeping it now would be an escape hatch, since a
    # preflight whose own `if:` was mis-edited into never running would report
    # `skipped` and publish unguarded.
    #
    # `always()` is still load-bearing: without it, a SKIPPED preflight (the
    # no-publish merge) cascades its skip down the chain rather than letting the
    # explicit guards decide.
    if: |
      always() &&
      needs.gate.outputs.app_publish == 'true' &&
      needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 so goreleaser's changelog + the `:latest` highest-
          # stable computation below see the full tag history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror — goreleaser pushes the same per-arch images +
      # manifests to docker.io/tsouza/cerberus in the same build. A login
      # failure aborts the whole release (atomic dual-registry push).
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: tsouza
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # Create + push the `v<appVersion>` annotated tag at the merge commit.
      # goreleaser reads the version from this tag. The push does NOT recurse:
      # the workflow's only trigger is push-to-main (the raw-tag trigger was
      # retired). Idempotent: a re-run that finds the tag already present (same
      # commit) is a no-op; a tag pointing at a DIFFERENT commit is a hard error
      # (a moved release tag is never correct).
      - name: Create + push v<appVersion> tag at merge commit
        env:
          TAG: ${{ needs.gate.outputs.app_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            existing="$(git rev-list -n1 "${TAG}")"
            if [ "${existing}" != "${GITHUB_SHA}" ]; then
              echo "::error::tag ${TAG} already exists at ${existing}, not the merge commit ${GITHUB_SHA} — refusing to move a release tag"
              exit 1
            fi
            echo "tag ${TAG} already at ${GITHUB_SHA} — nothing to do"
          else
            git tag -a "${TAG}" -m "release ${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
            echo "created + pushed ${TAG} at ${GITHUB_SHA}"
          fi

      # Whether THIS tag is the highest stable release (so we move the rolling
      # `:latest` images). A stable BACKPORT (e.g. v1.2.1 cut after v1.3.0) is
      # NOT highest -> `:latest` stays on v1.3.0. goreleaser reads this via
      # `.Env.RELEASE_IS_LATEST` in the `latest-*` skip_push templates. Needs
      # fetch-depth: 0 so all tags (including the one just pushed) are present.
      - name: Compute RELEASE_IS_LATEST
        env:
          TAG: ${{ needs.gate.outputs.app_tag }}
        run: |
          tag="${TAG#v}"
          highest=$(git tag -l 'v*.*.*' | awk '!/-/' | sed 's/^v//' | sort -V | tail -1)
          if [ "$tag" = "$highest" ]; then
            echo "RELEASE_IS_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_LATEST=false" >> "$GITHUB_ENV"
          fi
          echo "tag=$tag highest_stable=$highest RELEASE_IS_LATEST set accordingly"

      - id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IS_LATEST: ${{ env.RELEASE_IS_LATEST }}
          # Cross-repo push to tsouza/homebrew-tap for the brews block. The
          # default GITHUB_TOKEN cannot push to another repo; this PAT can.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # SLSA build provenance for the release binaries. Lets downstream
      # consumers verify an artifact was built in this repo at this commit via
      # `gh attestation verify ...`. Sigstore signs the attestation through the
      # workflow's OIDC token.
      - name: Attest release binary provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.tar.gz'

  # Drive the Layer-14 migration lane against the image goreleaser JUST BUILT,
  # before the release becomes public.
  #
  # The push-triggered `migration-e2e` run that `preflight` requires proves the
  # SOURCE TREE is good; it cannot prove the released artifact is, because the
  # artifact does not exist until goreleaser runs. A bad ldflag, a wrong-arch
  # build, Dockerfile drift, or a config default that only holds in
  # Dockerfile.local would sail past it. So the same lane definition runs a
  # second time with `cerberus_image` pointed at the published tag; the harness
  # extracts the CLI from that image and asserts the running server's
  # `GET /info` version equals `expect_version`, so both halves of the stack are
  # provably the released bytes.
  #
  # `always()` is LOAD-BEARING for the same reason it is on `eol-retire`: this
  # chain transitively depends on `preflight`, which is SKIPPED on a no-publish
  # merge, and GitHub's skip-propagation would cascade that skip down the whole
  # chain.
  #
  # The image tag is the bare `{{ .Version }}` form, matching .goreleaser.yml's
  # `image_templates`.
  release-artifact-migration:
    name: release-artifact-migration
    needs: [gate, goreleaser]
    if: |
      always() &&
      needs.gate.outputs.app_publish == 'true' &&
      needs.goreleaser.result == 'success'
    uses: ./.github/workflows/migration-e2e.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      tier: all
      cerberus_image: ghcr.io/${{ github.repository_owner }}/cerberus:${{ needs.gate.outputs.app_version }}
      expect_version: ${{ needs.gate.outputs.app_version }}

  # Make the release public. This is a SEPARATE job from `goreleaser` on
  # purpose: the draft->published flip is the point of no return, so everything
  # that validates the built artifact has to sit between the two. Moving these
  # steps back inside `goreleaser` would publish an image nothing ever drove —
  # test/regression/release_gate_test.go asserts there is exactly one
  # draft-to-published flip in this file and that its job `needs:`
  # `release-artifact-migration`.
  publish:
    name: publish
    needs: [gate, goreleaser, release-artifact-migration]
    if: |
      always() &&
      needs.gate.outputs.app_publish == 'true' &&
      needs.goreleaser.result == 'success' &&
      needs.release-artifact-migration.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Load-bearing, not boilerplate: `gh release edit` resolves the repository
      # from the checkout's git remote (this workflow sets no GH_REPO), and the
      # Docker Hub overview sync reads ./README.md from the working tree.
      - uses: actions/checkout@v7

      # goreleaser created the release as a DRAFT (see .goreleaser.yml
      # release.draft) so it could attach assets while the release is still
      # mutable. Flip it published NOW, AFTER the assets + provenance are in
      # place AND the migration lane has driven the built image: the repo's
      # immutable-releases policy then freezes the release WITH its assets.
      # Publishing up-front (e.g. `gh release create`) would lock it before
      # goreleaser could upload — the 422 that broke v1.0.1.
      # Idempotent: a no-op if already published.
      - name: Publish release (flip draft -> published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.app_tag }}
        run: gh release edit "${TAG}" --draft=false

      # Mirror README.md to the Docker Hub repo overview. Non-fatal: a stale
      # overview page must never turn an otherwise-published release red.
      - name: Sync Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: tsouza
          password: ${{ secrets.DOCKER_HUB_PAT }}
          repository: tsouza/cerberus
          readme-filepath: ./README.md

  # Post-publish install smoke: prove `brew install tsouza/tap/cerberus` works
  # for the version that just shipped.
  #
  # `needs: publish` is ordering, not decoration: `brew install` downloads the
  # release tarball, which 404s while the release is still a draft. The reflex
  # fixes for that 404 — a retry loop, `continue-on-error` — would ship the
  # release unverified and green, so the fix is to run after the flip.
  #
  # Prereleases are NOT skipped. `skip_upload: auto` means an `rc.*` writes no
  # formula, so brew-smoke.mjs takes the NEGATIVE branch instead: the formula
  # must exist and must NOT declare this version.
  brew-smoke:
    name: brew-smoke
    needs: [gate, publish]
    if: |
      always() &&
      needs.gate.outputs.app_publish == 'true' &&
      needs.publish.result == 'success'
    # macOS, NOT ubuntu-latest: the Ubuntu 24.04 runner image ships no
    # Homebrew, so `brew` is a bare ENOENT there and the smoke can only ever
    # fail. (It was ubuntu-latest until v1.12.0 — the first release to reach
    # this job — proved it.) The macOS image has Homebrew preinstalled, needs
    # no install step, and is the platform the overwhelming majority of
    # `brew install` traffic comes from. Everything the smoke runs afterwards
    # (`--version`, `migrate schema`, `config-docs -check`) is pure Go and
    # platform-independent, so the darwin build exercises the same payloads.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # The `config-docs -check` payload compares the SHIPPED binary's config
      # registry against THIS commit's docs/configuration.md, so the release
      # tree has to be on disk.
      - uses: actions/checkout@v7

      - name: brew-smoke self-test
        run: node --test .github/scripts/brew-smoke.test.mjs

      - name: install from the tap and smoke the published binary
        env:
          # The BARE version. Comparing `cerberus --version` to `app_tag` would
          # be a guaranteed off-by-`v` mismatch.
          RELEASE_VERSION: ${{ needs.gate.outputs.app_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}
        run: node .github/scripts/brew-smoke.mjs

  # Active EOL — after a NEW app version actually publishes, retire the release
  # line that just fell out of the latest-3-minor support window by DELETING its
  # `release/<major>.<minor>.x` maintenance branch (e.g. publishing v1.6.0
  # retires release/1.3.x). This is the ACTIVE half of the EOL policy; the
  # PASSIVE half (refusing to PUBLISH on an out-of-window line) lives in the
  # `preflight` gate. Both share `release-preflight.mjs`'s window math
  # (SUPPORTED_MINOR_LINES) — single source of truth, no duplicated arithmetic.
  #
  # Guards (all in release-preflight.mjs `retireLineForPublish` + the
  # `eol-retire-line` driver):
  #   - runs ONLY after goreleaser SUCCEEDED (a real new-version publish);
  #   - retires AT MOST one line, ONLY on a minor open (X.Y.0, Y>0). Patches +
  #     major bumps + backports + prereleases retire nothing;
  #   - deletes ONLY a provably out-of-window line that EXISTS (idempotent: a
  #     404 / already-absent branch is a clean noop), with a cross-check against
  #     `supportWindowProblem` before the destructive call;
  #   - FAIL-OPEN: the release already published, so ANY deletion failure
  #     (token perms, protection, network) logs loudly via `::error::` and the
  #     step still exits 0 — a retirement hiccup never fails a shipped release.
  #     `continue-on-error: true` is belt-and-braces on top of the in-script
  #     fail-open.
  #
  # Token: RELEASE_PAT is REQUIRED here, not an optimisation. The repository
  # ruleset "release maintenance lines" targets `refs/heads/release/*.x` with a
  # `deletion` rule, and its only bypass actor is the `admin` RepositoryRole.
  # `contents:write` is therefore NOT sufficient on its own: the default
  # GITHUB_TOKEN acts as github-actions[bot], which holds write and never the
  # admin role, so the ruleset rejects its delete. A PAT owned by an admin
  # inherits that role and bypasses (the delete is accepted and logged by GitHub
  # as `Bypassed rule violations`). The `|| secrets.GITHUB_TOKEN` fallback below
  # is a best-effort attempt for a repo without the secret, not a supported
  # path — expect it to be refused here.
  # See docs/operations.md "Release support window / EOL policy".
  eol-retire:
    name: eol-retire
    needs: [gate, publish]
    # Only when a NEW app version actually went PUBLIC. This hangs off `publish`,
    # not `goreleaser`: retiring an old line while the new release is still a
    # draft would shrink the support window on the strength of a release that may
    # yet be blocked by `release-artifact-migration`.
    # `always()` is LOAD-BEARING: like `goreleaser` and `chart-release`, this job
    # transitively depends on `preflight`, which is SKIPPED on a no-publish merge.
    # Without `always()`, GitHub's skip-propagation cascades the skip down this
    # whole chain, so the job never runs on a real minor open and EOL lines never
    # get retired. `always()` unwraps that skip; the two guards below then keep it
    # a strict no-op on patches / backports / failed publishes — it only fires
    # when a new version actually shipped.
    if: |
      always() &&
      needs.gate.outputs.app_publish == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Deleting a branch ref needs contents:write. This scope only covers the
      # github.token fallback; the `release/*.x` ruleset additionally requires
      # the admin role, which only RELEASE_PAT carries. See the job comment.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: retire-line self-test
        run: node .github/scripts/release-preflight.mjs --self-test

      - name: Retire the out-of-window release line (active EOL)
        continue-on-error: true
        env:
          # RELEASE_PAT is the supported token: the live `release/*.x` ruleset
          # denies deletion to everything but the admin role, which an
          # admin-owned PAT inherits and github-actions[bot] does not.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          RELEASE_APP_VERSION: ${{ needs.gate.outputs.app_version }}
        run: node .github/scripts/release-preflight.mjs eol-retire-line

  # Chart release — publish the Helm chart to GHCR as an OCI artifact, cosign-
  # sign it keyless, attest provenance, and (idempotently) push Artifact Hub
  # metadata. Runs ONLY when the chart gate says the chart `version:` is new.
  #
  # Tag-creation timing: like goreleaser, this job CREATES the `chart-v<version>`
  # annotated tag at the merge commit (so the published chart has a matching git
  # ref) IN ADDITION to publishing — the raw-tag trigger that used to create the
  # release context is gone. The push does not recurse (push-to-main is the only
  # trigger). The chart gate already proved the version is unpublished, so the
  # tag should not exist; creating it at a different commit is a hard error.
  chart-release:
    name: chart-release
    needs: [gate, preflight]
    # Same guard as goreleaser: chart gate says new AND preflight SUCCEEDED.
    # `preflight` fires on `chart_publish` too, so there is no run that reaches
    # here with a skipped preflight — no `|| skipped` disjunction to hide behind.
    if: |
      always() &&
      needs.gate.outputs.chart_publish == 'true' &&
      needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      CHART_DIR: deploy/helm/cerberus
      OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/cerberus/charts
      CHART_NAME: cerberus
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.21.1

      # cosign-installer publishes NO moving v4 major tag (only v3 floats); pin
      # the exact latest v4 patch or the job fails resolving the action.
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: oras-project/setup-oras@v2

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Create + push the `chart-v<version>` annotated tag at the merge commit.
      # Idempotent / fail-safe in the same shape as the app tag step above.
      - name: Create + push chart-v<version> tag at merge commit
        env:
          TAG: chart-v${{ needs.gate.outputs.chart_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            existing="$(git rev-list -n1 "${TAG}")"
            if [ "${existing}" != "${GITHUB_SHA}" ]; then
              echo "::error::tag ${TAG} already exists at ${existing}, not the merge commit ${GITHUB_SHA} — refusing to move a release tag"
              exit 1
            fi
            echo "tag ${TAG} already at ${GITHUB_SHA} — nothing to do"
          else
            git tag -a "${TAG}" -m "chart release ${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
            echo "created + pushed ${TAG} at ${GITHUB_SHA}"
          fi

      - name: helm package
        run: helm package "$CHART_DIR" --destination "$RUNNER_TEMP"

      - id: push
        name: helm push + capture digest
        run: node .github/scripts/chart-publish.mjs push
        env:
          CHART_TGZ: ${{ runner.temp }}/cerberus-${{ needs.gate.outputs.chart_version }}.tgz

      - name: cosign sign (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cerberus/charts/cerberus
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Push Artifact Hub metadata
        run: node .github/scripts/chart-publish.mjs ah-metadata
