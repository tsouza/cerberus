name: chdb

# chDB engine + TXTAR-roundtrip lane.
#
# Two informational jobs, both linking libchdb.so:
#
#   1. `probe`     — driver-shim sanity check (`TestChDBProbe`). Validates
#                    the chdb-go database/sql driver round-trips
#                    Map(String, String) into a Go map[string]string via
#                    rows.Scan. Originally the only chDB CI lane.
#
#   2. `roundtrip` — TXTAR seed → SQL → expected_rows differential lane,
#                    split into a matrix over the logql/traceql heads. Each
#                    matrix entry runs
#                    `go test -tags chdb -count=1 ./test/spec/<ql>/...`
#                    which executes the chdb-tagged `TestRoundTripChDB`
#                    walker over every *.txtar fixture under that head
#                    that declares both `seed:` and `expected_rows:`. promql
#                    is sharded across its own `roundtrip-promql-shard` /
#                    `roundtrip-promql` pair instead (tsouza/cerberus#2629,
#                    below) — its corpus outgrew what one runner's in-process
#                    fan-out can clear inside a sane job timeout.
#
# Why this exists: the required PR gates (`check` + `lint` + `forbid-skip`) are
# CGO-free and never compile the chdb-go driver, so they cannot run the
# roundtrip pass. Without this workflow exercising
# `./test/spec/{promql,logql,traceql}/`, fixture regressions slip past
# code review (e.g. label_replace_basic.txtar landed broken on main via
# #312 — no workflow caught it).
#
# `probe` is a required PR gate (branch protection). `roundtrip (<ql>)`,
# `chdb-build`, `integration-<ql>` and `perf-guards` are RELEASE-gate lanes
# (#2230, the merge/release two-tier split): they still trigger on every
# `pull_request` — no `paths:` filter, so their check-run always appears in
# the PR rollup — but short-circuit to a fast no-op there and do their real
# chDB-heavy work only on push / schedule / dispatch and on a `release/*`
# head-branch PR. `needs.changes.outputs.run_heavy` carries that decision;
# `roundtrip`'s per-step (not job-level) guard exists so its logql/traceql
# matrix legs always publish their names even while short-circuited — see the
# comment above that job. promql's `roundtrip-promql` aggregator uses the
# job-level equivalent instead, the same way `perf-guards` does over its own
# shard matrix — see the comment above `roundtrip-promql-shard`.
#
# If you widen `probe`'s trigger scope, audit the required-checks list at
# the same time — a context that never runs blocks every PR.
#
# tsouza/cerberus#2426: a push-to-main produced by a release/*-headed PR
# merging is REDUNDANT for every run_heavy-gated lane above (chdb-build,
# roundtrip, perf-guards, integration-<ql>) — that PR's own pull_request run
# already ran them heavy and posted their check-runs on its own tip commit.
# `changes`'s `decide run_heavy` step (.github/scripts/chdb-run-heavy.mjs, a
# port of coverage.yml's #2416 fix) resolves the PR that produced the pushed
# commit and skips the heavy run ONLY in that one provable case; every other
# push — an ordinary-PR merge, an unresolved source PR, or a maintenance-line
# hotfix with no PR at all — still runs heavy. See the script's own header
# for the full decision table.

on:
  push:
    # `release/*.x` so `probe` (a required check) and the release-gate lanes
    # (`roundtrip (<ql>)` / `chdb-build` / `integration-<ql>` / `perf-guards`,
    # all named in release.yml's RELEASE_REQUIRED_CHECKS) also run for real on
    # a maintenance-line hotfix push, giving release.yml's maintenance
    # preflight check-runs to verify before publishing.
    branches: [main, 'release/*.x']
  # PR trigger has no `paths:` filter so `probe` and every release-gate lane's
  # check-run always appears in the PR rollup — required for `probe`'s
  # required-status-check promotion (a path-skipped check leaves the rollup
  # missing entries and would block merges of pure-docs PRs), and it is what
  # lets the release-gate lanes keep posting a fast no-op for visibility.
  pull_request:
  # Same reasoning one step further on: a merge queue gates on the same
  # contexts branch protection does, so `probe` has to post on the projected
  # trunk too. `roundtrip`'s docs-only/run_heavy guard is per-STEP, never
  # job-level, precisely so its three matrix legs always publish their
  # names — that property is what makes it queue-safe.
  merge_group:
  workflow_dispatch:
  schedule:
    # nightly at 04:00 UTC
    - cron: '0 4 * * *'

# chDB is loaded as a shared library and called over purego (a cgo-free
# FFI). Go's signal-based async preemption (SIGURG, on since 1.14) can fire
# while a goroutine is parked inside a libchdb.so downcall, and the foreign
# frame aborts with "signal arrived during cgo execution" (SIGABRT) — an
# infrastructure flake unrelated to the query under test. Disabling async
# preemption for the chDB test processes removes the interrupt; cooperative
# preemption still applies, and the production binary (built and run without
# this env) is unaffected.
env:
  GODEBUG: asyncpreemptoff=1

permissions:
  contents: read
  # chdb-run-heavy.mjs resolves the PR that produced a pushed commit via
  # GET /commits/{sha}/pulls (lib/resolve-source-pr.mjs) — read-only, and
  # only exercised on a `push` event.
  pull-requests: read

concurrency:
  # Main pushes replace only older main pushes; matching cron schedules replace
  # only that scheduled mode. Every other event gets its own run-id group.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'latest-main-push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') && format('latest-main-schedule-{0}', github.event.schedule) || github.run_id }}
  # NEVER cancel a run that is already in progress (tsouza/cerberus#2994).
  #
  # The GROUP above is what makes deep-main work replaceable, and it keeps
  # working: GitHub holds at most ONE pending run per group, so a burst of
  # pushes is still superseded at QUEUE time, where a pending run holds no
  # runner and costs nothing. Killing a run that is already EXECUTING is a
  # separate act, and it only pays when the killed work was nearly worthless.
  #
  # READ THAT DIRECTION BEFORE "OPTIMISING" THIS LINE BACK TO AN EXPRESSION.
  # `false` looks like the setting that wastes runners and the measurement says
  # the opposite: cancellation SPENT the minutes below and threw the result
  # away, then re-ran the same work on the next commit. The tier and the
  # decision rule behind it live in QUEUE_COALESCED_WORKFLOWS in
  # .github/scripts/main-coalescing.mjs, whose audit fails this workflow if the
  # two halves ever disagree.
  #
  # Measured on this lane: 48% of its main-push runs CANCELLED, a 34.5-min
  # median successful run against the 38.5-min median push gap — only 57% of
  # gaps clear it — kills a median 18.0 min in, 12 of 48 past 90% of a run, and
  # 35% of the lane's runner minutes (991 min in 74.5 h) discarded. The window
  # also held 30 genuine failures, so cancelling this lane suppresses red on
  # the trunk as well as wasting the runner that found it.
  cancel-in-progress: false

jobs:
  # See `.github/workflows/ci.yml` for the rationale + filter convention.
  # Docs-only PRs short-circuit `probe` and the `roundtrip` matrix.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.compute.outputs.docs_only }}
      # run_heavy — the merge/release two-tier split (#2230). `roundtrip`,
      # `integration-*`, `chdb-build` and `perf-guards` are release-gate lanes,
      # not merge-gate ones: they do their real (chDB-heavy) work on push /
      # schedule / dispatch and on a `release/*` head-branch PR (unless a
      # resolved source PR proves a push redundant — see the `decide
      # run_heavy` step below), and short-circuit to a fast no-op everywhere
      # else (an ordinary PR, or a merge-group entry, which is held to the PR
      # posture — see coverage.yml / property.yml for the same pattern).
      # `probe` is NOT gated on this: it stays a normal, always-real PR check.
      run_heavy: ${{ steps.run_heavy.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v7

      - name: Test chdb run_heavy gate
        run: node --test .github/scripts/chdb-run-heavy.test.mjs

      # lib/run-heavy.mjs is the shared scaffold this lane's own decide()
      # is built on, alongside coverage.yml/property.yml/perf-profile.yml's —
      # tested once here rather than redundantly in all four workflows.
      - name: Test the shared run_heavy decider scaffold
        run: node --test .github/scripts/lib/run-heavy.test.mjs

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          # See ci.yml for why `every` is required (the `**` baseline
          # plus negation patterns would otherwise always be true).
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.markdown'
              - '!docs/**'
              - '!LICENSE*'
              - '!CHANGELOG.md'
              - '!.markdownlint*'
              - '!CLAUDE.md'
              - '!AGENTS.md'
              - '!README*'

      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.filter.outputs.code }}" = "false" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # Computed as a step output rather than inline in the `compute` step
      # above: a `push` event needs a network call (resolve the source PR
      # that produced the pushed commit) to know whether it is redundant with
      # that PR's own run. See chdb-run-heavy.mjs's header for the full
      # decision table; GITHUB_TOKEN is used read-only and only reached on a
      # `push` event.
      - id: run_heavy
        name: decide run_heavy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: emit
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node .github/scripts/chdb-run-heavy.mjs

  # `chdb-build` is a FAST, PR-visible compile gate over the entire
  # chdb-tagged tree. It does NOT run any tests — `go build` + `go vet`
  # with `-tags chdb` is enough to surface a build break in any
  # chdb-tagged file (test/property/*_test.go, the chDB probe, the
  # roundtrip walkers, test/perf/*) in seconds-to-low-minutes.
  #
  # Why this exists: the required PR gates (`check` + `lint` +
  # `forbid-skip`) are CGO-free and compile with the DEFAULT build tags,
  # so they never touch chdb-tagged source. The heavier chDB jobs that
  # DO compile it (`probe`, `roundtrip`, `perf-guards`) only run their
  # work on `pull_request` here — but a regression that breaks
  # compilation of, say, test/property (which only runs in property.yml
  # nightly) would otherwise hide until the next push-to-main / nightly.
  # PR #908 did exactly that: it changed `internal/api/loki.StreamValue`
  # from a tuple to a struct, broke `test/property/logql_test.go`, merged
  # green because no PR check compiled the chdb-tagged property package,
  # and broke the property lane on the next push. This job closes that
  # gap — a chdb-tag build break now fails a PR check, not a nightly.
  #
  # COMPILE-ONLY by design: no `go test` run, so it stays cheap enough
  # to gate every PR. The `go vet` step is the load-bearing one for the
  # #908 class: `go build ./...` does NOT compile `_test.go` files, but
  # the #908 break was in test/property/logql_test.go — `go vet` (and
  # only vet, among the two) typechecks test files without executing
  # them. `go build` is kept as the cheaper first signal for breaks in
  # non-test chdb-tagged source (the chDB probe, roundtrip walkers).
  chdb-build:
    name: chdb-build
    needs: changes
    # RELEASE-GATE lane (#2230): a chdb-tagged compile break is caught for
    # real on push / schedule / dispatch and on a `release/*` PR; an ordinary
    # PR (and a merge-group entry) short-circuits to a no-op in seconds. A
    # single non-matrix job's `if:` skip still posts its named context and
    # resolves — see roundtrip's comment below for why that is safe here but
    # NOT for a matrix job.
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      # Cache the pinned libchdb.so so the install step is a no-op cache
      # hit on the common path (the recipe is idempotent — it skips the
      # download when the file already exists at CHDB_INSTALL_PATH). The
      # key is pinned to the recipe's CHDB_VERSION so a version bump busts
      # the cache automatically.
      - name: Cache libchdb.so
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libchdb.so
          key: libchdb-${{ runner.os }}-${{ runner.arch }}-v26.5.0

      - name: Install libchdb.so
        run: just chdb-install

      - name: Compile chdb-tagged tree (go build)
        run: go build -tags chdb ./...

      - name: Vet chdb-tagged tree (go vet)
        run: go vet -tags chdb ./...

  probe:
    name: probe
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      - name: Install libchdb.so
        run: just chdb-install

      - name: Run chDB probe
        run: go test -tags chdb -v -count=1 -run TestChDBProbe ./internal/chclient/...

      - name: Run handler tests (chDB)
        run: just test-chdb

  # `roundtrip` walks every *.txtar fixture under test/spec/<ql>/ and,
  # for fixtures that declare both `seed:` and `expected_rows:`, runs
  # the stored `sql:` + `args:` against an ephemeral in-process chDB
  # session and asserts the resulting rows match `expected_rows:`. The
  # test entry point is `TestRoundTripChDB` in
  # test/spec/<ql>/roundtrip_chdb_test.go.
  #
  # Matrix entries run in parallel (`fail-fast: false`) so a regression
  # in one head doesn't mask regressions in the others.
  #
  # DOCS-ONLY GUARD IS PER-STEP, NOT JOB-LEVEL — deliberately. `roundtrip
  # (<ql>)` used to be a required status check on `main`; #2230 moved it to
  # the release gate (branch protection no longer waits on it), but the
  # matrix still runs on every `pull_request` so its check-run keeps
  # appearing in the PR rollup for visibility, and a job-level skip would
  # still hide a matrix's per-leg names from anything that DOES read them
  # (release.yml's RELEASE_REQUIRED_CHECKS, a future re-promotion). A
  # *job-level* `if: docs_only != 'true'` would skip the job before the
  # matrix expands, so the contexts `roundtrip (logql/traceql)` are never
  # created (a plain skipped non-matrix job reports its named context and
  # resolves, but a skipped matrix job never publishes its per-leg names).
  # Instead the job always runs so the matrix expands and each leg's context
  # is published; the docs-only/run_heavy guard sits on the work steps, so on
  # a docs-only PR — or any ordinary (non-release) PR now that this is a
  # release-gate lane — every step is skipped and each leg concludes
  # `success` in seconds (no chDB compile/run). Do NOT hoist this back to the
  # job level.
  #
  # promql does NOT need this per-step trick any more (tsouza/cerberus#2629):
  # its context is `roundtrip (promql)`, posted by the `roundtrip-promql`
  # AGGREGATOR below, which uses `if: always()` to guarantee the same
  # every-PR visibility property a job-level guard here would have hidden.
  # See the comment above `roundtrip-promql-shard`.
  roundtrip:
    name: roundtrip (${{ matrix.ql }})
    needs: changes
    runs-on: ubuntu-latest
    # Historical value carried over from when this job also ran promql
    # (#2624's corpus growth pushed a real push-to-main run past 20 minutes).
    # promql moved to its own `roundtrip-promql-shard` matrix (#2629), so
    # logql and traceql — whose whole JOBS finish in 173-181s per
    # chdb-roundtrip.mjs's own FANOUT comment — no longer need anywhere near
    # this ceiling. Left unchanged rather than retuned speculatively
    # (#2629's own acceptance notes this is a safe later reduction, not a
    # requirement of the split itself): a future change can lower it once it
    # has real CI timing for the logql/traceql-only job.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # `tags` is per-leg because both heads additionally run the parity
        # check against their REAL upstream reference engines (Loki, Tempo),
        # both AGPLv3 and therefore living behind `agpl_oracle`
        # (invariant 14). Every `//go:build` line in this tree is a single
        # term, so the composition `chdb && agpl_oracle` is carried by the
        # synthetic `chdb_agpl_oracle` tag — the same three-tag set
        # property.yml already passes. Without them the Loki/Tempo oracles
        # compile out (test/spec/parity_tempo_absent.go for Tempo) and
        # RunParity either fails loudly (Loki, see
        # test/spec/parity_chdb.go's lokiParityEvaluator) or all
        # `parity:`-enrolled TraceQL fixtures round-trip against
        # cerberus's own output alone.
        include:
          - ql: logql
            tags: chdb,agpl_oracle,chdb_agpl_oracle
          - ql: traceql
            tags: chdb,agpl_oracle,chdb_agpl_oracle
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'

      - uses: ./.github/actions/setup-go
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
        with:
          tool: just

      - name: Install libchdb.so
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
        run: just chdb-install

      # Two packages, not one, because they run DIFFERENT checks over the
      # same fixtures.
      #
      #   ./test/spec/<ql>/   — RunRoundTrip, the PRE-optimizer execution
      #                         that produces `expected_rows` and, under
      #                         GOLDEN_UPDATE=1, rewrites it.
      #   ./internal/<ql>/    — RunRoundTripSQL, the POST-optimizer twin.
      #                         It passes allowGoldenUpdate=false, so a
      #                         mismatch FAILS instead of being re-pinned
      #                         (see test/spec/runner_chdb.go:222-256).
      #
      # That makes the second one the only comparison in this lane
      # GOLDEN_UPDATE cannot launder — and until now no CI job ran it.
      # `just test-chdb` (Justfile:199) lists neither internal/promql,
      # internal/logql nor internal/traceql, and this step ran only the
      # test/spec side, so an optimizer bug that rewrote a fixture's
      # answer had nothing standing in its way.
      #
      # ./internal/<ql>/ additionally runs RunParity for every fixture
      # carrying a `parity:` section — the reference-engine comparison
      # that has no GOLDEN_UPDATE branch at all (test/spec/parity.go).
      #
      # The `go test` invocation lives in chdb-roundtrip.mjs, not here,
      # because it needs an explicit per-process `-timeout` a `run:` line
      # cannot carry: without one every leg silently runs under go test's own
      # 10-minute default (the #2094/#2096 regression this script exists to
      # fix — see its header). promql's own fan-out (in-runner AND, since
      # #2629, cross-runner) lives in `roundtrip-promql-shard` below instead.
      - name: Run TXTAR round-trip (${{ matrix.ql }})
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
        env:
          QL: ${{ matrix.ql }}
          TAGS: ${{ matrix.tags }}
        run: node .github/scripts/chdb-roundtrip.mjs

  # `roundtrip-promql-shard` + `roundtrip-promql` — promql's half of the
  # `roundtrip (<ql>)` lane, split off the `roundtrip` matrix above onto its
  # own multi-RUNNER shard matrix (tsouza/cerberus#2629). logql and traceql
  # stay on `roundtrip` above: their whole JOBS finish in 173-181s
  # (chdb-roundtrip.mjs's own FANOUT comment), an order of magnitude under
  # promql's leg, so a second runner axis would buy them nothing but repeated
  # compilation.
  #
  # promql's corpus grew past 700 TXTAR fixtures and the in-runner fan-out
  # (chdb-roundtrip.mjs's FANOUT.promql, 3 processes sharing ONE runner) has
  # a hard ceiling: chDB threads WITHIN a single query, so oversubscribing a
  # single 4-core runner past ~3-4 processes hurts rather than helps
  # (FANOUT's own doc comment cites the measurement: 8 legs on an 8-core box
  # came out WORSE than 4). Two consecutive timeout bumps this cycle
  # (job-level 20→35min, per-process 12→25min, both on 2026-08-25) were
  # config-value patches over that ceiling, not a fix — the corpus keeps
  # growing and a third bump was the next certainty.
  #
  # Topology (mirroring `perf-guards-shard` / `perf-guards` below, and
  # `compose-smoke-shard` / `compose-smoke` in e2e.yml):
  #   roundtrip-promql-shard — the matrix; each leg is a DEDICATED runner
  #                            that still fans out ~3 processes IN-runner
  #                            (chdb-roundtrip.mjs's FANOUT.promql) over its
  #                            own ROUNDTRIP_SHARD_INDEX / _COUNT slice. Total
  #                            parallelism is shard count × in-runner fan-out
  #                            instead of being capped at the in-runner ~3-4.
  #   roundtrip-promql       — the AGGREGATOR, named EXACTLY `roundtrip
  #                            (promql)` so release.yml's
  #                            RELEASE_REQUIRED_CHECKS and
  #                            .github/ci-lanes.json keep resolving it by
  #                            that exact text (matrix children report as
  #                            `roundtrip-promql-shard (n)`, never `roundtrip
  #                            (promql)`). Fails unless every leg passed.
  #
  # The aggregator is what keeps RELEASE_REQUIRED_CHECKS and ci-lanes.json
  # untouched — no rename, and branch protection is unaffected because it
  # never listed `roundtrip (promql)` in the first place (moved to the
  # release gate in #2230, same as `perf-guards`). Making the per-shard
  # contexts required instead would mean adding each one BEFORE it can ever
  # report (a window with the gate unenforced), and any stale
  # `roundtrip-promql-shard (n)` left in the set after a shard-count change
  # blocks every PR in the repo on a check that never arrives.
  #
  # Job-level guard (not per-step like the `roundtrip` matrix above), because
  # the required context is posted by the `roundtrip-promql` aggregator,
  # which always runs and reads this matrix's skip as one of three facts:
  # docs-only, non-heavy (an ordinary PR — `roundtrip (promql)` is a
  # release-gate lane), or a real failure. The every-PR visibility property
  # the per-step trick bought above still holds: the aggregator itself posts
  # `roundtrip (promql)` on every PR, exactly as the single unsharded job did.
  #
  # COST: N legs = N chDB installs and N compiles — billable minutes rise,
  # while wall-clock drops from the serial shard-of-fan-out sum toward the
  # longest shard's fan-out plus fixed setup.
  roundtrip-promql-shard:
    name: roundtrip-promql-shard
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # Carried over unchanged from `roundtrip`'s own bumped value: a safe
    # upper bound, not a measurement of this job. Each shard now covers
    # roughly 1/N of the corpus that bound was sized against, so real
    # per-shard wall-clock should land well under it — but retuning needs
    # real CI timing data this PR does not have, and a too-tight bound fails
    # loudly rather than saving anything. A follow-up can lower it once
    # shards have actually run (tsouza/cerberus#2629's own acceptance notes
    # this explicitly).
    #
    # Bumped from 35 to 45 on 2026-08-30 alongside chdb-roundtrip.mjs's
    # GO_TEST_TIMEOUT_MINUTES bump (25 -> 32): must stay strictly above that
    # per-process bound (chdb-roundtrip.test.mjs asserts the ordering) with
    # real margin for the job's own setup (checkout, toolchain, libchdb
    # install) on top. See GO_TEST_TIMEOUT_MINUTES's doc comment / cerberus#2737.
    timeout-minutes: 45
    strategy:
      # MANDATORY: one shard's failure must NOT cancel its siblings, for the
      # same reason `perf-guards-shard` sets this below — a corpus-wide
      # regression typically trips several slices at once and the full list
      # is the diagnosis.
      fail-fast: false
      matrix:
        # The shard count. Three mirrors chdb-roundtrip.mjs's own
        # FANOUT.promql — the same "diminishing past ~3-4" ceiling that
        # motivates the in-runner number is a reasonable starting point for
        # the outer axis too — so total effective parallelism is 3 runners ×
        # 3 in-runner processes = 9, up from 3. Changing this list is the
        # whole knob: chdb-roundtrip.mjs derives ROUNDTRIP_SHARD_COUNT from
        # `strategy.job-total`, never a repeated literal, so the partition
        # rebalances itself and no context name moves.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      # Cache the pinned libchdb.so, same key as `chdb-build`'s and
      # `perf-guards-shard`'s step, and for the same reason: fanning out to N
      # runners would otherwise mean N downloads of a ~500 MB shared library
      # per run.
      - name: Cache libchdb.so
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libchdb.so
          key: libchdb-${{ runner.os }}-${{ runner.arch }}-v26.5.0

      - name: Install libchdb.so
        run: just chdb-install

      - name: Run TXTAR round-trip (promql) — runner shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          QL: promql
          TAGS: chdb
          ROUNDTRIP_SHARD_INDEX: ${{ matrix.shard }}
          ROUNDTRIP_SHARD_COUNT: ${{ strategy.job-total }}
        run: node .github/scripts/chdb-roundtrip.mjs

  # The AGGREGATOR — named EXACTLY `roundtrip (promql)`. See the topology
  # comment above `roundtrip-promql-shard`.
  roundtrip-promql:
    name: roundtrip (promql)
    needs: [changes, roundtrip-promql-shard]
    # always() so it still runs — and still reports — when the matrix skipped
    # on a docs-only or non-heavy (ordinary PR) change. A required context
    # that goes missing is indistinguishable from one that is still running.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: gate on every roundtrip-promql shard
        run: node .github/scripts/roundtrip-promql-aggregate.mjs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
          SHARDS_RESULT: ${{ needs.roundtrip-promql-shard.result }}
          # Deliberately NOT passed. `strategy.job-total` here would be this
          # job's own (1), and a literal repeating the matrix length is
          # exactly the kind of second copy that drifts. The aggregate's
          # verdict does not depend on the number, so it says "the shard
          # matrix" instead of a figure it cannot verify.

  # `perf-guards` runs the chDB-tagged deterministic perf-regression
  # ASSERTIONS under test/perf/ — the load-bearing fix for task #73.
  # Before this job, test/perf compiled under the `chdb` tag but ran in
  # NO CI lane (nothing invoked `./test/perf/...`), so the harnesses only
  # `t.Logf`'d and could never fail. The tests are now assertion-pins, not
  # wall-clock benchmarks, so they belong on a gating lane:
  #
  #   - TestOrderByDecision_ChDB: EXPLAIN indexes=1 granule-prune ratio
  #     floor (≥4×) proving the cerberus-ddl MetricName-first metrics
  #     ORDER BY win (#791) still holds against a byte-identical
  #     ServiceName-first table.
  #   - TestSeriesFanout_ChDB: a don't-regress-upward /series round-trip
  #     ceiling (the #790 fan-in batching is held off main, so this pins
  #     the current N rather than asserting ==1).
  #   - TestSliceAllocs_ChDB: a don't-regress-upward allocation pin on the
  #     plan-slicer copy-on-write off-spine sharing. It asserts (*Planner)
  #     .slice()'s allocs/op stay under a bound at K=4 and K=16, so a revert
  #     of the COW sharing in internal/chplan/reanchor.go back to a per-shard
  #     CloneNode re-inflates the count past the bound and fails here. The
  #     wall-clock companion (internal/solver.BenchmarkSlice) is informational
  #     in perf-benchmark.yml; this is the gating arm.
  #   - TestCardinalityRatchet: the corpus-wide compute-fan-out ratchet, every
  #     executable TXTAR fixture diffed against its test/perf/cardinality-baseline/ shard.
  #   - TestScaleWallPin: the scan-amplification scale-wall pin.
  #
  # A RELEASE-GATE lane: named in release.yml's RELEASE_REQUIRED_CHECKS, but
  # (#2230) no longer a branch-protection required context on ordinary PRs —
  # it does its real chDB-heavy work on push / schedule / dispatch and on a
  # `release/*` head-branch PR, and short-circuits to a no-op everywhere else.
  # `test/regression/perf_guards_gate_test.go` pins the job name, the recipe
  # it runs, and the release-set membership, because none of those are
  # visible in a PR diff once release.yml's preflight is the thing holding
  # them together.
  #
  # Wall-clock perf stays in the informational `perf-benchmark.yml`
  # (benchstat, never gates) to avoid runner-variance flake; only the
  # deterministic structural assertions gate here.
  #
  # ---------------------------------------------------------------------------
  # SHARDED across a matrix of separate runner processes (#2002).
  #
  # TestCardinalityRatchet profiles every executable TXTAR fixture, one at a
  # time, in one process — so its runtime is a straight line in corpus size, and
  # the corpus is deliberately growing (the promql-parity-enrolment epic #1986
  # added ~150 fixtures in a single day). The lane went from the ~8 minutes its
  # recipe comment recorded to 867s, then past 1020s, against a 900s `-timeout`,
  # inside that one day. Raising the ceiling only moves the collision, and a
  # 20-30 minute "guard" is a bad outcome even when it technically passes.
  #
  # It cannot be parallelised INSIDE the process: profile.NewProfiler calls
  # chdb-go's package-level chdb.NewSession, which caches ONE session for the
  # whole process regardless of DSN and is not safe for concurrent in-process
  # use (#1987 / PR #2003). So the only available parallelism is N separate OS
  # processes over disjoint corpus slices, which is what this matrix is.
  #
  # Topology (mirroring compose-smoke-shard / compose-smoke in e2e.yml):
  #   perf-guards-shard  — the matrix; each leg profiles ONLY the corpus slice
  #                        its PERF_SHARD_INDEX names.
  #   perf-guards        — the AGGREGATOR, named EXACTLY `perf-guards` so the
  #                        required status check still appears and gates (matrix
  #                        children report as `perf-guards-shard (n)`, never
  #                        `perf-guards`). Fails unless every leg passed.
  #
  # The aggregator is what keeps branch protection and release.yml's
  # RELEASE_REQUIRED_CHECKS untouched. Making the per-shard contexts required
  # instead would mean adding each one BEFORE it can ever report (a window with
  # the gate unenforced), and any stale `perf-guards (shard-n)` left in the set
  # after a shard-count change blocks every PR in the repo on a check that never
  # arrives.
  #
  # There is no `-setup` job and no matrix-generator script: unlike compose-smoke
  # — where the partition is a hand-balanced assignment of named spec files that
  # a new spec can silently fall out of — this partition is computed at run time
  # from the fixture id (test/perf/profile/shard.go), so the matrix carries no
  # membership information at all. All the YAML has to say is how many legs
  # there are, and inline literals are the right home for that (repo rule:
  # non-trivial step logic goes to .github/scripts/*.mjs, trivial stays inline).
  #
  # COST: N legs = N chDB installs and N compiles — billable minutes rise, while
  # wall-clock drops from the serial sum toward the longest leg plus fixed setup.
  perf-guards-shard:
    name: perf-guards-shard
    needs: changes
    # Job-level (not per-step like `roundtrip`) because the required context is
    # posted by the `perf-guards` aggregator below, which always runs and reads
    # this matrix's skip as one of three facts: docs-only, non-heavy (#2230 —
    # `perf-guards` is a release-gate lane now), or a real failure.
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # Three minutes above `perf-chdb`'s own `-timeout 27m`, so Go's abort — the
    # one that dumps goroutine stacks and names WHERE a leg hung — always fires
    # before the runner takes the container away (pinned by
    # test/regression/go_test_timeout_budget_test.go).
    #
    # Both numbers are inherited unchanged from the stopgap bump, and sharding
    # is not a reason to lower them. They size the recipe's WORST case, which is
    # its other caller: the unsharded whole-corpus sweep, which a CI run on an
    # isolated runner measured at 1020s (17m) on 2026-08-09 and which sharding
    # does not speed up at all. A LEG finishes ~6-8x under this ceiling, so for
    # the matrix it is a hang detector rather than an estimate.
    timeout-minutes: 30
    strategy:
      # MANDATORY: one shard's failure must NOT cancel its siblings. The default
      # (true) cancels in-flight legs into the ambiguous `cancelled` rollup and
      # hides whether the others would also have failed — and for a RATCHET that
      # matters more than usual, because a corpus-wide fan-out regression
      # typically trips several slices at once and the full list is the diagnosis.
      fail-fast: false
      matrix:
        # The shard count. Sized so each leg stays near two minutes at today's
        # ~950 fixtures and still has room as the corpus grows: at 8 legs the
        # corpus can roughly triple before a leg reaches the runtime the whole
        # lane had when it was healthy. Changing this list is the whole knob —
        # PERF_SHARD_COUNT is derived from it below, the partition rebalances
        # itself, and no baseline, branch-protection entry or check name moves.
        # test/regression/perf_guards_gate_test.go pins it against the count the
        # partition's own balance test asserts at.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      # Cache the pinned libchdb.so, same key as `chdb-build`'s step. This
      # matters more here than anywhere else in the file: fanning out to 8 legs
      # would otherwise mean 8 downloads of a ~500 MB shared library per run,
      # and that fixed setup cost would eat much of the wall-clock the split is
      # buying. The recipe is idempotent — it skips the download when the file
      # is already at CHDB_INSTALL_PATH — so a cache hit makes the next step a
      # no-op. Key pinned to the recipe's CHDB_VERSION so a bump busts it.
      - name: Cache libchdb.so
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libchdb.so
          key: libchdb-${{ runner.os }}-${{ runner.arch }}-v26.5.0

      - name: Install libchdb.so
        run: just chdb-install

      # PERF_SHARD_COUNT comes from `strategy.job-total`, NOT a second literal:
      # it is the number of legs this matrix actually fans out to, so the count
      # the partition divides by cannot drift from the count that runs. A
      # hand-written 8 left behind after the list changed would silently leave a
      # slice of the corpus profiled by nobody, with every leg still green.
      - name: Run perf regression guards (chDB) — shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: just perf-chdb
        env:
          PERF_SHARD_INDEX: ${{ matrix.shard }}
          PERF_SHARD_COUNT: ${{ strategy.job-total }}

  # The AGGREGATOR — named EXACTLY `perf-guards` because release.yml's
  # RELEASE_REQUIRED_CHECKS resolves it by text (#2230 moved `perf-guards` off
  # branch protection's own required-contexts set, onto the release gate only).
  # The matrix children report as `perf-guards-shard (n)`, so without this job
  # the name release.yml waits for is never posted.
  perf-guards:
    name: perf-guards
    needs: [changes, perf-guards-shard]
    # always() so it still runs — and still reports — when the matrix skipped on
    # a docs-only or non-heavy (ordinary PR) change. A required context that
    # goes missing is indistinguishable from one that is still running.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: gate on every perf-guards shard
        run: node .github/scripts/perf-guards-aggregate.mjs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
          SHARDS_RESULT: ${{ needs.perf-guards-shard.result }}
          # Deliberately NOT passed. `strategy.job-total` here would be this
          # job's own (1), and a literal repeating the matrix length is exactly
          # the kind of second copy that drifts. The aggregate's verdict does
          # not depend on the number, so it says "the shard matrix" instead of
          # a figure it cannot verify.

  # `integration-promql` runs the chDB-backed EXOTIC PromQL integration
  # suite (test/integration/promql). It seeds ONE rich, fixed OTel fixture
  # (a mirror of the prometheus/compliance reference demo service) into an
  # ephemeral chDB session, mounts the real prom.Handler, and asserts every
  # query in the ~10-category exotic matrix against the from-scratch oracle
  # (test/property/oracle/promql) via property.CompareOutcomes.
  #
  # It is ORTHOGONAL to `roundtrip`: roundtrip pins per-fixture SQL shape
  # with self-derived (circular) expected_rows, catching CH execution
  # errors + golden drift; this suite drives the live parse -> lower ->
  # optimize -> emit -> execute pipeline against a TRUSTED, SUT-independent
  # oracle, catching SEMANTIC lowering/optimizer/emitter bugs the roundtrip
  # misses. CAT 1 (binary-op-over-rate) is the durable regression net for
  # the production code-47 break.
  #
  # No golden file + no GOLDEN_UPDATE: expected results are computed at run
  # time by the oracle, so a pass proves PromQL semantics, not reproduction
  # of a recording.
  integration-promql:
    name: integration (promql)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      - name: Cache libchdb.so
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libchdb.so
          key: libchdb-${{ runner.os }}-${{ runner.arch }}-v26.5.0

      - name: Install libchdb.so
        run: just chdb-install

      - name: Run exotic PromQL integration suite (chDB)
        run: go test -tags chdb -count=1 ./test/integration/promql/...

  # `integration-logql` is the LogQL sibling of integration-promql. It
  # seeds ONE rich, fixed OTel logs fixture, mounts the real loki.Handler,
  # and compares the stream rows for every category-matrix query with the
  # independent property oracle. The oracle's Loki parser dependency stays
  # test-only behind the established three-tag AGPL quarantine.
  #
  # This is ORTHOGONAL to `roundtrip`: roundtrip pins self-derived SQL and
  # expected_rows; this live HTTP pipeline has no golden/GOLDEN_UPDATE path
  # and catches semantic lowering, optimizer, emitter, and wire drift.
  integration-logql:
    name: integration (logql)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      - name: Cache libchdb.so
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libchdb.so
          key: libchdb-${{ runner.os }}-${{ runner.arch }}-v26.5.0

      - name: Install libchdb.so
        run: just chdb-install

      - name: Run exotic LogQL integration suite (chDB)
        run: go test -tags chdb,agpl_oracle,chdb_agpl_oracle -count=1 ./test/integration/logql/...

  # `integration-traceql` is the TraceQL sibling of integration-promql.
  # It seeds ONE rich, fixed OTel traces fixture with real parent chains,
  # mounts the real tempo.Handler, and compares every category-matrix query
  # with the independent from-scratch TraceQL property oracle.
  #
  # This is ORTHOGONAL to `roundtrip`: roundtrip pins self-derived SQL and
  # expected_rows; this live HTTP pipeline has no golden/GOLDEN_UPDATE path
  # and catches semantic selector, structural, aggregate, optimizer, emitter,
  # and wire drift.
  integration-traceql:
    name: integration (traceql)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: just

      - name: Cache libchdb.so
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libchdb.so
          key: libchdb-${{ runner.os }}-${{ runner.arch }}-v26.5.0

      - name: Install libchdb.so
        run: just chdb-install

      - name: Run exotic TraceQL integration suite (chDB)
        run: go test -tags chdb -count=1 ./test/integration/traceql/...
