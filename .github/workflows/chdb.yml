name: chdb

# chDB engine + TXTAR-roundtrip lane.
#
# Two informational jobs, both linking libchdb.so:
#
#   1. `probe`     — driver-shim sanity check (`TestChDBProbe`). Validates
#                    the chdb-go database/sql driver round-trips
#                    Map(String, String) into a Go map[string]string via
#                    rows.Scan. Originally the only chDB CI lane.
#
#   2. `roundtrip` — TXTAR seed → SQL → expected_rows differential lane,
#                    split into a matrix over the three QL heads
#                    (promql / logql / traceql). Each matrix entry runs
#                    `go test -tags chdb -count=1 ./test/spec/<ql>/...`
#                    which executes the chdb-tagged `TestRoundTripChDB`
#                    walker over every *.txtar fixture under that head
#                    that declares both `seed:` and `expected_rows:`.
#
# Why split: the required PR gates (`check` + `lint` + `forbid-skip`) are
# CGO-free and never compile the chdb-go driver, so they cannot run the
# roundtrip pass. Without this workflow exercising
# `./test/spec/{promql,logql,traceql}/`, fixture regressions slip past
# code review (e.g. label_replace_basic.txtar landed broken on main via
# #312 — no workflow caught it).
#
# Required on PRs whose path filter matches (see `paths:` below). The
# `probe` job and each `roundtrip (<ql>)` matrix entry are entries in
# the required-status-checks list on `main`. Required-on-match means
# GitHub's branch protection waits for the workflow to register a
# context; when the workflow is skipped by the path filter, the check
# is recorded as `expected` and resolves automatically because no run
# was created. Promoted from informational after Pool-DD #382 merged
# while the chDB lane was skipping `internal/api/**` changes and let
# four broken handler tests through (fixed in #388).
#
# If you widen the path filter, audit the required-checks list at the
# same time — a context that never runs blocks every PR.

on:
  push:
    # `release/*.x` so `probe` + `roundtrip (<ql>)` + `perf-guards` (required
    # checks, and all three named in release.yml's RELEASE_REQUIRED_CHECKS) also
    # run on a maintenance-line hotfix push, giving release.yml's maintenance
    # preflight check-runs to verify before publishing.
    branches: [main, 'release/*.x']
  # PR trigger has no `paths:` filter so `probe` and `roundtrip (<ql>)`
  # always appear in the PR rollup. Required for promoting them to
  # required-status-checks — a path-skipped check leaves the rollup
  # missing entries and would block merges of pure-docs PRs.
  pull_request:
  # Same reasoning one step further on: a merge queue gates on the same contexts
  # branch protection does, so `probe` / `roundtrip (<ql>)` / `perf-guards` have
  # to post on the projected trunk too. `roundtrip`'s docs-only guard is
  # per-STEP, never job-level, precisely so its three matrix legs always publish
  # their names — that property is what makes it queue-safe.
  merge_group:
  workflow_dispatch:
  schedule:
    # nightly at 04:00 UTC
    - cron: '0 4 * * *'

# chDB is loaded as a shared library and called over purego (a cgo-free
# FFI). Go's signal-based async preemption (SIGURG, on since 1.14) can fire
# while a goroutine is parked inside a libchdb.so downcall, and the foreign
# frame aborts with "signal arrived during cgo execution" (SIGABRT) — an
# infrastructure flake unrelated to the query under test. Disabling async
# preemption for the chDB test processes removes the interrupt; cooperative
# preemption still applies, and the production binary (built and run without
# this env) is unaffected.
env:
  GODEBUG: asyncpreemptoff=1

permissions:
  contents: read

concurrency:
  # Main pushes replace only older main pushes; matching cron schedules replace
  # only that scheduled mode. Every other event gets its own run-id group.
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'latest-main-push' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') && format('latest-main-schedule-{0}', github.event.schedule) || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.event.schedule != '') }}

jobs:
  # See `.github/workflows/ci.yml` for the rationale + filter convention.
  # Docs-only PRs short-circuit `probe` and the `roundtrip` matrix.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.compute.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          # See ci.yml for why `every` is required (the `**` baseline
          # plus negation patterns would otherwise always be true).
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.markdown'
              - '!docs/**'
              - '!LICENSE*'
              - '!CHANGELOG.md'
              - '!.markdownlint*'
              - '!CLAUDE.md'
              - '!AGENTS.md'
              - '!README*'

      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ steps.filter.outputs.code }}" = "false" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # `chdb-build` is a FAST, PR-visible compile gate over the entire
  # chdb-tagged tree. It does NOT run any tests — `go build` + `go vet`
  # with `-tags chdb` is enough to surface a build break in any
  # chdb-tagged file (test/property/*_test.go, the chDB probe, the
  # roundtrip walkers, test/perf/*) in seconds-to-low-minutes.
  #
  # Why this exists: the required PR gates (`check` + `lint` +
  # `forbid-skip`) are CGO-free and compile with the DEFAULT build tags,
  # so they never touch chdb-tagged source. The heavier chDB jobs that
  # DO compile it (`probe`, `roundtrip`, `perf-guards`) only run their
  # work on `pull_request` here — but a regression that breaks
  # compilation of, say, test/property (which only runs in property.yml
  # nightly) would otherwise hide until the next push-to-main / nightly.
  # PR #908 did exactly that: it changed `internal/api/loki.StreamValue`
  # from a tuple to a struct, broke `test/property/logql_test.go`, merged
  # green because no PR check compiled the chdb-tagged property package,
  # and broke the property lane on the next push. This job closes that
  # gap — a chdb-tag build break now fails a PR check, not a nightly.
  #
  # COMPILE-ONLY by design: no `go test` run, so it stays cheap enough
  # to gate every PR. The `go vet` step is the load-bearing one for the
  # #908 class: `go build ./...` does NOT compile `_test.go` files, but
  # the #908 break was in test/property/logql_test.go — `go vet` (and
  # only vet, among the two) typechecks test files without executing
  # them. `go build` is kept as the cheaper first signal for breaks in
  # non-test chdb-tagged source (the chDB probe, roundtrip walkers).
  chdb-build:
    name: chdb-build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2.85.10
        with:
          tool: just

      # Cache the pinned libchdb.so so the install step is a no-op cache
      # hit on the common path (the recipe is idempotent — it skips the
      # download when the file already exists at CHDB_INSTALL_PATH). The
      # key is pinned to the recipe's CHDB_VERSION so a version bump busts
      # the cache automatically.
      - name: Cache libchdb.so
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libchdb.so
          key: libchdb-${{ runner.os }}-${{ runner.arch }}-v26.5.0

      - name: Install libchdb.so
        run: just chdb-install

      - name: Compile chdb-tagged tree (go build)
        run: go build -tags chdb ./...

      - name: Vet chdb-tagged tree (go vet)
        run: go vet -tags chdb ./...

  probe:
    name: probe
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2.85.10
        with:
          tool: just

      - name: Install libchdb.so
        run: just chdb-install

      - name: Run chDB probe
        run: go test -tags chdb -v -count=1 -run TestChDBProbe ./internal/chclient/...

      - name: Run handler tests (chDB)
        run: just test-chdb

  # `roundtrip` walks every *.txtar fixture under test/spec/<ql>/ and,
  # for fixtures that declare both `seed:` and `expected_rows:`, runs
  # the stored `sql:` + `args:` against an ephemeral in-process chDB
  # session and asserts the resulting rows match `expected_rows:`. The
  # test entry point is `TestRoundTripChDB` in
  # test/spec/<ql>/roundtrip_chdb_test.go.
  #
  # Matrix entries run in parallel (`fail-fast: false`) so a regression
  # in one head doesn't mask regressions in the others.
  #
  # DOCS-ONLY GUARD IS PER-STEP, NOT JOB-LEVEL — deliberately. The three
  # `roundtrip (<ql>)` matrix legs are required status checks on `main`.
  # A *job-level* `if: docs_only != 'true'` would skip the job before the
  # matrix expands, so the contexts `roundtrip (promql/logql/traceql)`
  # are never created and branch protection blocks every docs-only PR
  # forever with "Expected — Waiting for status to be reported" (a plain
  # skipped non-matrix job reports its named context and resolves, but a
  # skipped matrix job never publishes its per-leg names). Instead the
  # job always runs so the matrix expands and each leg's context is
  # published; the docs-only guard sits on the work steps, so on a
  # docs-only PR every step is skipped and each leg concludes `success`
  # in seconds (no chDB compile/run) — satisfying the required check
  # without doing the work. Do NOT hoist this back to the job level.

      - name: emit native evidence for chdb.probe
        uses: ./.github/actions/ci-native-part
        with:
          id: chdb.probe.probe.source
  roundtrip:
    name: roundtrip (${{ matrix.ql }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `tags` is per-leg because the LogQL and TraceQL legs additionally
        # run the parity check against their REAL upstream reference
        # engines (Loki, Tempo), both AGPLv3 and therefore living behind
        # `agpl_oracle` (invariant 14). Every `//go:build` line in this
        # tree is a single term, so the composition `chdb && agpl_oracle`
        # is carried by the synthetic `chdb_agpl_oracle` tag — the same
        # three-tag set property.yml already passes. Without them the
        # Loki/Tempo oracles compile out (test/spec/parity_tempo_absent.go
        # for Tempo) and RunParity either fails loudly (Loki, see
        # test/spec/parity_chdb.go's lokiParityEvaluator) or all
        # `parity:`-enrolled TraceQL fixtures round-trip against
        # cerberus's own output alone.
        include:
          - ql: promql
            tags: chdb
          - ql: logql
            tags: chdb,agpl_oracle,chdb_agpl_oracle
          - ql: traceql
            tags: chdb,agpl_oracle,chdb_agpl_oracle
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - uses: actions/setup-go@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2.85.10
        if: needs.changes.outputs.docs_only != 'true'
        with:
          tool: just

      - name: Install libchdb.so
        if: needs.changes.outputs.docs_only != 'true'
        run: just chdb-install

      # Two packages, not one, because they run DIFFERENT checks over the
      # same fixtures.
      #
      #   ./test/spec/<ql>/   — RunRoundTrip, the PRE-optimizer execution
      #                         that produces `expected_rows` and, under
      #                         GOLDEN_UPDATE=1, rewrites it.
      #   ./internal/<ql>/    — RunRoundTripSQL, the POST-optimizer twin.
      #                         It passes allowGoldenUpdate=false, so a
      #                         mismatch FAILS instead of being re-pinned
      #                         (see test/spec/runner_chdb.go:222-256).
      #
      # That makes the second one the only comparison in this lane
      # GOLDEN_UPDATE cannot launder — and until now no CI job ran it.
      # `just test-chdb` (Justfile:199) lists neither internal/promql,
      # internal/logql nor internal/traceql, and this step ran only the
      # test/spec side, so an optimizer bug that rewrote a fixture's
      # answer had nothing standing in its way.
      #
      # ./internal/<ql>/ additionally runs RunParity for every fixture
      # carrying a `parity:` section — the reference-engine comparison
      # that has no GOLDEN_UPDATE branch at all (test/spec/parity.go).
      #
      # The `go test` invocation lives in chdb-roundtrip.mjs, not here,
      # because it needs two things a `run:` line cannot carry: an explicit
      # per-process `-timeout` (without one every leg silently runs under
      # go test's own 10-minute default, which the promql leg outgrew — see
      # the script's header) and, for promql, a fan-out over the
      # SPEC_SHARD_* partition with a failure-propagation contract.
      - name: Run TXTAR round-trip (${{ matrix.ql }})
        if: needs.changes.outputs.docs_only != 'true'
        env:
          QL: ${{ matrix.ql }}
          TAGS: ${{ matrix.tags }}
        run: node .github/scripts/chdb-roundtrip.mjs

  # `perf-guards` runs the chDB-tagged deterministic perf-regression
  # ASSERTIONS under test/perf/ — the load-bearing fix for task #73.
  # Before this job, test/perf compiled under the `chdb` tag but ran in
  # NO CI lane (nothing invoked `./test/perf/...`), so the harnesses only
  # `t.Logf`'d and could never fail. The tests are now assertion-pins, not
  # wall-clock benchmarks, so they belong on a gating lane:
  #
  #   - TestOrderByDecision_ChDB: EXPLAIN indexes=1 granule-prune ratio
  #     floor (≥4×) proving the cerberus-ddl MetricName-first metrics
  #     ORDER BY win (#791) still holds against a byte-identical
  #     ServiceName-first table.
  #   - TestSeriesFanout_ChDB: a don't-regress-upward /series round-trip
  #     ceiling (the #790 fan-in batching is held off main, so this pins
  #     the current N rather than asserting ==1).
  #   - TestSliceAllocs_ChDB: a don't-regress-upward allocation pin on the
  #     plan-slicer copy-on-write off-spine sharing. It asserts (*Planner)
  #     .slice()'s allocs/op stay under a bound at K=4 and K=16, so a revert
  #     of the COW sharing in internal/chplan/reanchor.go back to a per-shard
  #     CloneNode re-inflates the count past the bound and fails here. The
  #     wall-clock companion (internal/solver.BenchmarkSlice) is informational
  #     in perf-benchmark.yml; this is the gating arm.
  #   - TestCardinalityRatchet: the corpus-wide compute-fan-out ratchet, every
  #     executable TXTAR fixture diffed against its test/perf/cardinality-baseline/ shard.
  #   - TestScaleWallPin: the scan-amplification scale-wall pin.
  #
  # REQUIRED STATUS CHECK on `main`, and named in release.yml's
  # RELEASE_REQUIRED_CHECKS. It was neither until the cardinality ratchet's
  # rows were audited: the ratchet's own doc comment claimed the lane was
  # "already-required" and it was not, so a fixture whose fan-out grew turned
  # one non-blocking lane red and merged anyway. `test/regression/
  # perf_guards_gate_test.go` pins the job name, the recipe it runs, and the
  # release-set membership, because none of those are visible in a PR diff
  # once branch protection is the thing holding them together.
  #
  # Wall-clock perf stays in the informational `perf-benchmark.yml`
  # (benchstat, never gates) to avoid runner-variance flake; only the
  # deterministic structural assertions gate here.
  #
  # ---------------------------------------------------------------------------
  # SHARDED across a matrix of separate runner processes (#2002).
  #
  # TestCardinalityRatchet profiles every executable TXTAR fixture, one at a
  # time, in one process — so its runtime is a straight line in corpus size, and
  # the corpus is deliberately growing (the promql-parity-enrolment epic #1986
  # added ~150 fixtures in a single day). The lane went from the ~8 minutes its
  # recipe comment recorded to 867s, then past 1020s, against a 900s `-timeout`,
  # inside that one day. Raising the ceiling only moves the collision, and a
  # 20-30 minute "guard" is a bad outcome even when it technically passes.
  #
  # It cannot be parallelised INSIDE the process: profile.NewProfiler calls
  # chdb-go's package-level chdb.NewSession, which caches ONE session for the
  # whole process regardless of DSN and is not safe for concurrent in-process
  # use (#1987 / PR #2003). So the only available parallelism is N separate OS
  # processes over disjoint corpus slices, which is what this matrix is.
  #
  # Topology (mirroring compose-smoke-shard / compose-smoke in e2e.yml):
  #   perf-guards-shard  — the matrix; each leg profiles ONLY the corpus slice
  #                        its PERF_SHARD_INDEX names.
  #   perf-guards        — the AGGREGATOR, named EXACTLY `perf-guards` so the
  #                        required status check still appears and gates (matrix
  #                        children report as `perf-guards-shard (n)`, never
  #                        `perf-guards`). Fails unless every leg passed.
  #
  # The aggregator is what keeps branch protection and release.yml's
  # RELEASE_REQUIRED_CHECKS untouched. Making the per-shard contexts required
  # instead would mean adding each one BEFORE it can ever report (a window with
  # the gate unenforced), and any stale `perf-guards (shard-n)` left in the set
  # after a shard-count change blocks every PR in the repo on a check that never
  # arrives.
  #
  # There is no `-setup` job and no matrix-generator script: unlike compose-smoke
  # — where the partition is a hand-balanced assignment of named spec files that
  # a new spec can silently fall out of — this partition is computed at run time
  # from the fixture id (test/perf/profile/shard.go), so the matrix carries no
  # membership information at all. All the YAML has to say is how many legs
  # there are, and inline literals are the right home for that (repo rule:
  # non-trivial step logic goes to .github/scripts/*.mjs, trivial stays inline).
  #
  # COST: N legs = N chDB installs and N compiles — billable minutes rise, while
  # wall-clock drops from the serial sum toward the longest leg plus fixed setup.

      - name: emit native evidence for chdb.roundtrip-logql
        if: ${{ matrix.ql == 'logql' }}
        uses: ./.github/actions/ci-native-part
        with:
          id: chdb.roundtrip-logql.roundtrip.source

      - name: emit native evidence for chdb.roundtrip-promql
        if: ${{ matrix.ql == 'promql' }}
        uses: ./.github/actions/ci-native-part
        with:
          id: chdb.roundtrip-promql.roundtrip.source

      - name: emit native evidence for chdb.roundtrip-traceql
        if: ${{ matrix.ql == 'traceql' }}
        uses: ./.github/actions/ci-native-part
        with:
          id: chdb.roundtrip-traceql.roundtrip.source
  perf-guards-shard:
    name: perf-guards-shard
    needs: changes
    # Job-level (not per-step like `roundtrip`) because the required context is
    # posted by the `perf-guards` aggregator below, which always runs and reads
    # this matrix's skip as one of its two docs-only facts.
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Three minutes above `perf-chdb`'s own `-timeout 27m`, so Go's abort — the
    # one that dumps goroutine stacks and names WHERE a leg hung — always fires
    # before the runner takes the container away (pinned by
    # test/regression/go_test_timeout_budget_test.go).
    #
    # Both numbers are inherited unchanged from the stopgap bump, and sharding
    # is not a reason to lower them. They size the recipe's WORST case, which is
    # its other caller: the unsharded whole-corpus sweep, which a CI run on an
    # isolated runner measured at 1020s (17m) on 2026-08-09 and which sharding
    # does not speed up at all. A LEG finishes ~6-8x under this ceiling, so for
    # the matrix it is a hang detector rather than an estimate.
    timeout-minutes: 30
    strategy:
      # MANDATORY: one shard's failure must NOT cancel its siblings. The default
      # (true) cancels in-flight legs into the ambiguous `cancelled` rollup and
      # hides whether the others would also have failed — and for a RATCHET that
      # matters more than usual, because a corpus-wide fan-out regression
      # typically trips several slices at once and the full list is the diagnosis.
      fail-fast: false
      matrix:
        # The shard count. Sized so each leg stays near two minutes at today's
        # ~950 fixtures and still has room as the corpus grows: at 8 legs the
        # corpus can roughly triple before a leg reaches the runtime the whole
        # lane had when it was healthy. Changing this list is the whole knob —
        # PERF_SHARD_COUNT is derived from it below, the partition rebalances
        # itself, and no baseline, branch-protection entry or check name moves.
        # test/regression/perf_guards_gate_test.go pins it against the count the
        # partition's own balance test asserts at.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2.85.10
        with:
          tool: just

      # Cache the pinned libchdb.so, same key as `chdb-build`'s step. This
      # matters more here than anywhere else in the file: fanning out to 8 legs
      # would otherwise mean 8 downloads of a ~500 MB shared library per run,
      # and that fixed setup cost would eat much of the wall-clock the split is
      # buying. The recipe is idempotent — it skips the download when the file
      # is already at CHDB_INSTALL_PATH — so a cache hit makes the next step a
      # no-op. Key pinned to the recipe's CHDB_VERSION so a bump busts it.
      - name: Cache libchdb.so
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/libchdb.so
          key: libchdb-${{ runner.os }}-${{ runner.arch }}-v26.5.0

      - name: Install libchdb.so
        run: just chdb-install

      # PERF_SHARD_COUNT comes from `strategy.job-total`, NOT a second literal:
      # it is the number of legs this matrix actually fans out to, so the count
      # the partition divides by cannot drift from the count that runs. A
      # hand-written 8 left behind after the list changed would silently leave a
      # slice of the corpus profiled by nobody, with every leg still green.
      - name: Run perf regression guards (chDB) — shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: just perf-chdb
        env:
          PERF_SHARD_INDEX: ${{ matrix.shard }}
          PERF_SHARD_COUNT: ${{ strategy.job-total }}

  # The AGGREGATOR — named EXACTLY `perf-guards` because that is the name branch
  # protection's required-contexts set and release.yml's RELEASE_REQUIRED_CHECKS
  # both resolve by text. The matrix children report as `perf-guards-shard (n)`,
  # so without this job the required context is never posted and every PR sits
  # on an "Expected" check forever.
  perf-guards:
    name: perf-guards
    needs: [changes, perf-guards-shard]
    # always() so it still runs — and still reports — when the matrix skipped on
    # a docs-only change. A required context that goes missing is indistinguish-
    # able from one that is still running.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: gate on every perf-guards shard
        run: node .github/scripts/perf-guards-aggregate.mjs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARDS_RESULT: ${{ needs.perf-guards-shard.result }}
          # Deliberately NOT passed. `strategy.job-total` here would be this
          # job's own (1), and a literal repeating the matrix length is exactly
          # the kind of second copy that drifts. The aggregate's verdict does
          # not depend on the number, so it says "the shard matrix" instead of
          # a figure it cannot verify.

  # `integration-promql` runs the chDB-backed EXOTIC PromQL integration
  # suite (test/integration/promql). It seeds ONE rich, fixed OTel fixture
  # (a mirror of the prometheus/compliance reference demo service) into an
  # ephemeral chDB session, mounts the real prom.Handler, and asserts every
  # query in the ~10-category exotic matrix against the from-scratch oracle
  # (test/property/oracle/promql) via property.CompareOutcomes.
  #
  # It is ORTHOGONAL to `roundtrip`: roundtrip pins per-fixture SQL shape
  # with self-derived (circular) expected_rows, catching CH execution
