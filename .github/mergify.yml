# Merge queue. A pull request labelled `queue` enters it. Mergify checks up
# to batch_size queued pull requests together, on a draft pull request it
# opens holding main plus the batch, waits for every check the main ruleset
# requires to pass there, then squash-merges each pull request in the batch.
# The ruleset still requires each pull request's own checks before it merges,
# so the description- and commit-scanning gates (pr-body, forbid-deferral,
# commitlint) judge every pull request on the pull request itself. One batch
# is checked at a time: each check is a full CI run on the shared runners.
# A failed batch gets one split-and-recheck round; the pull requests still
# failing after it leave the queue.
# test/regression/mergify_config_test.go pins this shape.

queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - label=queue
      - -draft
    merge_method: squash
    update_method: merge
    batch_size: 5
    batch_max_failure_resolution_attempts: 1

merge_queue:
  max_parallel_checks: 1

# A pull request enters the queue as soon as it meets the queue conditions,
# so the `queue` label is what queues it.
merge_protections_settings:
  auto_merge_conditions: true
