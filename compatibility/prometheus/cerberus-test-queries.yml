# Cerberus-side curated PromQL test queries for the compatibility harness.
#
# This file is a near-verbatim copy of
# compatibility/prometheus/upstream/promql/promql-test-queries.yml
# (prometheus/compliance @ 7e28242) with a handful of cerberus-owned edits:
#
# 1. The PromLabs "demo service" preamble (lines 1-31 of the upstream file)
#    is stripped — it documents docker-run instructions for the prometheus-
#    demo-service that the OTel-seeded harness doesn't use.
# 2. One cerberus-owned case is appended to the histogram block: a
#    `histogram_quantile` over `sum by (<resource attribute>, le) (rate(…))`.
#    Upstream's corpus has no resource-attribute grouping because Prometheus
#    has no resource attributes; the OTel-CH schema stores them apart from
#    the datapoint attributes, so the aggregated fan-out has a grouping key
#    no upstream case can reach.
# 3. One cerberus-owned case is appended next to the existing `changes(...)`
#    case: `changes(demo_gauge_with_nan_run[{{.range}}])`. Upstream's demo
#    fixture never seeds a NaN sample, so it can't discriminate the
#    changes() NaN-both-sides carve-out (#1489) against a real reference
#    Prometheus — only against chDB. See demo_gauge_with_nan_run in
#    cmd/seed/main.go.
# 4. One cerberus-owned case is added to the vector-selector block: a regex
#    label matcher with no wildcards/anchors that is a strict PREFIX of an
#    actual label value (`job=~"dem"` against the seeded `job="demo"`).
#    ClickHouse's match() is a substring search; Prometheus regex matchers
#    are always implicitly fully anchored (issue #1741). The case only
#    discriminates cerberus's own lowering bug — reference Prometheus has
#    nothing to diverge on — but it is the corpus's only case that would
#    have caught it, so it stays alongside the other two documented edits.
# 5. Two more cerberus-owned cases pin classic-histogram lowering bugs found
#    by inspection rather than by upstream: a `histogram_quantile` over the
#    bare (non-`_bucket`) storage name must answer empty (#1483), and one
#    over `sum by(le)(<bucket-selector>)` with no wrapping rate/increase/
#    sum_over_time must still answer (#1692).
# 6. A cerberus-owned `__name__`-over-subquery block is appended next to the
#    existing subquery cases. Prometheus keeps `__name__` on exactly two
#    range functions (`last_over_time` / `first_over_time`) and resolves the
#    surviving name PER SERIES from the outer function's input series, so a
#    regex `__name__` matcher, an `@`-pinned subquery, and a nested
#    range-function inner each exercise a different carrier of that name
#    through cerberus's subquery spine (#1602, #1778, #1794). Upstream's
#    corpus reduces subqueries with `max_over_time`, which drops the name,
#    so no upstream case can discriminate any of them. The same block carries
#    a set-operator subquery inner (#1810) — `or` / `and` / `unless` forward
#    each surviving series' label set unchanged, so the name must survive
#    both the set operation and the outer reducer — and a name-drop
#    COLLISION pair (#1811): when a name-dropping range function is handed
#    two families that share a label shape, upstream refuses the query
#    outright, and the sibling case over families whose shapes differ pins
#    that the rejection is the collision and not the class. The bare
#    subquery half of #1809 has no case here: a bare subquery is
#    matrix-typed, and the compliance tester drives /api/v1/query_range,
#    where both backends reject a matrix-typed top-level expression.
# 7. A cerberus-owned native-histogram block replaces upstream's
#    `histogram_*` value-function cases. Upstream's demo fixture is
#    float-only, so every one of those cases compared an empty vector
#    against an empty vector; `demo_latency_exp_hist` (cmd/seed/main.go)
#    seeds a real OTel exponential histogram into ClickHouse and mirrors it
#    to the reference as a Prometheus native histogram over remote-write, so
#    the six value functions and the native `histogram_quantile` walk now
#    compare real distributions. The float-input cases are kept alongside,
#    with the emptiness they assert stated as the property it is.
# 8. A cerberus-owned duplicate-labelset block is appended at the end of the
#    file. Every other row in this corpus rewrites or drops labels into
#    DISTINCT label sets, so none of them reaches the abort reference
#    Prometheus raises when two series land on one label set — the six
#    label_replace rows included. The block builds that collision on
#    purpose, once per shape that can create it (a name-dropping instant
#    function, unary minus, a date function, both scalar-vector binary
#    orders, label_replace and label_join), and once per position each shape
#    can occupy: over a bare selector and over a range window. The two
#    positions are different plans in cerberus, and only the second can fail
#    silently — a matrix response has no shape for "two series, one label
#    set", so a wrong answer there is an empty result at status 200 rather
#    than an error. The block's last row is the injective control that
#    discriminates the two.
#
# Series schema: the harness seeds a fixture that mirrors PromLabs's demo
# service labels (`instance` / `job` / `type` / `mode` / `method` / `path`
# / `status` / `device`). `instance` values are `demo.promlabs.com:10000`
# / `:10001` / `:10002`; every series carries `job=demo`. See
# `cmd/seed/main.go::fixtureInserts` for the canonical label sets.
#
# Every metric family this corpus references is seeded, on BOTH backends: the
# seeder writes it to ClickHouse and remote-writes the same samples into the
# reference Prometheus. That is an enforced invariant, not a convention —
# test/regression/compat_promql_seed_corpus_test.go fails if any query names a
# family the seeder cannot produce, so a query can never again compare empty
# against empty and record a PASS it never earned.
#
# Two exemptions are explicit and closed:
#
#   - a query may reference a name prefixed `nonexistent` precisely because
#     the family must NOT exist. The gate asserts that prefix in both
#     directions — such a name is never seeded, and an unseeded name must
#     carry it;
#   - a query may reference a seeded classic-histogram family's BARE storage
#     name (no `_bucket` / `_count` / `_sum` suffix) precisely because that
#     spelling must resolve empty even though the family IS seeded (#1483):
#     the OTel-CH layout stores the row under that name, but it is not a
#     Prom-wire series name, so cerberus never serves it. The gate tracks
#     every seeded histogram family's bare name itself and exempts exactly
#     those, so this is a real regression pin, not a hollow comparison.
#
# Pointer-to-upstream: re-sync this file by re-copying the upstream and
# re-applying the edit above. Track in a follow-up issue so this
# divergence stays auditable.

test_cases:
  # Scalar literals.
  - query: '42'
  - query: '1.234'
  - query: '.123'
  - query: '1.23e-3'
  - query: '0x3d'
  - query: 'Inf'
  - query: '+Inf'
  - query: '-Inf'
  - query: 'NaN'

  # Vector selectors.
  # TODO(upstream): Add tests for staleness support.
  - query: 'demo_memory_usage_bytes'
  - query: '{__name__="demo_memory_usage_bytes"}'
  - query: 'demo_memory_usage_bytes{type="free"}'
  - query: 'demo_memory_usage_bytes{type!="free"}'
  - query: 'demo_memory_usage_bytes{instance=~"demo.promlabs.com:.*"}'
  - query: 'demo_memory_usage_bytes{instance=~"host"}'
  - query: 'demo_memory_usage_bytes{job=~"dem"}'
    # Cerberus-owned (see file header edit 3 / issue #1741): "dem" is a
    # strict prefix of the seeded job="demo", never the whole string, so
    # this must answer empty on both backends. A substring-search
    # lowering of `=~` would wrongly match every demo series.
  - query: 'demo_memory_usage_bytes{instance!~".*:10000"}'
  - query: 'demo_memory_usage_bytes{type="free", instance!="demo.promlabs.com:10000"}'
  - query: '{type="free", instance!="demo.promlabs.com:10000"}'
  - query: '{__name__=~".*"}'
    should_fail: true
    # Regex-only `__name__` matchers carry no literal name for cerberus's
    # table heuristic, so the scan must fan across the gauge AND sum
    # tables. `demo_cpu_usage_seconds_total` is seeded into
    # `otel_metrics_sum`: before the fan-out cerberus scanned only the
    # gauge table and returned empty while reference Prometheus returned
    # the 9 cpu series. The negated form must likewise exclude matching
    # series from BOTH tables, not just the gauge arm.
  - query: '{__name__=~"demo_cpu_usage_seconds.*"}'
  - query: '{__name__=~"demo_memory_usage_byte.+"}'
  - query: '{job="demo", __name__!~"demo_cpu_usage_seconds.*"}'
  - query: "nonexistent_metric_name"
  - query: 'demo_memory_usage_bytes offset {{.offset}}'
    variant_args: ['offset']
  - query: 'demo_memory_usage_bytes offset -{{.offset}}'
    variant_args: ['offset']
  # Test staleness handling.
  - query: demo_intermittent_metric

  # Aggregation operators.
  - query: '{{.simpleAggrOp}}(demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}}(nonexistent_metric_name)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}} by() (demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}} by(instance) (demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}} by(instance, type) (demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}} by(nonexistent) (demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}} without() (demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}} without(instance) (demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}} without(instance, type) (demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.simpleAggrOp}} without(nonexistent) (demo_memory_usage_bytes)'
    variant_args: ['simpleAggrOp']
  - query: '{{.topBottomOp}} (3, demo_memory_usage_bytes)'
    variant_args: ['topBottomOp']
  - query: '{{.topBottomOp}} by(instance) (2, demo_memory_usage_bytes)'
    variant_args: ['topBottomOp']
  - query: '{{.topBottomOp}} without(instance) (2, demo_memory_usage_bytes)'
    variant_args: ['topBottomOp']
  - query: '{{.topBottomOp}} without() (2, demo_memory_usage_bytes)'
    variant_args: ['topBottomOp']
  - query: 'quantile({{.quantile}}, demo_memory_usage_bytes)'
    variant_args: ['quantile']
  - query: 'avg(max by(type) (demo_memory_usage_bytes))'

  # Binary operators.
  - query: '1 * 2 + 4 / 6 - 10 % 2 ^ 2'
  - query: 'demo_num_cpus + (1 {{.compBinOp}} bool 2)'
    variant_args: ['compBinOp']
  - query: 'demo_memory_usage_bytes {{.binOp}} 1.2345'
    variant_args: ['binOp']
  - query: 'demo_memory_usage_bytes {{.compBinOp}} bool 1.2345'
    variant_args: ['compBinOp']
  - query: '1.2345 {{.compBinOp}} bool demo_memory_usage_bytes'
    variant_args: ['compBinOp']
  - query: '0.12345 {{.binOp}} demo_memory_usage_bytes'
    variant_args: ['binOp']
  - query: '(1 * 2 + 4 / 6 - (10%7)^2) {{.binOp}} demo_memory_usage_bytes'
    variant_args: ['binOp']
  - query: 'demo_memory_usage_bytes {{.binOp}} (1 * 2 + 4 / 6 - 10)'
    variant_args: ['binOp']
    # Check that vector-scalar binops set output timestamps correctly.
  - query: 'timestamp(demo_memory_usage_bytes * 1)'
    # Check that unary minus sets timestamps correctly.
    # TODO(upstream): Check this more systematically for every node type?
  - query: 'timestamp(-demo_memory_usage_bytes)'
  - query: 'demo_memory_usage_bytes {{.binOp}} on(instance, job, type) demo_memory_usage_bytes'
    variant_args: ['binOp']
  - query: 'sum by(instance, type) (demo_memory_usage_bytes) {{.binOp}} on(instance, type) group_left(job) demo_memory_usage_bytes'
    variant_args: ['binOp']
  - query: 'demo_memory_usage_bytes {{.compBinOp}} bool on(instance, job, type) demo_memory_usage_bytes'
    variant_args: ['compBinOp']
    # Check that __name__ is always dropped, even if it's part of the matching labels.
  - query: 'demo_memory_usage_bytes / on(instance, job, type, __name__) demo_memory_usage_bytes'
  - query: 'sum without(job) (demo_memory_usage_bytes) / on(instance, type) demo_memory_usage_bytes'
  - query: 'sum without(job) (demo_memory_usage_bytes) / on(instance, type) group_left demo_memory_usage_bytes'
  - query: 'sum without(job) (demo_memory_usage_bytes) / on(instance, type) group_left(job) demo_memory_usage_bytes'
  - query: 'demo_memory_usage_bytes / on(instance, job) group_left demo_num_cpus'
  - query: 'demo_memory_usage_bytes / on(instance, type, job, non_existent) demo_memory_usage_bytes'
  # One-to-one arithmetic with on(SUBSET): Prometheus reduces the output
  # label set to exactly the on() labels, dropping every non-matching
  # label (here `job`). demo_num_cpus is one series per instance, so
  # on(instance) is a valid one-to-one match -- unlike
  # demo_memory_usage_bytes, which has multiple `type` series per instance
  # and would be a many-to-many match on `instance` alone (Prometheus
  # rejects that with "matching labels must be unique on one side").
  # Cerberus previously retained the full LHS label set; this case pins the
  # reduction against real Prometheus.
  - query: 'demo_num_cpus {{.arithBinOp}} on(instance) demo_num_cpus'
    variant_args: ['arithBinOp']
  # One-to-one arithmetic with ignoring(SET): the output drops exactly
  # the ignored labels (and __name__), keeping the rest. Here `job` is
  # dropped, `instance` and `type` survive.
  - query: 'demo_memory_usage_bytes {{.arithBinOp}} ignoring(job) demo_memory_usage_bytes'
    variant_args: ['arithBinOp']
  # bool-comparison with on(SUBSET): a transformation, so the output is
  # likewise reduced to the on() labels. (demo_num_cpus for the same
  # one-to-one-on-instance reason as above.)
  - query: 'demo_num_cpus {{.compBinOp}} bool on(instance) demo_num_cpus'
    variant_args: ['compBinOp']
  # TODO(upstream): Add non-explicit many-to-one / one-to-many that errors.
  # TODO(upstream): Add many-to-many match that errors.

  # Set operators. Prometheus evaluates these once per evaluation
  # timestamp, so an arm only affects the other arm at the timestamps it
  # actually produced a sample for. demo_sparse_memory_bytes carries the
  # same label signature as demo_memory_usage_bytes but stops a quarter
  # of the way into the window, so over a range query the two arms
  # overlap early and diverge later. Matching on the label signature
  # alone would make `or` lose the late steps, `and` invent them, and
  # `unless` drop the whole series -- differences a range query exposes
  # and an instant query at a single timestamp cannot.
  - query: 'demo_sparse_memory_bytes or demo_memory_usage_bytes'
  - query: 'demo_memory_usage_bytes or demo_sparse_memory_bytes'
  - query: 'demo_memory_usage_bytes and demo_sparse_memory_bytes'
  - query: 'demo_sparse_memory_bytes and demo_memory_usage_bytes'
  - query: 'demo_memory_usage_bytes unless demo_sparse_memory_bytes'
  - query: 'demo_sparse_memory_bytes unless demo_memory_usage_bytes'
  # Explicit matchers restrict the signature the per-timestamp key is
  # built from: on(SUBSET) keys on just those labels, ignoring(SET)
  # keys on everything else.
  - query: 'demo_memory_usage_bytes and on(instance, job, type) demo_sparse_memory_bytes'
  - query: 'demo_memory_usage_bytes unless on(instance, job, type) demo_sparse_memory_bytes'
  - query: 'demo_memory_usage_bytes or on(instance, job, type) demo_sparse_memory_bytes'
  - query: 'demo_memory_usage_bytes and ignoring(type) demo_sparse_memory_bytes'
  - query: 'demo_memory_usage_bytes unless ignoring(type) demo_sparse_memory_bytes'
  - query: 'demo_memory_usage_bytes or ignoring(type) demo_sparse_memory_bytes'
  # A set operator over range-vector arms, so both sides are derived
  # shapes rather than bare selectors.
  - query: 'rate(demo_cpu_usage_seconds_total[{{.range}}]) or rate(demo_http_requests_total[{{.range}}])'
    variant_args: ['range']
  # Chained set operators linearise into one n-ary node; the per-
  # timestamp key has to survive that rewrite.
  - query: 'demo_sparse_memory_bytes or demo_memory_usage_bytes or demo_disk_usage_bytes'

  # NaN/Inf/-Inf support.
  - query: 'demo_num_cpus * Inf'
  - query: 'demo_num_cpus * -Inf'
  - query: 'demo_num_cpus * NaN'

  # Unary expressions.
  - query: 'demo_memory_usage_bytes + -(1)'
  - query: '-demo_memory_usage_bytes'
    # Check precedence.
  - query: -1 ^ 2

  # Binops involving non-const scalars.
  - query: '1 {{.arithBinOp}} time()'
    variant_args: ['arithBinOp']
  - query: 'time() {{.arithBinOp}} 1'
    variant_args: ['arithBinOp']
  - query: 'time() {{.compBinOp}} bool 1'
    variant_args: ['compBinOp']
  - query: '1 {{.compBinOp}} bool time()'
    variant_args: ['compBinOp']
  - query: 'time() {{.arithBinOp}} time()'
    variant_args: ['arithBinOp']
  - query: 'time() {{.compBinOp}} bool time()'
    variant_args: ['compBinOp']
  - query: 'time() {{.binOp}} demo_memory_usage_bytes'
    variant_args: ['binOp']
  - query: 'demo_memory_usage_bytes {{.binOp}} time()'
    variant_args: ['binOp']

  # Functions.
  - query: '{{.simpleTimeAggrOp}}_over_time(demo_memory_usage_bytes[{{.range}}])'
    variant_args: ['simpleTimeAggrOp', 'range']
  - query: 'quantile_over_time({{.quantile}}, demo_memory_usage_bytes[{{.range}}])'
    variant_args: ['quantile', 'range']
  - query: 'timestamp(demo_num_cpus)'
  - query: 'timestamp(timestamp(demo_num_cpus))'
  - query: '{{.simpleMathFunc}}(demo_memory_usage_bytes)'
    variant_args: ['simpleMathFunc']
  - query: '{{.simpleMathFunc}}(-demo_memory_usage_bytes)'
    variant_args: ['simpleMathFunc']
  - query: '{{.extrapolatedRateFunc}}(nonexistent_metric[5m])'
    variant_args: ['extrapolatedRateFunc']
  - query: '{{.extrapolatedRateFunc}}(demo_cpu_usage_seconds_total[{{.range}}])'
    variant_args: ['extrapolatedRateFunc', 'range']
  - query: 'deriv(demo_disk_usage_bytes[{{.range}}])'
    variant_args: ['range']
  - query: 'predict_linear(demo_disk_usage_bytes[{{.range}}], 600)'
    variant_args: ['range']
  - query: 'time()'
    # label_replace does a full-string match and replace.
  - query: 'label_replace(demo_num_cpus, "job", "destination-value-$1", "instance", "demo.promlabs.com:(.*)")'
    # label_replace does not do a sub-string match.
  - query: 'label_replace(demo_num_cpus, "job", "destination-value-$1", "instance", "host:(.*)")'
    # label_replace works with multiple capture groups.
  - query: 'label_replace(demo_num_cpus, "job", "$1-$2", "instance", "local(.*):(.*)")'
    # label_replace resolves `$10` as capture group TEN, not group one followed
    # by a literal `0`: Go's Regexp.ExpandString consumes the longest run of
    # name characters after the `$`. ClickHouse's own regex substitution tops
    # out at `\9`, so a backref above that ceiling has to be expanded by
    # cerberus rather than handed to the engine.
  - query: 'label_replace(demo_num_cpus, "job", "group10-$10", "instance", "(.)(.)(.)(.)(.)(.)(.)(.)(.)(.).*")'
    # label_replace does not overwrite the destination label if the source label does not exist.
  - query: 'label_replace(demo_num_cpus, "job", "value-$1", "nonexistent-src", "source-value-(.*)")'
    # label_replace overwrites the destination label if the source label is empty, but matched.
  - query: 'label_replace(demo_num_cpus, "job", "value-$1", "nonexistent-src", "(.*)")'
    # label_replace does not overwrite the destination label if the source label is not matched.
  - query: 'label_replace(demo_num_cpus, "job", "value-$1", "instance", "non-matching-regex")'
    # label_replace drops labels that are set to empty values.
  - query: 'label_replace(demo_num_cpus, "job", "", "dst", ".*")'
    # label_replace fails when the regex is invalid.
  - query: 'label_replace(demo_num_cpus, "job", "value-$1", "src", "(.*")'
    should_fail: true
    # `label_replace(..., "~invalid", ...)` / `label_replace(..., "instance",
    # "", "", "")` / `label_join(..., "~invalid", ...)` were `should_fail`
    # against Prom 2.x — `~invalid` violated the legacy label-name regex
    # `[a-zA-Z_][a-zA-Z0-9_]*` so the function errored. Prom 3.0+ ships UTF-8
    # label names by default
    # (https://prometheus.io/docs/prometheus/latest/feature_flags/#utf-8-label-name-support),
    # so `~invalid` is now legal and the queries succeed. Reference Prom in
    # this harness is `prom/prometheus:v3.0.1`, so they can't be flagged
    # `should_fail: true` anymore. Re-introduce only if the upstream
    # compliance suite tightens these into Prom-3.x-shaped should_fail
    # cases (e.g. genuinely malformed regex, multi-byte invalid identifier).
  - query: 'label_join(demo_num_cpus, "new_label", "-", "instance", "job")'
  - query: 'label_join(demo_num_cpus, "job", "-", "instance", "job")'
  - query: 'label_join(demo_num_cpus, "job", "-", "instance")'
  - query: '{{.dateFunc}}()'
    variant_args: ['dateFunc']
  - query: '{{.dateFunc}}(demo_batch_last_success_timestamp_seconds offset {{.offset}})'
    variant_args: ['dateFunc', 'offset']
  - query: '{{.instantRateFunc}}(demo_cpu_usage_seconds_total[{{.range}}])'
    variant_args: ['instantRateFunc', 'range']
  - query: '{{.clampFunc}}(demo_memory_usage_bytes, 2)'
    variant_args: ['clampFunc']
  - query: 'clamp(demo_memory_usage_bytes, 0, 1)'
  - query: 'clamp(demo_memory_usage_bytes, 0, 1000000000000)'
  - query: 'clamp(demo_memory_usage_bytes, 1000000000000, 0)'
  - query: 'clamp(demo_memory_usage_bytes, 1000000000000, 1000000000000)'
  - query: 'resets(demo_cpu_usage_seconds_total[{{.range}}])'
    variant_args: ['range']
  - query: 'changes(demo_batch_last_success_timestamp_seconds[{{.range}}])'
    variant_args: ['range']
    # A NaN-NaN run inside the lookback window: pins the changes() Prom
    # parity carve-out for NaN-on-both-sides pairs (#1489) against a real
    # reference Prometheus, not just chDB. See demo_gauge_with_nan_run in
    # cmd/seed/main.go.
  - query: 'changes(demo_gauge_with_nan_run[{{.range}}])'
    variant_args: ['range']
  - query: 'vector(1.23)'
  - query: 'vector(time())'
  - query: 'histogram_quantile({{.quantile}}, rate(demo_api_request_duration_seconds_bucket[1m]))'
    variant_args: ['quantile']
  - query: 'histogram_quantile(0.5, sum by (k8s_namespace_name, le) (rate(demo_resource_latency_seconds_bucket[1m])))'
  - query: 'histogram_quantile(0.9, nonexistent_metric)'
  - # Missing "le" label.
    query: 'histogram_quantile(0.9, demo_memory_usage_bytes)'
  - # Missing "le" label only in some series of the same grouping.
    query: 'histogram_quantile(0.9, {__name__=~"demo_api_request_duration_seconds_.+"})'
  - # #1483: the bare classic-histogram name (the OTel-CH *storage* name, no
    # `_bucket` suffix) is not a Prom-wire series name — a classic histogram
    # only exposes `<base>_bucket` / `_count` / `_sum`. Reference answers
    # empty; this pins that cerberus does too instead of over-answering by
    # scanning the same rows the `_bucket` spelling would.
    query: 'histogram_quantile(0.9, demo_api_request_duration_seconds)'
  - # #1692: `histogram_quantile(phi, sum by(le)(<bucket-selector>))` with no
    # wrapping rate()/increase()/sum_over_time() is still valid PromQL — the
    # instant vector's own sample values ARE the bucket counts. This must
    # answer, not silently fold to empty.
    query: 'histogram_quantile(0.9, sum by (le) (demo_api_request_duration_seconds_bucket))'
  - query: 'count_values("value", demo_api_request_duration_seconds_bucket)'
  - query: 'absent(demo_memory_usage_bytes)'
  - query: 'absent(nonexistent_metric_name)'

  # Subqueries.
  - query: 'max_over_time((time() - max(demo_batch_last_success_timestamp_seconds) < 1000)[5m:10s] offset 5m)'
  - query: 'avg_over_time(rate(demo_cpu_usage_seconds_total[1m])[2m:10s])'

  # Vector-vector binary op over range-vector (rate) operands. Before
  # the vector-join MetricName/TimeUnix fix these produced ClickHouse
  # code 47 (Unknown expression identifier '_join_MetricName' /
  # 'TimeUnix') because an instant range-vector operand's RangeWindow
  # subquery projects neither MetricName nor TimeUnix, yet the join side
  # read both. The first is the minimal repro; the last mirrors the
  # production Grafana query shape (topk over sum-by over rate+rate).
  - query: 'rate(demo_cpu_usage_seconds_total[1m]) + rate(demo_cpu_usage_seconds_total[1m])'
  - query: 'rate(demo_cpu_usage_seconds_total[1m]) / rate(demo_cpu_usage_seconds_total[1m])'
  - query: 'topk(10, sum by(instance) (rate(demo_cpu_usage_seconds_total[1m]) + rate(demo_http_requests_total[1m])))'

  # Range-mode matrix offset (output-timestamp labeling).
  #
  # PromQL `offset` shifts only WHICH samples are read; the result is
  # reported at the UNSHIFTED eval time t (the request grid), never at
  # t-offset. In matrix mode the range_window emitter must therefore
  # emit the output timestamp from the unshifted grid anchor while the
  # internal window/rate math still runs against the offset-shifted
  # base. A regression that stamps the output at t-offset lands every
  # sample one offset early.
  #
  # The bare-selector offset path (RangeLWR — see the two
  # `demo_memory_usage_bytes offset {{.offset}}` cases above) was
  # already correct, so nothing here previously drove RANGE-mode matrix
  # offset differentially against reference Prometheus: single-arm
  # parity hid it because both the reference and cerberus arms would
  # have had to disagree, and only a JOIN across a shifted and an
  # unshifted arm surfaces the mislabel. These cases pin the labeling
  # for the extrapolated-rate family (delta/rate/increase), the
  # instant-rate family (idelta/irate), and the `_over_time` reducers,
  # each over a matrix range with a positive offset (kept inside the 1h
  # seed window so the comparison is over non-empty matrices at every
  # step) and a negative (future-facing) offset.
  - query: '{{.extrapolatedRateFunc}}(demo_cpu_usage_seconds_total[{{.range}}] offset {{.offset}})'
    variant_args: ['extrapolatedRateFunc', 'range', 'offset']
  - query: '{{.extrapolatedRateFunc}}(demo_cpu_usage_seconds_total[5m] offset -{{.offset}})'
    variant_args: ['extrapolatedRateFunc', 'offset']
  - query: '{{.instantRateFunc}}(demo_cpu_usage_seconds_total[5m] offset {{.offset}})'
    variant_args: ['instantRateFunc', 'offset']
  - query: '{{.simpleTimeAggrOp}}_over_time(demo_memory_usage_bytes[5m] offset {{.offset}})'
    variant_args: ['simpleTimeAggrOp', 'offset']
  - query: '{{.simpleTimeAggrOp}}_over_time(demo_memory_usage_bytes[5m] offset -{{.offset}})'
    variant_args: ['simpleTimeAggrOp', 'offset']

  # Wrong-rejection burndown (rejection-parity catalogue, 2026-06):
  # value-level coverage for every shape cerberus newly accepts. Each
  # entry below 422'd on cerberus before the burndown while reference
  # Prometheus answered it.
  # atan2 binary operator.
  - query: 'demo_memory_usage_bytes atan2 demo_memory_usage_bytes'
  - query: 'demo_memory_usage_bytes atan2 2'
  - query: '2 atan2 demo_memory_usage_bytes'
  # topk/bottomk K domain (K < 1 → empty result; fractional truncates).
  - query: 'topk(0, demo_memory_usage_bytes)'
  - query: 'topk(1.5, demo_memory_usage_bytes)'
  - query: 'bottomk(0.5, demo_memory_usage_bytes)'
  # absent() over arbitrary expressions.
  - query: 'absent(sum(demo_memory_usage_bytes))'
  - query: 'absent(sum(nonexistent_metric_name))'
  - query: 'absent(demo_memory_usage_bytes + demo_memory_usage_bytes)'
  # histogram_quantile over a non-bucket input (reference skips float
  # samples without `le` → empty).
  - query: 'histogram_quantile(0.9, sum(demo_memory_usage_bytes))'
  # Computed scalar() arguments. demo_num_cpus is constant per the
  # seed, so the per-statement scalar binding agrees with reference's
  # per-step evaluation at every step.
  - query: 'clamp_min(demo_memory_usage_bytes, scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}))'
  - query: 'clamp_max(demo_memory_usage_bytes, scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}))'
  - query: 'clamp(demo_memory_usage_bytes, scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}), 1000000000000)'
  - query: 'round(demo_memory_usage_bytes, scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}))'
  - query: 'quantile(scalar(vector(0.5)), demo_memory_usage_bytes)'
  - query: 'histogram_quantile(scalar(vector(0.9)), rate(demo_api_request_duration_seconds_bucket[1m]))'
  - query: 'predict_linear(demo_disk_usage_bytes[5m], scalar(vector(3600)))'
  - query: 'quantile_over_time(scalar(vector(0.5)), demo_memory_usage_bytes[5m])'
  - query: 'vector(scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}))'
  # Subqueries over arbitrary expressions.
  - query: 'max_over_time((-demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(sum(demo_memory_usage_bytes + demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(stddev(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(label_replace(demo_memory_usage_bytes, "replaced", "$1", "instance", "(.*)")[5m:1m])'
  - query: 'max_over_time(absent(nonexistent_metric_name)[5m:1m])'
  - query: 'max_over_time(absent(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(quantile(scalar(vector(0.5)), demo_memory_usage_bytes)[5m:1m])'
  # irate / idelta family over subqueries.
  - query: 'irate(demo_cpu_usage_seconds_total[5m:1m])'
  - query: 'max_over_time(irate(demo_cpu_usage_seconds_total[5m:1m])[10m:1m])'
  # `__name__` over subqueries. last_over_time / first_over_time are the two
  # range functions Prometheus does NOT strip `__name__` from, and the name
  # is resolved per input series rather than from the query text — so each
  # of these differs from the max_over_time cases above in the LABELS the
  # comparison sees, not just the values.
  - query: 'last_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'first_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'last_over_time({__name__=~"demo_memory_usage_bytes|demo_disk_usage_bytes"}[10m:1m])'
  - query: 'last_over_time(demo_memory_usage_bytes[10m:1m] @ start())'
  - query: 'last_over_time(last_over_time(demo_memory_usage_bytes[5m])[10m:1m])'
  # rate() has already stripped `__name__`, so a preserving outer function
  # must not resurrect it.
  - query: 'last_over_time(rate(demo_cpu_usage_seconds_total[5m])[10m:1m])'
  # Set-operator subquery inner. `or` / `and` / `unless` forward each
  # surviving series' own label set unchanged — unlike arithmetic and
  # comparison-with-`bool`, they do not drop the name — so the name has to
  # survive both the set operation's projection and the outer reducer.
  # The two families carry different label shapes (`type` vs `device`), so
  # every series of both arms survives the match and the comparison sees
  # sixteen distinct label sets rather than a merged handful.
  - query: 'last_over_time((demo_memory_usage_bytes or demo_disk_usage_bytes)[10m:1m])'
  # Dropping `__name__` off a selector that spans two families sharing one
  # label shape collapses them onto the same label set, which upstream
  # refuses ("vector cannot contain metrics with the same labelset") rather
  # than merging. demo_memory_usage_bytes and demo_sparse_memory_bytes are
  # seeded on an identical {instance, job, type} shape for exactly this, and
  # the sparse family covers the first quarter of the window, so the early
  # steps of the range put both families in the same 5m window.
  - query: 'rate({__name__=~"demo_memory_usage_bytes|demo_sparse_memory_bytes"}[5m])'
    should_fail: true
  # The other side of that boundary: the same name-dropping shape over
  # families whose label shapes DIFFER stays a legal query on both
  # backends, so the rejection above cannot pass by rejecting the class.
  - query: 'rate({__name__=~"demo_memory_usage_bytes|demo_disk_usage_bytes"}[5m])'
  # Native histograms. `demo_latency_exp_hist` is an OTel exponential
  # histogram in ClickHouse and a Prometheus native histogram on the
  # reference (cmd/seed/main.go seeds the first, cmd/seed/prom_remote.go
  # mirrors the second). Scale 0 puts the bucket boundaries on exact
  # powers of two; the two seeded instances carry different positive
  # offsets and different bucket shapes, so a series mix-up cannot pass.
  #
  # Value functions: Count / Sum / Sum÷Count, then the bucket-midpoint
  # variance estimate (geometric midpoints for standard exponential
  # buckets) in both its stddev and stdvar spellings.
  - query: 'histogram_count(demo_latency_exp_hist)'
  - query: 'histogram_sum(demo_latency_exp_hist)'
  - query: 'histogram_avg(demo_latency_exp_hist)'
  - query: 'histogram_stddev(demo_latency_exp_hist)'
  - query: 'histogram_stdvar(demo_latency_exp_hist)'
  # Rank walk with both bounds strictly interior to a populated bucket, so
  # the case discriminates the in-bucket exponential interpolation rather
  # than only the whole-bucket sums a boundary-aligned pair would reach.
  - query: 'histogram_fraction(3, 12, demo_latency_exp_hist)'
  # Quantile interpolation across the distribution: phi = 0 (the lower edge
  # of the lowest populated bucket, taken without interpolating — 1 for the
  # offset-0 instance and 2 for the offset-1 one, so the two disagree and a
  # constant answer for either cannot pass), a low phi that lands exactly on
  # a bucket edge for one instance and inside a bucket for the other, one in
  # a middle bucket, one in the top bucket, and phi = 1 (the upper edge of
  # the highest populated bucket, likewise uninterpolated).
  - query: 'histogram_quantile(0, demo_latency_exp_hist)'
  - query: 'histogram_quantile(0.1, demo_latency_exp_hist)'
  - query: 'histogram_quantile(0.5, demo_latency_exp_hist)'
  - query: 'histogram_quantile(0.9, demo_latency_exp_hist)'
  - query: 'histogram_quantile(1, demo_latency_exp_hist)'
  # Same walk under a label matcher: one series, one known bucket layout,
  # so the result pins that instance's offset rather than either instance's.
  - query: 'histogram_quantile(0.9, demo_latency_exp_hist{instance="demo.promlabs.com:10000"})'
  # Float inputs: the native-histogram value functions skip float samples
  # rather than erroring, so a float family and an absent family both
  # answer the empty vector on both backends. These pin that acceptance,
  # not the histogram math — the cases above own the math.
  - query: 'histogram_count(demo_memory_usage_bytes)'
  - query: 'histogram_sum(demo_memory_usage_bytes)'
  - query: 'histogram_avg(nonexistent_metric_name)'
  - query: 'histogram_stddev(demo_memory_usage_bytes)'
  - query: 'histogram_fraction(0.2, 0.8, demo_memory_usage_bytes)'
  # Subquery-argument range functions (rejection-parity, 2026-08).
  # absent_over_time and the four ts_of_*_over_time reducers took a
  # matrix selector only; each 422'd on a subquery argument while
  # reference Prometheus answered it.
  - query: 'absent_over_time(nonexistent_metric_name[5m:1m])'
  - query: 'absent_over_time(demo_memory_usage_bytes[5m:1m])'
  - query: 'absent_over_time(rate(demo_cpu_usage_seconds_total[5m])[10m:1m])'
  - query: 'ts_of_first_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'ts_of_last_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'ts_of_max_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'ts_of_min_over_time(demo_memory_usage_bytes[10m:1m])'
  # Instant-vector transforms in subquery-inner position. Sorting is
  # identity on the sample set once the anchor's result folds into the
  # matrix; the date components and the native-histogram accessors are
  # per-sample value maps.
  - query: 'max_over_time(sort(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(sort_desc(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(sort_by_label(demo_memory_usage_bytes, "instance")[5m:1m])'
  - query: 'max_over_time(sort_by_label_desc(demo_memory_usage_bytes, "instance")[5m:1m])'
  - query: 'max_over_time(hour(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(day_of_week(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(timestamp(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(histogram_count(demo_latency_exp_hist)[5m:1m])'
  - query: 'max_over_time(histogram_sum(demo_latency_exp_hist)[5m:1m])'
  - query: 'max_over_time(histogram_avg(demo_latency_exp_hist)[5m:1m])'
  # Computed K for topk / bottomk: any scalar-valued expression, not
  # just a bare `scalar(<vector>)`. demo_num_cpus is constant per the
  # seed, so the per-statement binding agrees with reference's per-step
  # evaluation at every step. limitk is deliberately absent — its K
  # survivors are arbitrary, so a differential comparison is meaningless.
  - query: 'topk(scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}) * 2, demo_memory_usage_bytes)'
  - query: 'topk(2 + scalar(vector(1)), demo_memory_usage_bytes)'
  - query: 'bottomk(scalar(vector(2)) + 1, demo_memory_usage_bytes)'
  - query: 'topk((scalar(vector(4)) + 2) / 2, demo_memory_usage_bytes)'
  - query: 'max_over_time(topk(scalar(vector(2)), demo_memory_usage_bytes)[5m:1m])'
  # String- and matrix-typed top-level expressions: the compliance
  # tester drives /api/v1/query_range, where BOTH backends reject
  # non-Scalar/Vector expression types — pinning cerberus's new
  # upstream-shaped type gate.
  - query: '"a string literal"'
    should_fail: true
  - query: 'demo_memory_usage_bytes[5m]'
    should_fail: true
  # Duplicate-labelset boundary (cerberus-owned; see file header edit 8).
  #
  # Every row below is built so two or more series land on ONE label set,
  # which reference Prometheus refuses to answer. The corpus otherwise
  # carries no such query — its six label_replace rows all rewrite into
  # distinct label sets — so this boundary was pinned only by cerberus's
  # own tests.
  #
  # `demo_disk_usage_bytes` and `demo_disk_total_bytes` carry the IDENTICAL
  # label shape (`instance` × `device` × `job`) over the identical values,
  # so dropping `__name__` maps each pair onto one label set. Reference
  # Prometheus keeps the name internally until the result is built and then
  # errors from mergeSeriesWithSameLabelset, because the two series hold a
  # sample at every shared step.
  #
  # `demo_num_cpus` and `demo_cpu_usage_seconds_total` carry the two
  # rewrite collisions: flattening `instance` (resp. `mode`) onto a
  # constant, or joining it from zero source labels so it drops out,
  # merges series that shared a name to begin with. Reference errors from
  # rangeEval's per-step duplicate check, because a rewrite preserves the
  # name and the merged samples hash identically.
  #
  # Each shape appears twice: over a bare selector, and over a range
  # window. The two are different plans in cerberus, and the range one
  # cannot surface a collision as an error on the wire at all — a matrix
  # response has no shape for "two series, one label set" — so an
  # instant-only row leaves the range half unpinned.
  - query: 'ceil({__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"})'
    should_fail: true
  - query: '-{__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"}'
    should_fail: true
  - query: '{{.dateFunc}}({__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"})'
    variant_args: ['dateFunc']
    should_fail: true
  # Both scalar⊗vector orders: cerberus lowers `scalar op vector` and
  # `vector op scalar` through separate arms, so one being guarded says
  # nothing about the other.
  - query: '2 * {__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"}'
    should_fail: true
  - query: '{__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"} * 2'
    should_fail: true
  # The same five shapes over a range window. `avg_over_time` drops the
  # name exactly as the instant transforms do, and both families are
  # gauges, so the reducer is the honest one to read them with.
  - query: 'ceil(avg_over_time({__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"}[{{.range}}]))'
    variant_args: ['range']
    should_fail: true
  - query: '-avg_over_time({__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"}[{{.range}}])'
    variant_args: ['range']
    should_fail: true
  - query: '{{.dateFunc}}(avg_over_time({__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"}[{{.range}}]))'
    variant_args: ['dateFunc', 'range']
    should_fail: true
  - query: '2 * avg_over_time({__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"}[{{.range}}])'
    variant_args: ['range']
    should_fail: true
  - query: 'avg_over_time({__name__=~"demo_disk_usage_bytes|demo_disk_total_bytes"}[{{.range}}]) * 2'
    variant_args: ['range']
    should_fail: true
  # Label rewrites over a bare selector: `instance` is the only label that
  # distinguishes demo_num_cpus's three series.
  - query: 'label_replace(demo_num_cpus, "instance", "merged", "instance", ".*")'
    should_fail: true
  - query: 'label_join(demo_num_cpus, "instance", "-")'
    should_fail: true
  # Label rewrites over a range window — the shape whose collision has no
  # wire representation. `mode` is what separates each instance's three
  # counter series, so flattening or dropping it merges them.
  #
  # The window is pinned rather than driven by the `range` variant: `rate`
  # needs two samples inside the window to emit anything at all, and the
  # variant set opens at `1s`, well under the scrape interval. At that
  # width every series is empty, nothing collides, and reference answers
  # 200 — so a `should_fail` row driven by the variant asserts the
  # opposite of what it claims for the narrowest member of the set.
  - query: 'label_replace(rate(demo_cpu_usage_seconds_total[1m]), "mode", "all", "mode", ".*")'
    should_fail: true
  - query: 'label_join(rate(demo_cpu_usage_seconds_total[1m]), "mode", "-")'
    should_fail: true
  # The INJECTIVE control for the row above, and the only row in this file
  # that discriminates the failure mode a collision guard over a range
  # window introduces if the plan-shape classifier cannot see through it:
  # the query answers 200 with an EMPTY matrix instead of erroring, which
  # every should_fail row above would happily accept. Here the rewrite
  # copies `mode` into a new label and keeps `mode`, so all nine series
  # survive and reference returns every point. It carries the same pinned
  # window as the rows it controls: an empty-versus-empty comparison would
  # match whatever the guard did, which is the one thing this row exists to
  # rule out.
  - query: 'label_replace(rate(demo_cpu_usage_seconds_total[1m]), "core", "$1", "mode", "(.*)")'
