  # Native histograms. `demo_latency_exp_hist` is an OTel exponential
  # histogram in ClickHouse and a Prometheus native histogram on the
  # reference (cmd/seed/main.go seeds the first, cmd/seed/prom_remote.go
  # mirrors the second). Scale 0 puts the bucket boundaries on exact
  # powers of two; the two seeded instances carry different positive
  # offsets and different bucket shapes, so a series mix-up cannot pass.
  #
  # Float-only functions accept native histograms but drop those samples.
  - query: 'abs(demo_latency_exp_hist)'
  # Value functions: Count / Sum / Sum÷Count, then the bucket-midpoint
  # variance estimate (geometric midpoints for standard exponential
  # buckets) in both its stddev and stdvar spellings.
  - query: 'histogram_count(demo_latency_exp_hist)'
  - query: 'histogram_sum(demo_latency_exp_hist)'
  - query: 'histogram_avg(demo_latency_exp_hist)'
  - query: 'histogram_stddev(demo_latency_exp_hist)'
  - query: 'histogram_stdvar(demo_latency_exp_hist)'
  # Rank walk with both bounds strictly interior to a populated bucket, so
  # the case discriminates the in-bucket exponential interpolation rather
  # than only the whole-bucket sums a boundary-aligned pair would reach.
  - query: 'histogram_fraction(3, 12, demo_latency_exp_hist)'
  # Quantile interpolation across the distribution: phi = 0 (the lower edge
  # of the lowest populated bucket, taken without interpolating — 1 for the
  # offset-0 instance and 2 for the offset-1 one, so the two disagree and a
  # constant answer for either cannot pass), a low phi that lands exactly on
  # a bucket edge for one instance and inside a bucket for the other, one in
  # a middle bucket, one in the top bucket, and phi = 1 (the upper edge of
  # the highest populated bucket, likewise uninterpolated).
  - query: 'histogram_quantile(0, demo_latency_exp_hist)'
  - query: 'histogram_quantile(0.1, demo_latency_exp_hist)'
  - query: 'histogram_quantile(0.5, demo_latency_exp_hist)'
  - query: 'histogram_quantile(0.9, demo_latency_exp_hist)'
  - query: 'histogram_quantile(1, demo_latency_exp_hist)'
  # Same walk under a label matcher: one series, one known bucket layout,
  # so the result pins that instance's offset rather than either instance's.
  - query: 'histogram_quantile(0.9, demo_latency_exp_hist{instance="demo.promlabs.com:10000"})'
  # demo_shifting_latency_exp_hist: the aggregated range-vector shape
  # `histogram_quantile(phi, sum(rate(<exp_hist>[w])))`. demo_latency_exp_hist
  # above holds its bucket shape fixed and only scales it, so the correct
  # two-stage lowering (per-series rate, then merge) and a flat single-stage
  # fold that sums every in-window sample's raw cumulative counts differ
  # there by a positive scalar only — histogram_quantile reads bucket
  # RATIOS, so the two lowerings are indistinguishable and the harness would
  # score green through the bug. demo_shifting_latency_exp_hist's shape
  # moves across the window instead, so the two lowerings land in different
  # buckets (~4.2x apart at the tester's instant-query eval point; see
  # cmd/seed/main.go for the worked geometry). [1m] excludes the sparse
  # third instance (:10002, written every 90s, never twice inside a 60s
  # window, so rate() must drop it); [5m] always admits it, which drags the
  # merged native-histogram schema from 0 to -1 and is how a wrong
  # two-sample floor shows up in the quantile rather than only in a series
  # count.
  - query: 'histogram_quantile(0, sum(rate(demo_shifting_latency_exp_hist[1m])))'
  - query: 'histogram_quantile(0.1, sum(rate(demo_shifting_latency_exp_hist[1m])))'
  - query: 'histogram_quantile(0.5, sum(rate(demo_shifting_latency_exp_hist[1m])))'
  - query: 'histogram_quantile(0.9, sum(rate(demo_shifting_latency_exp_hist[1m])))'
  - query: 'histogram_quantile(1, sum(rate(demo_shifting_latency_exp_hist[1m])))'
  - query: 'histogram_quantile(0, sum(rate(demo_shifting_latency_exp_hist[5m])))'
  - query: 'histogram_quantile(0.1, sum(rate(demo_shifting_latency_exp_hist[5m])))'
  - query: 'histogram_quantile(0.5, sum(rate(demo_shifting_latency_exp_hist[5m])))'
  - query: 'histogram_quantile(0.9, sum(rate(demo_shifting_latency_exp_hist[5m])))'
  - query: 'histogram_quantile(1, sum(rate(demo_shifting_latency_exp_hist[5m])))'
  # Per-series (ungrouped) form, mirroring the classic-histogram case above
  # (`histogram_quantile({{.quantile}}, rate(demo_api_request_duration_seconds_bucket[1m]))`):
  # no cross-series merge, so this pins the per-series rate/delta step alone.
  - query: 'histogram_quantile({{.quantile}}, rate(demo_shifting_latency_exp_hist[1m]))'
    variant_args: ['quantile']
  # Histogram-VALUED results. Every exp-histogram case above reduces its
  # histogram to a float before the comparison — a count, a sum, a
  # quantile — so none of them can see the histogram SAMPLE itself. The
  # shapes below answer WITH one: a bare selector, sum() / avg() over
  # one, and rate() / increase() over one each return a native histogram,
  # which crosses the wire as the `histograms` array rather than a
  # `values` float. The upstream comparer deep-diffs the decoded
  # model.Value, so SampleStream.Histograms is compared per sample down
  # to every bucket's boundary rule, lower edge, upper edge and count —
  # it never names histograms, it just never collapses the value.
  #
  # This is the only layer that can see a bucket LAYOUT error. A wrong
  # scale, an off-by-one offset, a bucket emitted where the reference
  # omits it, or a merge that lands the right total in the wrong bucket
  # all preserve the count, the sum, and often the quantile, so every
  # case above scores green through them.
  #
  # The zero bucket is out of reach here, and that is a property of the
  # OTel-CH schema rather than a gap in the corpus: the default physical
  # schema has no ZeroThreshold column (internal/schema/otel.go — real
  # OTel-CH tables do not carry the OTLP zero_threshold field, and every
  # emitter guards on the column being named), while the reference
  # receives these fixtures over remote-write with the OTLP translator's
  # own default threshold (cmd/seed/prom_remote.go). Both fixtures seed
  # ZeroCount = 0, and an empty bucket is never appended on either side
  # — internal/api/prom/histogram.go mirrors upstream's own
  # `if bucket.Count == 0 { continue }` — so no sample exists on which
  # the two renderings of an empty zero band could differ.
  #
  # demo_latency_exp_hist carries the instant shapes: its two instances
  # sit at different positive offsets with different bucket arrays, so a
  # merge that drops or misplaces either one cannot answer correctly.
  - query: 'demo_latency_exp_hist'
  # One instance alone, so the answer pins that instance's own offset
  # and array rather than either instance's or their union.
  - query: 'demo_latency_exp_hist{instance="demo.promlabs.com:10001"}'
  # The offset carrier over a histogram-valued selector: same buckets,
  # evaluated an earlier step, so a lookup that ignored the offset
  # returns buckets scaled by the wrong (step + 1) multiplier.
  - query: 'demo_latency_exp_hist offset 5m'
  # Cross-series bucket merge: the two instances have DIFFERENT bucket
  # layouts, so the sum is element-wise addition over a union of bucket
  # indices rather than a component-wise add of two aligned arrays.
  - query: 'sum(demo_latency_exp_hist)'
  # The same aggregation grouped so that each group holds exactly one
  # series — no merge happens, which pins that the merge above is driven
  # by the grouping and not applied unconditionally.
  - query: 'sum by (instance) (demo_latency_exp_hist)'
  # avg() is the merge above followed by a division of every bucket
  # count, the sum and the count by the group size, so it discriminates
  # a sum() that forgot to divide and a division applied to the totals
  # but not to the buckets.
  - query: 'avg(demo_latency_exp_hist)'
  - query: 'avg by (instance) (demo_latency_exp_hist)'
  # Cross-SCALE merge. demo_shifting_latency_exp_hist's third instance
  # is seeded at scale -1 against the other two at scale 0, so summing
  # the three coarsens the merged histogram's schema and folds bucket
  # pairs from the finer instances into single buckets of the coarser
  # one. No other histogram-valued shape reaches that path: the
  # aggregated range-vector form that would (`sum(rate(...))`) is still
  # rejected, and the quantile cases above read the coarsened result as
  # a ratio rather than as buckets.
  - query: 'sum(demo_shifting_latency_exp_hist)'
  # rate() / increase() over a native histogram: Prometheus's
  # extrapolatedRate applied to every bucket count as well as to the
  # count and the sum, yielding fractional counts (a FloatHistogram on
  # the reference). demo_shifting_latency_exp_hist's shape MOVES across
  # the window, so a lowering that folded raw cumulative counts instead
  # of taking a per-series rate lands in different buckets rather than
  # differing by a positive scalar the way it would over
  # demo_latency_exp_hist. [1m] excludes the sparse third instance;
  # [5m] admits it and drags the schema to -1, so the pair pins the
  # two-sample floor and the coarsening in the buckets themselves.
  - query: 'rate(demo_shifting_latency_exp_hist[1m])'
  - query: 'rate(demo_shifting_latency_exp_hist[5m])'
  - query: 'increase(demo_shifting_latency_exp_hist[1m])'
  - query: 'increase(demo_shifting_latency_exp_hist[5m])'
  # delta() uses the same boundary extrapolation over gauge histograms,
  # while irate()/idelta() select only the last two samples. The moving
  # shape and cross-scale third instance make endpoint selection, reset
  # handling and schema reconciliation visible in the histogram payload.
  - query: 'delta(demo_shifting_latency_exp_hist[1m])'
  - query: 'delta(demo_shifting_latency_exp_hist[5m])'
  - query: 'irate(demo_shifting_latency_exp_hist[1m])'
  - query: 'irate(demo_shifting_latency_exp_hist[5m])'
  - query: 'idelta(demo_shifting_latency_exp_hist[1m])'
  - query: 'idelta(demo_shifting_latency_exp_hist[5m])'
  # The FLOAT-valued reductions over a native histogram: reference's
  # funcResets, funcChanges and the `count` aggregation all publish a
  # plain sample rather than a distribution, so unlike every case above
  # these compare as ordinary floats.
  #
  # resets() and changes() ask DIFFERENT questions of the same samples —
  # DetectReset is a directional regression test, Equals is structural
  # whole-row equality — so a lowering that answered one with the other's
  # kernel diverges here rather than agreeing by symmetry. Both fixtures
  # are carried: demo_latency_exp_hist grows monotonically (so resets is
  # 0 and changes is not, which is exactly the pair that catches the two
  # kernels being swapped), while demo_shifting_latency_exp_hist's shape
  # MOVES across the window and its third instance sits at a different
  # scale, which is what exercises the bucket-regression and
  # resolution-change conditions rather than the Count one alone.
  - query: 'resets(demo_latency_exp_hist[5m])'
  - query: 'changes(demo_latency_exp_hist[5m])'
  - query: 'resets(demo_shifting_latency_exp_hist[1m])'
  - query: 'resets(demo_shifting_latency_exp_hist[5m])'
  - query: 'changes(demo_shifting_latency_exp_hist[1m])'
  - query: 'changes(demo_shifting_latency_exp_hist[5m])'
  # count() over native-histogram series. Reference's aggregation switch
  # increments groupCount with no guard on the sample's value, so this
  # counts the series and never reads a bucket — which is what separates
  # it from the min/max/stddev/stdvar/quantile family that DROPS a
  # histogram sample. The grouped form pins that the per-series collapse
  # happens before the count: demo_latency_exp_hist's instances each
  # carry many samples in the lookback, so a count over the stored rows
  # rather than over the instant vector reports the scrape count.
  - query: 'count(demo_latency_exp_hist)'
  - query: 'count by (instance) (demo_latency_exp_hist)'
  - query: 'count(demo_shifting_latency_exp_hist)'
  # Histogram-dropping aggregations. Reference accepts each histogram-only
  # input and omits every native-histogram sample, producing an empty range
  # vector with an informational annotation. The mixed probes then prove the
  # same filtering happens before grouping/ranking: only the float family may
  # contribute a result.
  - query: 'min(demo_latency_exp_hist)'
  - query: 'max(demo_latency_exp_hist)'
  - query: 'stddev(demo_latency_exp_hist)'
  - query: 'stdvar(demo_latency_exp_hist)'
  - query: 'quantile(0.9, demo_latency_exp_hist)'
  - query: 'topk(3, demo_latency_exp_hist)'
  - query: 'bottomk(3, demo_latency_exp_hist)'
  - query: 'min by (job) ({__name__=~"demo_memory_usage_bytes|demo_latency_exp_hist"})'
  - query: 'topk(2, {__name__=~"demo_memory_usage_bytes|demo_latency_exp_hist"})'
  # Presence-only range function over a native histogram. The fixture is
  # populated throughout the evaluation window, so reference Prometheus
  # emits no absence row; before #2226 cerberus rejected this query while
  # routing the selector through the nonexistent float Value column.
  - query: 'absent_over_time(demo_latency_exp_hist[5m])'
  # Float inputs: the native-histogram value functions skip float samples
  # rather than erroring, so a float family and an absent family both
  # answer the empty vector on both backends. These pin that acceptance,
  # not the histogram math — the cases above own the math.
  - query: 'histogram_count(demo_memory_usage_bytes)'
  - query: 'histogram_sum(demo_memory_usage_bytes)'
  - query: 'histogram_avg(nonexistent_metric_name)'
  - query: 'histogram_stddev(demo_memory_usage_bytes)'
  - query: 'histogram_fraction(0.2, 0.8, demo_memory_usage_bytes)'
  # Subquery-argument range functions (rejection-parity, 2026-08).
  # absent_over_time and the four ts_of_*_over_time reducers took a
  # matrix selector only; each 422'd on a subquery argument while
  # reference Prometheus answered it.
  - query: 'absent_over_time(nonexistent_metric_name[5m:1m])'
  - query: 'absent_over_time(demo_memory_usage_bytes[5m:1m])'
  - query: 'absent_over_time(rate(demo_cpu_usage_seconds_total[5m])[10m:1m])'
  - query: 'ts_of_first_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'ts_of_last_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'ts_of_max_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'ts_of_min_over_time(demo_memory_usage_bytes[10m:1m])'
  # Instant-vector transforms in subquery-inner position. Sorting is
  # identity on the sample set once the anchor's result folds into the
  # matrix; the date components and the native-histogram accessors are
  # per-sample value maps.
  - query: 'max_over_time(sort(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(sort_desc(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(sort_by_label(demo_memory_usage_bytes, "instance")[5m:1m])'
  - query: 'max_over_time(sort_by_label_desc(demo_memory_usage_bytes, "instance")[5m:1m])'
  - query: 'max_over_time(hour(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(day_of_week(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(timestamp(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(histogram_count(demo_latency_exp_hist)[5m:1m])'
  - query: 'max_over_time(histogram_sum(demo_latency_exp_hist)[5m:1m])'
  - query: 'max_over_time(histogram_avg(demo_latency_exp_hist)[5m:1m])'
  # Computed K for topk / bottomk: any scalar-valued expression, not
  # just a bare `scalar(<vector>)`. demo_num_cpus is constant per the
  # seed, so the per-statement binding agrees with reference's per-step
  # evaluation at every step. limitk is deliberately absent — its K
  # survivors are arbitrary, so a differential comparison is meaningless.
  - query: 'topk(scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}) * 2, demo_memory_usage_bytes)'
  - query: 'topk(2 + scalar(vector(1)), demo_memory_usage_bytes)'
  - query: 'bottomk(scalar(vector(2)) + 1, demo_memory_usage_bytes)'
  - query: 'topk((scalar(vector(4)) + 2) / 2, demo_memory_usage_bytes)'
  - query: 'max_over_time(topk(scalar(vector(2)), demo_memory_usage_bytes)[5m:1m])'
  # String- and matrix-typed top-level expressions: the compliance
  # tester drives /api/v1/query_range, where BOTH backends reject
  # non-Scalar/Vector expression types — pinning cerberus's new
  # upstream-shaped type gate.
  - query: '"a string literal"'
    should_fail: true
  - query: 'demo_memory_usage_bytes[5m]'
    should_fail: true
