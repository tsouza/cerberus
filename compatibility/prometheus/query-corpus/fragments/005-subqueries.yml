
  # Subqueries.
  - query: 'max_over_time((time() - max(demo_batch_last_success_timestamp_seconds) < 1000)[5m:10s] offset 5m)'
  - query: 'avg_over_time(rate(demo_cpu_usage_seconds_total[1m])[2m:10s])'
  # #2053: min/max/count_over_time use the direct aggregate path. rate and
  # increase make the inner subquery extrapolating; offset also keeps the
  # grid/window carrier in the exercised shape.
  - query: 'max_over_time(rate(demo_cpu_usage_seconds_total[1m])[5m:30s])'
  - query: 'min_over_time(increase(demo_cpu_usage_seconds_total[1m])[5m:30s])'
  - query: 'count_over_time(rate(demo_cpu_usage_seconds_total[1m])[5m:30s] offset 2m)'

  # Vector-vector binary op over range-vector (rate) operands. Before
  # the vector-join MetricName/TimeUnix fix these produced ClickHouse
  # code 47 (Unknown expression identifier '_join_MetricName' /
  # 'TimeUnix') because an instant range-vector operand's RangeWindow
  # subquery projects neither MetricName nor TimeUnix, yet the join side
  # read both. The first is the minimal repro; the last mirrors the
  # production Grafana query shape (topk over sum-by over rate+rate).
  - query: 'rate(demo_cpu_usage_seconds_total[1m]) + rate(demo_cpu_usage_seconds_total[1m])'
  - query: 'rate(demo_cpu_usage_seconds_total[1m]) / rate(demo_cpu_usage_seconds_total[1m])'
  - query: 'topk(10, sum by(instance) (rate(demo_cpu_usage_seconds_total[1m]) + rate(demo_http_requests_total[1m])))'

  # Range-mode matrix offset (output-timestamp labeling).
  #
  # PromQL `offset` shifts only WHICH samples are read; the result is
  # reported at the UNSHIFTED eval time t (the request grid), never at
  # t-offset. In matrix mode the range_window emitter must therefore
  # emit the output timestamp from the unshifted grid anchor while the
  # internal window/rate math still runs against the offset-shifted
  # base. A regression that stamps the output at t-offset lands every
  # sample one offset early.
  #
  # The bare-selector offset path (RangeLWR — see the two
  # `demo_memory_usage_bytes offset {{.offset}}` cases above) was
  # already correct, so nothing here previously drove RANGE-mode matrix
  # offset differentially against reference Prometheus: single-arm
  # parity hid it because both the reference and cerberus arms would
  # have had to disagree, and only a JOIN across a shifted and an
  # unshifted arm surfaces the mislabel. These cases pin the labeling
  # for the extrapolated-rate family (delta/rate/increase), the
  # instant-rate family (idelta/irate), and the `_over_time` reducers,
  # each over a matrix range with a positive offset (kept inside the 1h
  # seed window so the comparison is over non-empty matrices at every
  # step) and a negative (future-facing) offset.
  - query: '{{.extrapolatedRateFunc}}(demo_cpu_usage_seconds_total[{{.range}}] offset {{.offset}})'
    variant_args: ['extrapolatedRateFunc', 'range', 'offset']
  - query: '{{.extrapolatedRateFunc}}(demo_cpu_usage_seconds_total[5m] offset -{{.offset}})'
    variant_args: ['extrapolatedRateFunc', 'offset']
  - query: '{{.instantRateFunc}}(demo_cpu_usage_seconds_total[5m] offset {{.offset}})'
    variant_args: ['instantRateFunc', 'offset']
  - query: '{{.simpleTimeAggrOp}}_over_time(demo_memory_usage_bytes[5m] offset {{.offset}})'
    variant_args: ['simpleTimeAggrOp', 'offset']
  - query: '{{.simpleTimeAggrOp}}_over_time(demo_memory_usage_bytes[5m] offset -{{.offset}})'
    variant_args: ['simpleTimeAggrOp', 'offset']

  # Wrong-rejection burndown (rejection-parity catalogue, 2026-06):
  # value-level coverage for every shape cerberus newly accepts. Each
  # entry below 422'd on cerberus before the burndown while reference
  # Prometheus answered it.
  # atan2 binary operator.
  - query: 'demo_memory_usage_bytes atan2 demo_memory_usage_bytes'
  - query: 'demo_memory_usage_bytes atan2 2'
  - query: '2 atan2 demo_memory_usage_bytes'
  # topk/bottomk K domain (K < 1 → empty result; fractional truncates).
  - query: 'topk(0, demo_memory_usage_bytes)'
  - query: 'topk(1.5, demo_memory_usage_bytes)'
  - query: 'bottomk(0.5, demo_memory_usage_bytes)'
  # absent() over arbitrary expressions.
  - query: 'absent(sum(demo_memory_usage_bytes))'
  - query: 'absent(sum(nonexistent_metric_name))'
  - query: 'absent(demo_memory_usage_bytes + demo_memory_usage_bytes)'
  # histogram_quantile over a non-bucket input (reference skips float
  # samples without `le` → empty).
  - query: 'histogram_quantile(0.9, sum(demo_memory_usage_bytes))'
  # Computed scalar() arguments. demo_num_cpus is constant per the
  # seed, so the per-statement scalar binding agrees with reference's
  # per-step evaluation at every step.
  - query: 'clamp_min(demo_memory_usage_bytes, scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}))'
  - query: 'clamp_max(demo_memory_usage_bytes, scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}))'
  - query: 'clamp(demo_memory_usage_bytes, scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}), 1000000000000)'
  - query: 'round(demo_memory_usage_bytes, scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}))'
  - query: 'quantile(scalar(vector(0.5)), demo_memory_usage_bytes)'
  - query: 'histogram_quantile(scalar(vector(0.9)), rate(demo_api_request_duration_seconds_bucket[1m]))'
  - query: 'predict_linear(demo_disk_usage_bytes[5m], scalar(vector(3600)))'
  - query: 'quantile_over_time(scalar(vector(0.5)), demo_memory_usage_bytes[5m])'
  - query: 'vector(scalar(demo_num_cpus{instance="demo.promlabs.com:10000"}))'
  # Subqueries over arbitrary expressions.
  - query: 'max_over_time((-demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(sum(demo_memory_usage_bytes + demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(stddev(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(label_replace(demo_memory_usage_bytes, "replaced", "$1", "instance", "(.*)")[5m:1m])'
  - query: 'max_over_time(absent(nonexistent_metric_name)[5m:1m])'
  - query: 'max_over_time(absent(demo_memory_usage_bytes)[5m:1m])'
  - query: 'max_over_time(quantile(scalar(vector(0.5)), demo_memory_usage_bytes)[5m:1m])'
  # irate / idelta family over subqueries.
  - query: 'irate(demo_cpu_usage_seconds_total[5m:1m])'
  - query: 'max_over_time(irate(demo_cpu_usage_seconds_total[5m:1m])[10m:1m])'
  # `__name__` over subqueries. last_over_time / first_over_time are the two
  # range functions Prometheus does NOT strip `__name__` from, and the name
  # is resolved per input series rather than from the query text — so each
  # of these differs from the max_over_time cases above in the LABELS the
  # comparison sees, not just the values.
  - query: 'last_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'first_over_time(demo_memory_usage_bytes[10m:1m])'
  - query: 'last_over_time({__name__=~"demo_memory_usage_bytes|demo_disk_usage_bytes"}[10m:1m])'
  - query: 'last_over_time(demo_memory_usage_bytes[10m:1m] @ start())'
  - query: 'last_over_time(last_over_time(demo_memory_usage_bytes[5m])[10m:1m])'
  # rate() has already stripped `__name__`, so a preserving outer function
  # must not resurrect it.
  - query: 'last_over_time(rate(demo_cpu_usage_seconds_total[5m])[10m:1m])'
  # Set-operator subquery inner. `or` / `and` / `unless` forward each
  # surviving series' own label set unchanged — unlike arithmetic and
  # comparison-with-`bool`, they do not drop the name — so the name has to
  # survive both the set operation's projection and the outer reducer.
  # The two families carry different label shapes (`type` vs `device`), so
  # every series of both arms survives the match and the comparison sees
  # sixteen distinct label sets rather than a merged handful.
  - query: 'last_over_time((demo_memory_usage_bytes or demo_disk_usage_bytes)[10m:1m])'
  # Dropping `__name__` off a selector that spans two families sharing one
  # label shape collapses them onto the same label set, which upstream
  # refuses ("vector cannot contain metrics with the same labelset") rather
  # than merging. demo_memory_usage_bytes and demo_sparse_memory_bytes are
  # seeded on an identical {instance, job, type} shape for exactly this, and
  # the sparse family covers the first quarter of the window, so the early
  # steps of the range put both families in the same 5m window.
  - query: 'rate({__name__=~"demo_memory_usage_bytes|demo_sparse_memory_bytes"}[5m])'
    should_fail: true
  # The other side of that boundary: the same name-dropping shape over
  # families whose label shapes DIFFER stays a legal query on both
  # backends, so the rejection above cannot pass by rejecting the class.
  - query: 'rate({__name__=~"demo_memory_usage_bytes|demo_disk_usage_bytes"}[5m])'
