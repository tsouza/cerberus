# yaml-language-server: $schema=../../upstream/loki-bench/queries/schema.json
---
# `| unpack` differential coverage — see issue #1611. Before this file
# the vendored corpus never queried `| unpack` at all (zero hits
# outside its LICENSE text) and the seeder never emitted a
# Promtail-pack-shaped payload for it to run against, so the stage
# shipped guarded only by cerberus's own unit tests reading upstream's
# source rather than a real differential run — exactly the gap #1447
# (the then-Go-side unpack step silently swallowing the `__error__` /
# `__error_details__` labels a malformed payload should carry) shipped
# through.
#
# Every query below targets `{service_name="packed-source"}`, the one
# seeded stream (compatibility/loki/cmd/seed/main.go's
# generatePackedLine) whose lines cycle through the four payload
# shapes `| unpack` must discriminate: a well-formed packed object
# (top-level string "_entry" key), a well-formed object with no
# "_entry" key, a non-object JSON value, and malformed JSON.
#
# Running this corpus for the first time surfaced a SECOND, distinct
# bug beyond #1447: `| __error__="..."` following `| unpack` was
# silently a no-op end-to-end (see internal/logql/lower.go's
# dynamicLabels gate and internal/api/loki/post_process.go's
# newLabelFilterStep for the fix) — the two `kind: log` cases below
# cover it.
#
# The `kind: metric` case groups by `category`, a label that exists only
# on the packed payloads `| unpack` successfully opens. It is the arm
# that pins the extraction in SQL rather than in Go: a metric query
# aggregates inside ClickHouse and never reaches a per-row Go pass, so
# `sum by (category)` returns the packed categories only when the label
# map the GROUP BY reads was built by the lowering itself. Where the log
# arms would still pass with the labels reconstructed after the rows
# return, this one cannot.
queries:
  - description: unpack happy path - only successfully unpacked lines
    query: '{service_name="packed-source"} | unpack | __error__=""'
    kind: log
    time_range:
      length: 24h
    directions: both
    tags:
      - unpack
      - happy-path

  - description: unpack error path - only lines unpack rejected
    query: '{service_name="packed-source"} | unpack | __error__="JSONParserErr"'
    kind: log
    time_range:
      length: 24h
    directions: both
    tags:
      - unpack
      - error-path

  - description: metric query grouped by an unpack-extracted label
    query: sum by (category) (count_over_time({service_name="packed-source"} | unpack | __error__="" [24h]))
    kind: metric
    time_range:
      length: 24h
      step: 1h
    tags:
      - unpack
      - metric
      - grouping
