{{- if and .Values.clickhouse.bundled.enabled (eq (include "cerberus.clickhouse.createInterserverSecret" .) "true") }}
{{- /* Chart-managed Secret for the cross-node inter-server key (cerberus
       issue #3190). Rendered ONLY for the inline `interserverSecret` route;
       `interserverExistingSecret` names the operator's own Secret and this
       template stays silent. It is a Secret rather than a ConfigMap entry
       because `remote_servers` reads it through `from_env`, exactly as the
       ClickHouse user password already does. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerberus.clickhouse.interserverSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cerberus.clickhouse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.clickhouse.bundled.interserverSecretKey }}: {{ .Values.clickhouse.bundled.interserverSecret | quote }}
{{- end }}
