# ct / helm-template fixture: split topology — three isolated per-head
# Deployments + three bare-named ClusterIP Services (prometheus / loki / tempo),
# each process pinned to one head via CERBERUS_ENABLED_HEADS. Exercises the
# per-head resources / replicaCount / maxSamples / timeout overrides: Tempo gets
# fat memory, a tight /api/search sample cap and the long wall-clock budget its
# two-phase search needs, while Prom and Loki stay lean and shed early. This is
# the blast-radius-isolation topology — one head OOMing no longer severs the
# others, since they no longer share a process/cgroup.
mode: split

clickhouse:
  addr:
    - clickhouse:9000
  database: otel
  username: default

autoCreate:
  schema: false
  database: false

otlp:
  endpoint: ""

# Top-level budget every head inherits unless it overrides — the Prometheus and
# Tempo blocks below take both branches of that resolution.
query:
  timeout: 2m

split:
  prometheus:
    replicaCount: 2
    timeout: 30s
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        memory: 1Gi
  loki:
    replicaCount: 2
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        memory: 1Gi
  tempo:
    replicaCount: 1
    maxSamples: 2000000
    timeout: 5m
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 4Gi
