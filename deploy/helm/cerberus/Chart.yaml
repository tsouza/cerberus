apiVersion: v2
name: cerberus
description: Drop-in Prometheus / Loki / Tempo HTTP gateway for ClickHouse — a single stateless gateway that speaks three upstream query wire formats and lowers each to parameterised ClickHouse SQL.
type: application

# version is the chart's OWN SemVer line, versioned INDEPENDENTLY of the app
# (appVersion). It answers "will my existing values.yaml survive a helm
# upgrade?" and is the publish trigger: a chart-only fix bumps this without an
# app re-tag; an app-only release bumps appVersion + a PATCH here for the new
# default image. Starts 0.x because the values contract is not yet frozen.
version: 0.17.1

# appVersion tracks the GA cerberus binary. Quoted so SemVer-shaped values
# aren't coerced to floats. image.tag defaults from this when left empty.
appVersion: "1.22.0"

# autoscaling/v2 + policy/v1 (PDB) + networking/v1 (Ingress) are all GA from
# 1.21+; 1.23 is the conservative floor matching the manifests this chart
# mirrors. The -0 suffix makes pre-release kubeVersions (e.g. EKS 1.23.x-eks)
# compare correctly.
kubeVersion: ">=1.23.0-0"

home: https://github.com/tsouza/cerberus
sources:
  - https://github.com/tsouza/cerberus
maintainers:
  - name: tsouza
    url: https://github.com/tsouza
keywords:
  - prometheus
  - loki
  - tempo
  - clickhouse
  - observability
  - promql
  - logql
  - traceql
  - gateway
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/tsouza/cerberus
    - name: documentation
      url: https://github.com/tsouza/cerberus/blob/main/docs/operations.md
  artifacthub.io/images: |
    - name: cerberus
      image: ghcr.io/tsouza/cerberus:v1.22.0
  artifacthub.io/changes: |
    - kind: added
      description: "observability: reconcile query actuals across rotated and replica query logs (#3670)"
    - kind: added
      description: "telemetry: add metrics endpoint and signal controls (#3623)"
    - kind: fixed
      description: "promql: re-lower a computed phi when the native bucket-rates path takes over (#3755)"
    - kind: fixed
      description: "promql: key a classic histogram_quantile's computed phi on the row it lands in (#3753)"
    - kind: fixed
      description: "chserver: widen cancellation calibration margin under CPU contention (#3748)"
    - kind: fixed
      description: "testsql: exclude lambda parameters from fanout self-sufficiency check (#3734)"
    - kind: fixed
      description: "chsql: hoist large repeated subplans into CTEs to shrink SQL (#3744)"
    - kind: fixed
      description: "chsql: resolve matchesEmpty name collision breaking main's build (#3742)"
    - kind: fixed
      description: "chserver: measure siblings' real time-to-call instead of extrapolating (#3738)"
    - kind: fixed
      description: "query: read invalid UTF-8 in emitted regex shapes as Go's regexp does (#3705)"
