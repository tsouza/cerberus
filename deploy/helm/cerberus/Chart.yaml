apiVersion: v2
name: cerberus
description: Drop-in Prometheus / Loki / Tempo HTTP gateway for ClickHouse — a single stateless gateway that speaks three upstream query wire formats and lowers each to parameterised ClickHouse SQL.
type: application

# version is the chart's OWN SemVer line, versioned INDEPENDENTLY of the app
# (appVersion). It answers "will my existing values.yaml survive a helm
# upgrade?" and is the publish trigger: a chart-only fix bumps this without an
# app re-tag; an app-only release bumps appVersion + a PATCH here for the new
# default image. Starts 0.x because the values contract is not yet frozen.
version: 0.15.10

# appVersion tracks the GA cerberus binary. Quoted so SemVer-shaped values
# aren't coerced to floats. image.tag defaults from this when left empty.
appVersion: "1.19.0"

# autoscaling/v2 + policy/v1 (PDB) + networking/v1 (Ingress) are all GA from
# 1.21+; 1.23 is the conservative floor matching the manifests this chart
# mirrors. The -0 suffix makes pre-release kubeVersions (e.g. EKS 1.23.x-eks)
# compare correctly.
kubeVersion: ">=1.23.0-0"

home: https://github.com/tsouza/cerberus
sources:
  - https://github.com/tsouza/cerberus
maintainers:
  - name: tsouza
    url: https://github.com/tsouza
keywords:
  - prometheus
  - loki
  - tempo
  - clickhouse
  - observability
  - promql
  - logql
  - traceql
  - gateway
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/tsouza/cerberus
    - name: documentation
      url: https://github.com/tsouza/cerberus/blob/main/docs/operations.md
  artifacthub.io/images: |
    - name: cerberus
      image: ghcr.io/tsouza/cerberus:v1.19.0
  # Bump the `1.0.0` floor here when the chart raises its minimum supported
  # cerberus release; informational for Artifact Hub's compatibility hints.
  artifacthub.io/changes: |
    - kind: fixed
      description: "ci: partition internal/promql's unsharded test suite across roundtrip-promql-shard legs (#2738)"
    - kind: fixed
      description: "ci: relieve roundtrip-promql-shard's CPU contention and timeout budget"
    - kind: fixed
      description: "chsql: bound emitted SQL at ClickHouse's own max_query_size (#2734)"
    - kind: fixed
      description: "promql: answer an outer range fn over the doubly-nested subquery composition (#2732)"
    - kind: fixed
      description: "promql: thread histogram/mixed shape through doubly-nested subquery composition (#2727)"
    - kind: fixed
      description: "promql: close further and/unless/or wrapping a mixed-or subquery (#2724) (#2725)"
    - kind: fixed
      description: "promql: close remaining sum/avg-wrapped mixed-or subquery gaps (#2714, #2715) (#2723)"
