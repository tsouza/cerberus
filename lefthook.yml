# Lefthook config. Three stages, all of them cheap:
#
#   pre-commit — fast formatters on staged files only (sub-second).
#   commit-msg — commitlint on the message being written.
#   pre-push   — Node-based discipline scans plus actionlint, run in
#                parallel: about a second of wall-clock on an idle host
#                (actionlint is the longest single command at ~1 s; the
#                whole set is ~5 s under a heavily loaded host).
#
# Every command here is one a developer cannot get from CI in time to
# act on it, and cheap enough that paying for it on every push is
# invisible. Anything that compiles Go, walks the whole tree, or needs a
# container belongs to CI: CI runs it once, authoritatively, on the
# commit that will actually merge. A local run of the same thing is a
# second, slower, less trustworthy copy — see the golangci-lint note
# under "Intentionally NOT in any hook".
#
# Install: `just hooks-install` (one-shot; installs the lefthook
# binary via `go install` and activates the git hooks). See also
# CLAUDE.md § "No local validation; lefthook + CI own it."
#
# Escape hatch for WIP pushes: `LEFTHOOK=0 git push` skips all hooks.

pre-commit:
  parallel: true
  commands:
    gofumpt:
      # `-extra` matches `.golangci.yml`'s `gofumpt.extra-rules: true`, which
      # the required `lint` gate applies. Without the flag this hook reports
      # success over a file CI then rejects — the worst kind of formatter.
      glob: "*.go"
      stage_fixed: true
      run: |
        gofumpt -extra -w {staged_files}
    goimports:
      # `-local` matches `.golangci.yml`'s `goimports.local-prefixes`, so
      # cerberus's own imports group separately here exactly as the `lint` gate
      # requires. Same reason as the `-extra` above.
      glob: "*.go"
      stage_fixed: true
      run: |
        goimports -w -local github.com/tsouza/cerberus {staged_files}
    md-table-align:
      # MD060 (table-column-style: aligned) has no auto-fixer in
      # markdownlint-cli2 — pad cell widths before --fix sees the file.
      glob: "*.md"
      # The chart README is generated by helm-docs (unpadded) and
      # drift-checked byte-for-byte by chart-ci; padding it here would
      # make the committed file diverge from helm-docs' output. Leave it
      # to helm-docs (it carries an inline markdownlint-disable for MD060).
      exclude:
        - "deploy/helm/**/README.md"
      stage_fixed: true
      run: |
        python3 scripts/align-md-tables.py {staged_files}
    markdownlint:
      # Routed through the script rather than calling `markdownlint-cli2`
      # straight off $PATH. A bare call ran whatever version happened to be
      # installed — a THIRD engine, matching neither the Justfile pin nor CI,
      # so the fixer could rewrite a file in ways CI then rejected
      # (tsouza/cerberus#2997). `--staged` still prefers a $PATH binary for
      # speed, but only when its version is exactly the pinned one.
      glob: "*.md"
      stage_fixed: true
      run: |
        node .github/scripts/markdownlint-run.mjs --staged {staged_files}

# pre-push runs once per `git push`. It carries the forbid-skip and
# repo-hygiene gates — Node scans of a few hundred milliseconds each — and
# actionlint; in parallel the set finishes in about a second on an idle
# host. Set `LEFTHOOK=0` to bypass for WIP pushes.
pre-push:
  parallel: true
  commands:
    # Workflow-file validation. GitHub rejects invalid workflow files
    # SERVER-side as zero-job "invalid workflow file" failure runs,
    # which silently prevents required pull_request checks from ever
    # being scheduled (the #749 secrets-in-step-if incident left a PR
    # BLOCKED on four required contexts that could never report).
    # actionlint catches expression-context violations, bad action
    # inputs, and shellchecks run blocks before the push leaves the
    # machine. Install via `just install-tools`.
    actionlint:
      tags: lint
      run: |
        just lint-actions
    # Mirrors of the CI `forbid-skip` gate, one command per arm of the
    # CHECKS registry in .github/scripts/forbid-skip.mjs. The hook runs the
    # SAME script CI runs, so there is exactly one copy of every discipline
    # regex; test/regression/lefthook_forbid_skip_mirror_test.go pins that
    # every registry arm is mirrored here and that no hook body re-spells a
    # scan inline. The scans themselves are proved to go red by
    # .github/scripts/forbid-skip.test.mjs (CI).
    forbid-skip-t-skip:
      tags: discipline
      run: node .github/scripts/forbid-skip.mjs
      env:
        CHECK: t-skip
    forbid-skip-playwright:
      tags: discipline
      run: node .github/scripts/forbid-skip.mjs
      env:
        CHECK: playwright-skip
    forbid-skip-soft-assert:
      tags: discipline
      run: node .github/scripts/forbid-skip.mjs
      env:
        CHECK: soft-assert
    forbid-skip-should-skip:
      tags: discipline
      run: node .github/scripts/forbid-skip.mjs
      env:
        CHECK: should-skip
    forbid-skip-escape-hatch:
      tags: discipline
      run: node .github/scripts/forbid-skip.mjs
      env:
        CHECK: escape-hatch
    forbid-skip-feature-discipline:
      tags: discipline
      run: node .github/scripts/forbid-skip.mjs
      env:
        CHECK: feature-discipline

    # Mirrors the CI typed-chsql-API discipline gate. Scans internal/chsql/
    # (excluding builder.go and test files) for raw SQL token writes:
    # strings.Builder, sb.Write*, writeSQL(. Every such site outside the
    # known-good emit files (emit_node.go + emit.go) must be a typed Frag
    # instead. See CLAUDE.md § "No raw SQL strings" and #1441.
    forbid-sql-raw:
      tags: discipline
      run: node .github/scripts/forbid-sql-raw.mjs
    # Keeps chplan's function vocabulary sealed: call sites use named Fn*
    # constants, never chplan.Fn("raw-spelling") conversions. The resolution
    # boundary is the only deliberate negative-test exception.
    forbid-chplan-fn-literal:
      tags: discipline
      run: node .github/scripts/forbid-chplan-fn-literal.mjs
    # Mirrors the CI gate of the same name: a `-- parity --` fixture must not
    # seed two metric samples at one (series, timestamp) carrying different
    # payloads. A pure-JS walk of the three spec corpora, comparable in cost
    # to the chplan gate above, and it catches the mistake while the fixture
    # is still being written rather than a CI round trip later. See #2905.
    forbid-parity-duplicate-samples:
      tags: discipline
      run: node .github/scripts/forbid-parity-duplicate-samples.mjs
    # Mirrors the CI `repo-hygiene` gate's two checks:
    #   - binary:         rejects committed ELF/Mach-O/PE executables and
    #                     other binary artefacts tracked in git
    #   - root-allowlist: rejects stray files at the repo root that don't
    #                     appear in the allowlist
    # Both are fast (pure-JS, no network, no Go compile) and have caught
    # real pushes (bench-report committed in PR #1613). The self-test
    # that validates the detector logic is CI-only (it needs the git
    # history to fabricate fake tracked blobs); the two functional scans
    # run cleanly on a working tree.
    repo-hygiene-binary:
      tags: discipline
      run: node .github/scripts/repo-hygiene.mjs
      env:
        CHECK: binary
    repo-hygiene-root-allowlist:
      tags: discipline
      run: node .github/scripts/repo-hygiene.mjs
      env:
        CHECK: root-allowlist

commit-msg:
  commands:
    commitlint:
      run: |
        npx --no -- commitlint --edit {1}

# Intentionally NOT in any hook:
#
# - `just lint` / golangci-lint. It was the single most expensive thing
#   here at around three minutes per push, and it bought nothing: from a
#   fresh worktree golangci-lint reports "0 issues" without having
#   analysed the tree, so a local green is not evidence and the only
#   authority on lint is CI's own `lint` job. Three minutes for a signal
#   that has to be re-confirmed on CI anyway is worse than no signal,
#   because a wait that long trains everyone to reach for `LEFTHOOK=0`
#   and lose the cheap scans below with it.
#
# - Whole-tree markdownlint. `pre-commit` already runs
#   `markdownlint-cli2 --fix` over the staged `*.md`, so the push-time
#   pass re-linted several dozen files nobody had touched.
#
# - commitlint over the push range. `commit-msg` validates each message
#   as it is written, which is where the author can still fix it. The
#   range form re-judged commits that were already on the remote and
#   rejected the whole push over them — including merge commits, which
#   are not Conventional Commits and are not meant to be. CI's `lint`
#   job keeps the range check for the commits that will merge.
#
# - go test / just test / go build. These need full module state, build
#   tags and a race-enabled toolchain, and are CI-only.
