# N3 — cerberus-side rejection cluster.
# sample_budget / byte_budget / breaker / rejected are the cerberus-side
# terminal outcomes: a request cerberus itself refused, which the query_log can
# never show. They split by WHEN they fire, and the split is what read_rows
# means on the row: the two drain budgets fire AFTER the CH query finished
# cleanly, so their cost columns are real; breaker / rejected fire BEFORE any
# dispatch, so theirs are zero. Either way neither route A nor route B is the
# remedy — a distinct operator signal.
# group_by exit_status separates the sub-causes; the deployment-wide
# rejection share is surfaced as MESSAGE context via {cerberus_reject_ratio}
# (a corpus_count_ratio scalar, never a gate).
rules:
  - id: cerberus_side_rejection_pressure
    severity: high
    since: 2
    status: active
    applies_to: [promql, logql, traceql]
    group_by: [shape_id, language, exit_status]
    min_support:
      ref: min_class_support
    condition:
      all:
        - { col: exit_status, op: in, enum: [sample_budget, byte_budget, breaker, rejected] }
    evidence:
      report: [count, "max(read_rows)"]
    finding: "cerberus-side rejection cluster in {shape_id}/{language} (exit={exit_status}); deployment-wide explicit-rejection share is {cerberus_reject_ratio}. sample_budget -> raise query.max_samples iff CH has headroom, else pre-aggregate; byte_budget -> the drained result is too large in BYTES (wide projections, native-histogram payloads), so narrow the projection or shorten the range; breaker -> investigate upstream CH health; rejected -> re-evaluate the hard cap. Route B never fixes a cerberus-side rejection"
    action: review_rejection_guardrail
