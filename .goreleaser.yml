version: 2

project_name: cerberus

before:
  hooks:
    - go mod tidy

builds:
  - id: cerberus
    main: ./cmd/cerberus
    binary: cerberus
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: cerberus
    ids:
      - cerberus
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# Homebrew cask published to the tsouza/homebrew-tap tap, so operators can
# `brew install tsouza/tap/cerberus`. The tap holds ONE cerberus cask, so only
# stable releases on the newest line write it — see skip_upload below. The
# cross-repo push needs a PAT (the default GITHUB_TOKEN cannot push to another
# repo); it is supplied by the HOMEBREW_TAP_GITHUB_TOKEN secret in release.yml.
#
# A CASK, not a `brews:` formula: a formula describes something Homebrew builds
# from source, while a cask installs a pre-built artifact — which is exactly
# what a release archive is. It is not a macOS-only choice: `supports_linux?`
# holds for any cask that declares no `depends_on macos`, and Homebrew's cask
# installer gates on the CASK's declared OS rather than on the host being a
# Mac, so one cask installs under Linuxbrew and macOS alike.
homebrew_casks:
  - name: cerberus
    ids:
      - cerberus
    # Defaults to the cask name, which is already `cerberus`. Stated because
    # brew-smoke.mjs asserts the installed binary resolves inside the brew
    # prefix — the two have to agree on what gets linked into `bin`.
    binaries:
      - cerberus
    repository:
      owner: tsouza
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # `Casks/` is both goreleaser's default and where Homebrew resolves a tap's
    # casks from. Stated rather than inherited because brew-smoke.mjs pins the
    # same path (`TAP_CASK_PATH`) and a silent drift between the two would make
    # the smoke read a file no release writes.
    directory: Casks
    homepage: "https://github.com/tsouza/cerberus"
    description: "Drop-in Prometheus / Loki / Tempo HTTP gateway for ClickHouse"
    # `auto` on its own only keeps PRERELEASES out of the tap. A stable
    # BACKPORT is not a prerelease, so `auto` alone let v1.12.1 — cut after
    # v1.13.0 — write the tap formula and DOWNGRADE every `brew install` to the
    # older line. Gate on RELEASE_IS_LATEST too (release.yml computes it from
    # the highest stable tag, the same signal the rolling `:latest` images use),
    # so only the newest release line ever owns the cask. `skip_upload` is
    # templated in goreleaser's run phase and read back at publish time.
    skip_upload: '{{ if eq .Env.RELEASE_IS_LATEST "true" }}auto{{ else }}true{{ end }}'
    hooks:
      post:
        # The release binaries are not Apple-signed or notarised, so macOS
        # quarantines them on download and the first run dies with "cerberus is
        # damaged and can't be opened" — a broken install that the tap looks
        # perfectly healthy for. Stripping the quarantine xattr is Homebrew's
        # and goreleaser's documented workaround. Guarded on OS.mac? because
        # there is no such attribute on Linux and `xattr` is not there to run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/cerberus"]
          end

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{.ShortCommit}}"

changelog:
  use: github-native

dockers:
  # Per-arch versioned image. Always pushed regardless of prerelease
  # status. Tagged both `{{ .Version }}` (e.g. `1.0.0-RC1`, the
  # goreleaser convention) and `v{{ .Version }}` (e.g. `v1.0.0-RC1`,
  # the SemVer-with-`v` convention many ops tools default to).
  - id: cerberus-amd64
    image_templates:
      - "ghcr.io/tsouza/cerberus:{{ .Version }}-amd64"
      - "ghcr.io/tsouza/cerberus:v{{ .Version }}-amd64"
      - "docker.io/tsouza/cerberus:{{ .Version }}-amd64"
      - "docker.io/tsouza/cerberus:v{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.description=Drop-in Prometheus / Loki / Tempo HTTP gateway for ClickHouse"
      - "--label=org.opencontainers.image.url=https://github.com/tsouza/cerberus"
      - "--label=org.opencontainers.image.source=https://github.com/tsouza/cerberus"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  - id: cerberus-arm64
    image_templates:
      - "ghcr.io/tsouza/cerberus:{{ .Version }}-arm64"
      - "ghcr.io/tsouza/cerberus:v{{ .Version }}-arm64"
      - "docker.io/tsouza/cerberus:{{ .Version }}-arm64"
      - "docker.io/tsouza/cerberus:v{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.description=Drop-in Prometheus / Loki / Tempo HTTP gateway for ClickHouse"
      - "--label=org.opencontainers.image.url=https://github.com/tsouza/cerberus"
      - "--label=org.opencontainers.image.source=https://github.com/tsouza/cerberus"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  # `latest-*` tags published ONLY for the HIGHEST stable release
  # (RELEASE_IS_LATEST, computed in release.yml: tag == highest stable
  # semver). A prerelease never advances `:latest`, AND a stable BACKPORT
  # (e.g. v1.2.1 cut after v1.3.0) must not drag `:latest` backwards either.
  - id: cerberus-amd64-latest
    image_templates:
      - "ghcr.io/tsouza/cerberus:latest-amd64"
      - "docker.io/tsouza/cerberus:latest-amd64"
    skip_push: '{{ if and (not .Prerelease) (eq .Env.RELEASE_IS_LATEST "true") }}false{{ else }}true{{ end }}'
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.url=https://github.com/tsouza/cerberus"
      - "--label=org.opencontainers.image.source=https://github.com/tsouza/cerberus"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  - id: cerberus-arm64-latest
    image_templates:
      - "ghcr.io/tsouza/cerberus:latest-arm64"
      - "docker.io/tsouza/cerberus:latest-arm64"
    skip_push: '{{ if and (not .Prerelease) (eq .Env.RELEASE_IS_LATEST "true") }}false{{ else }}true{{ end }}'
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.url=https://github.com/tsouza/cerberus"
      - "--label=org.opencontainers.image.source=https://github.com/tsouza/cerberus"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  # Versioned multi-arch manifests — always published.
  - name_template: "ghcr.io/tsouza/cerberus:{{ .Version }}"
    image_templates:
      - "ghcr.io/tsouza/cerberus:{{ .Version }}-amd64"
      - "ghcr.io/tsouza/cerberus:{{ .Version }}-arm64"
  - name_template: "ghcr.io/tsouza/cerberus:v{{ .Version }}"
    image_templates:
      - "ghcr.io/tsouza/cerberus:v{{ .Version }}-amd64"
      - "ghcr.io/tsouza/cerberus:v{{ .Version }}-arm64"
  # `:latest` manifest — only the HIGHEST stable release (RELEASE_IS_LATEST):
  # neither a prerelease nor a stable backport advances the rolling `:latest`.
  - name_template: "ghcr.io/tsouza/cerberus:latest"
    skip_push: '{{ if and (not .Prerelease) (eq .Env.RELEASE_IS_LATEST "true") }}false{{ else }}true{{ end }}'
    image_templates:
      - "ghcr.io/tsouza/cerberus:latest-amd64"
      - "ghcr.io/tsouza/cerberus:latest-arm64"
  # Docker Hub mirrors of the same manifests (same per-arch images, pushed to
  # both registries in one build) — identical tag set and `:latest` gating.
  - name_template: "docker.io/tsouza/cerberus:{{ .Version }}"
    image_templates:
      - "docker.io/tsouza/cerberus:{{ .Version }}-amd64"
      - "docker.io/tsouza/cerberus:{{ .Version }}-arm64"
  - name_template: "docker.io/tsouza/cerberus:v{{ .Version }}"
    image_templates:
      - "docker.io/tsouza/cerberus:v{{ .Version }}-amd64"
      - "docker.io/tsouza/cerberus:v{{ .Version }}-arm64"
  - name_template: "docker.io/tsouza/cerberus:latest"
    skip_push: '{{ if and (not .Prerelease) (eq .Env.RELEASE_IS_LATEST "true") }}false{{ else }}true{{ end }}'
    image_templates:
      - "docker.io/tsouza/cerberus:latest-amd64"
      - "docker.io/tsouza/cerberus:latest-arm64"

release:
  # draft:true so goreleaser creates the GitHub release as a DRAFT (mutable)
  # and can attach the binary archives + checksums to it. The repo has
  # immutable releases enabled, which freezes a release the moment it is
  # PUBLISHED -- so a published release cannot receive assets afterwards
  # (422 "cannot upload assets to an immutable release"). release.yml flips
  # the draft to published in a step AFTER goreleaser + provenance attest, so
  # it is frozen WITH the assets already attached. The tag must be pushed
  # WITHOUT pre-creating a release (push the git tag only, never
  # `gh release create`), or goreleaser would find an already-immutable
  # release and fail the same way.
  draft: true
  prerelease: auto
  github:
    owner: tsouza
    name: cerberus
  header: |
    See [CHANGELOG.md](https://github.com/tsouza/cerberus/blob/main/CHANGELOG.md) for the full list of changes.
  footer: |
    Docker image: `docker pull ghcr.io/tsouza/cerberus:{{.Version}}`
