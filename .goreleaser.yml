version: 2

project_name: cerberus

before:
  hooks:
    - go mod tidy

builds:
  - id: cerberus
    main: ./cmd/cerberus
    binary: cerberus
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: cerberus
    ids:
      - cerberus
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# Homebrew formula published to the tsouza/homebrew-tap tap, so operators can
# `brew install tsouza/tap/cerberus`. The tap holds ONE cerberus formula, so
# only stable releases on the newest line write it — see skip_upload below. The
# cross-repo push needs a PAT (the default GITHUB_TOKEN cannot push to another
# repo); it is supplied by the HOMEBREW_TAP_GITHUB_TOKEN secret in release.yml.
#
# We use `brews:` (a Homebrew FORMULA), not `homebrew_casks:`, on purpose:
# goreleaser is nudging toward casks, but casks are macOS-only, and cerberus is
# a Linux-first server binary — a formula installs on both Linuxbrew and macOS.
brews:
  - name: cerberus
    ids:
      - cerberus
    repository:
      owner: tsouza
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Homebrew resolves a tap's formulae from `Formula/`, `HomebrewFormula/`,
    # or the tap root, in that order — but goreleaser's `directory` defaults to
    # EMPTY, i.e. the tap root, so v1.12.0 shipped `cerberus.rb` to the root.
    # `Formula/` is the conventional layout, it is what `brew-smoke.mjs` pins
    # (`TAP_FORMULA_PATH`), and it is the only one of the three that is not at
    # risk from Homebrew's ongoing push to standardise tap layout. Pin it.
    directory: Formula
    homepage: "https://github.com/tsouza/cerberus"
    description: "Drop-in Prometheus / Loki / Tempo HTTP gateway for ClickHouse"
    license: "Apache-2.0"
    # `auto` on its own only keeps PRERELEASES out of the tap. A stable
    # BACKPORT is not a prerelease, so `auto` alone let v1.12.1 — cut after
    # v1.13.0 — write the tap formula and DOWNGRADE every `brew install` to the
    # older line. Gate on RELEASE_IS_LATEST too (release.yml computes it from
    # the highest stable tag, the same signal the rolling `:latest` images use),
    # so only the newest release line ever owns the formula. `skip_upload` is
    # templated in goreleaser's run phase and read back at publish time.
    skip_upload: '{{ if eq .Env.RELEASE_IS_LATEST "true" }}auto{{ else }}true{{ end }}'
    install: |
      bin.install "cerberus"
    test: |
      system "#{bin}/cerberus", "--version"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{.ShortCommit}}"

changelog:
  use: github-native

# Registry operations retry rather than failing the release on one slow
# response. Stated rather than inherited -- these ARE goreleaser's defaults, but
# "a transient registry timeout stopped the release one step short of shipping"
# is a failure mode this repo has already been bitten by, so the retry belongs
# where someone reading the publish config will see it.
retry:
  attempts: 10
  delay: 10s
  max_delay: 5m

# One entry replaces the four `dockers` blocks and six `docker_manifests`
# blocks this used to be. `dockers_v2` drives `docker buildx` directly, so the
# multi-arch manifest is a product of listing `platforms` rather than a second
# section that has to be kept in sync with the per-arch image names by hand.
#
# The per-arch `:{{ .Version }}-amd64` / `-arm64` tags the old shape published
# are gone. They existed only as manifest inputs — nothing in this repo, the
# chart, or the docs ever pulled one.
#
# Tagged both `{{ .Version }}` (e.g. `1.0.0-RC1`, the goreleaser convention)
# and `v{{ .Version }}` (e.g. `v1.0.0-RC1`, the SemVer-with-`v` convention many
# ops tools default to). Both registries get the identical tag set.
dockers_v2:
  - id: cerberus
    ids:
      - cerberus
    dockerfile: Dockerfile
    images:
      - ghcr.io/tsouza/cerberus
      - docker.io/tsouza/cerberus
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "v{{ .Version }}"
      # `:latest` moves ONLY for the HIGHEST stable release (RELEASE_IS_LATEST,
      # computed in release.yml: tag == highest stable semver). A prerelease
      # never advances it, AND a stable BACKPORT (e.g. v1.2.1 cut after v1.3.0)
      # must not drag it backwards either. An empty tag is dropped, which is how
      # dockers_v2 spells the conditional push the old `skip_push` did.
      - '{{ if and (not .Prerelease) (eq .Env.RELEASE_IS_LATEST "true") }}latest{{ end }}'
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Drop-in Prometheus / Loki / Tempo HTTP gateway for ClickHouse"
      org.opencontainers.image.url: "https://github.com/tsouza/cerberus"
      org.opencontainers.image.source: "https://github.com/tsouza/cerberus"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "Apache-2.0"
    # buildx attaches an SBOM attestation to the index. New with this shape --
    # the old `dockers` blocks published none -- and it costs nothing: no extra
    # secret, no extra tool, and it pairs with the binaries' SLSA provenance.
    sbom: true

release:
  # draft:true so goreleaser creates the GitHub release as a DRAFT (mutable)
  # and can attach the binary archives + checksums to it. The repo has
  # immutable releases enabled, which freezes a release the moment it is
  # PUBLISHED -- so a published release cannot receive assets afterwards
  # (422 "cannot upload assets to an immutable release"). release.yml flips
  # the draft to published in a step AFTER goreleaser + provenance attest, so
  # it is frozen WITH the assets already attached. The tag must be pushed
  # WITHOUT pre-creating a release (push the git tag only, never
  # `gh release create`), or goreleaser would find an already-immutable
  # release and fail the same way.
  draft: true
  prerelease: auto
  github:
    owner: tsouza
    name: cerberus
  header: |
    See [CHANGELOG.md](https://github.com/tsouza/cerberus/blob/main/CHANGELOG.md) for the full list of changes.
  footer: |
    Docker image: `docker pull ghcr.io/tsouza/cerberus:{{.Version}}`
