# Tier-2 ruler substrate for the migration lane (Layer 14). Extends the
# Tier-1 dual-backend stack (../tier1-dual/docker-compose.dual.yml) — always
# invoked alongside it via `-f`, never standalone, the same multi-file merge
# `docker-compose.dual.yml` itself documents:
#
#   docker compose -f tiers/tier1-dual/docker-compose.dual.yml \
#                   -f tiers/tier2-ruler/docker-compose.ruler.yml up --wait
#
# No `name:` here on purpose: leaving it unset keeps the merged project on
# Tier-1's `cerberus-migration-tier1` name, so these two new services join
# the SAME default network as cerberus/clickhouse/prometheus/etc. instead of
# minting a second, disconnected compose project.
#
# Adds the "real query-only external ruler" docs/migration-testing.md
# section 3 describes for Tier 2 — here, Grafana-managed alerting rather
# than a Prometheus/Thanos ruler — plus the dead-end receiver its one
# contact point points at:
#
#   grafana             Evaluates the rule fixture (kube-prometheus-stack's
#                        recording rule + NodeCPUSaturation alert, reused
#                        verbatim — see grafana/alerting/rules.yaml) against
#                        cerberus's Prometheus head over the shared network.
#   dead-end-receiver    Grafana's one contact point. Logs every notification
#                        to a file and answers 200; never forwards anywhere.
#
# Port band: 27400-27500, the next contiguous unclaimed band after Tier-1's
# own 27000-27400 (see docker-compose.dual.yml's port-band comment).
#
# Usage:
#   just migration-tier2-up
#   just migration-tier2-run
#   just migration-tier2-down

services:
  grafana:
    image: grafana/grafana:12.2.9
    environment:
      # Anonymous-Admin so the substrate self-check and any future MIG-09/13/
      # 18/19/24 scenario can call Grafana's provisioning + alerting APIs
      # without a login flow — same posture as the repo-root compose
      # quickstart's Grafana service.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Recording rules are opt-in even with unified alerting on by default;
      # without this, the `record:` field in rules.yaml provisioning is
      # rejected. See grafana/alerting/rules.yaml for why its write-back leg
      # still errors in this substrate regardless.
      GF_UNIFIED_ALERTING_RECORDING_RULES_ENABLED: "true"
    volumes:
      # Relative to tier1-dual/docker-compose.dual.yml's directory, NOT this
      # file's own: `docker compose -f a -f b` resolves every relative host
      # path in every merged file against the FIRST `-f` file's directory —
      # confirmed via `docker inspect`'s Mounts.Source on a real run, where a
      # naïve `./grafana/...` here silently bound tier1-dual/grafana/... (a
      # directory that does not exist) instead of this directory.
      - ../tier2-ruler/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../tier2-ruler/grafana/alerting:/etc/grafana/provisioning/alerting:ro
    ports:
      - "27400:3000"
    depends_on:
      cerberus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 24

  dead-end-receiver:
    image: cerberus-migration-tier2:dead-end-receiver
    pull_policy: build
    build:
      # Also resolved against tier1-dual's directory (see the grafana
      # volumes comment above), which is why this is five `../` rather than
      # this file's own depth from the repo root — tier1-dual and
      # tier2-ruler sit at the same depth under tiers/, so the count happens
      # to be identical either way. Don't "simplify" this without re-checking
      # docker inspect if tier2-ruler ever moves to a different depth.
      context: ../../../../..
      dockerfile: test/e2e/migration/tiers/tier2-ruler/receiver/Dockerfile
    ports:
      - "27450:8090"
    healthcheck:
      # Distroless image: no shell, no wget. The binary's own -healthcheck
      # mode is the liveness signal, same posture as cerberus's --version
      # healthcheck in docker-compose.dual.yml.
      test: ["CMD", "/dead-end-receiver", "-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
