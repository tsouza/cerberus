# Grafana unified-alerting-as-code rule provisioning for the Tier-2 ruler
# substrate (Layer 14) — the "real query-only external ruler" pointed at
# cerberus's HTTP API that section 3 of docs/migration-testing.md describes.
#
# The rule fixture is NOT invented here: both groups below reuse, verbatim,
# the kube-prometheus-stack archetype's colon-named recording rule and its
# NodeCPUSaturation alert (test/e2e/migration/archetypes/kube-prometheus-stack/
# rules/node-recording.yaml and node-alerts.yaml) — the shape MIG-09's story
# wants, and the one NodeCPUSaturation's `expr` actually depends on. Keep the
# `expr`/`for`/threshold fields byte-identical to those two files if either
# changes; only the Grafana-specific scheduling wrapper (`data`, `condition`,
# `record.metric`) is new here.
#
# `interval: 10s` is a scheduling knob, not part of "the rule" — it is tuned
# down from a production-realistic 1m so the substrate self-check (which
# polls this group's live evaluation health) doesn't have to wait a full
# minute for the first tick. 10s, not some other short value, because
# Grafana rejects any group interval that isn't an exact multiple of the
# scheduler's own base interval (10s, unconfigured here) — confirmed the hard
# way: 15s made the whole provisioning service fail to start with "interval
# (15s) should be non-zero and divided exactly by scheduler interval: 10".
#
# The recording rule's query leg runs for real against cerberus (proving
# "Grafana evaluates the rule against cerberus"), via query-write-fanout
# (../../docker-compose.ruler.yml) rather than dialing cerberus directly —
# see that file's own comment for why. The SAME datasourceUid also carries
# the write-back leg (a Grafana recording rule always writes to the
# datasource it queried), which the fanout routes to write-relay instead —
# cerberus, a query-only gateway, implements no remote-write receiver, and
# never will inside this substrate. write-relay is a plain Prometheus with
# only its remote-write receiver enabled (../../write-relay/prometheus.yml);
# the otel-collector then federates that one series back out of it into
# ClickHouse (../../tier1-dual/otel-collector-config.yaml's
# `prometheus/write_relay` receiver), which is how
# `node:node_cpu_utilisation:avg1m` becomes a real series cerberus reads
# back — MIG-09's "lands recording-rule output back into CH; those recorded
# series become selectable through cerberus" — without cerberus ever
# accepting a write itself. NodeCPUSaturation's own query against
# `node:node_cpu_utilisation:avg1m` answers `nodata` for the first few
# evaluations after a fresh stack comes up (the recording rule's own write,
# the federate scrape, and the clickhouse insert all need at least one tick
# each to land the series) and `ok`/no-alert once it has.
apiVersion: 1
groups:
  - orgId: 1
    name: node.rules
    folder: kube-prometheus-stack
    interval: 10s
    rules:
      - uid: node-cpu-utilisation-avg1m
        title: "node:node_cpu_utilisation:avg1m"
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: cerberus-prometheus
            model:
              expr: 1 - avg without (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
              instant: true
              refId: A
        record:
          metric: "node:node_cpu_utilisation:avg1m"
          from: A
          # No target_datasource_uid: the file-provisioning YAML schema on
          # this Grafana version silently drops that field rather than
          # honoring it (confirmed empirically — see docker-compose.ruler.yml's
          # query-write-fanout comment), so this rule relies on Grafana's
          # ordinary behaviour of writing back to the same datasourceUid it
          # queried, and query-write-fanout is what makes that land
          # somewhere real instead of 404ing on cerberus.

  - orgId: 1
    name: node.alerts
    folder: kube-prometheus-stack
    interval: 10s
    rules:
      - uid: node-cpu-saturation
        title: NodeCPUSaturation
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: cerberus-prometheus
            model:
              expr: "node:node_cpu_utilisation:avg1m"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Node CPU saturation" }
        noDataState: NoData
        execErrState: Error
