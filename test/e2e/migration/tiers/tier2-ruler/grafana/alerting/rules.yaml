# Grafana unified-alerting-as-code rule provisioning for the Tier-2 ruler
# substrate (Layer 14) — the "real query-only external ruler" pointed at
# cerberus's HTTP API that section 3 of docs/migration-testing.md describes.
#
# The rule fixture is NOT invented here: both groups below reuse, verbatim,
# the kube-prometheus-stack archetype's colon-named recording rule and its
# NodeCPUSaturation alert (test/e2e/migration/archetypes/kube-prometheus-stack/
# rules/node-recording.yaml and node-alerts.yaml) — the shape MIG-09's story
# wants, and the one NodeCPUSaturation's `expr` actually depends on. Keep the
# `expr`/`for`/threshold fields byte-identical to those two files if either
# changes; only the Grafana-specific scheduling wrapper (`data`, `condition`,
# `record.metric`) is new here.
#
# `interval: 10s` is a scheduling knob, not part of "the rule" — it is tuned
# down from a production-realistic 1m so the substrate self-check (which
# polls this group's live evaluation health) doesn't have to wait a full
# minute for the first tick. 10s, not some other short value, because
# Grafana rejects any group interval that isn't an exact multiple of the
# scheduler's own base interval (10s, unconfigured here) — confirmed the hard
# way: 15s made the whole provisioning service fail to start with "interval
# (15s) should be non-zero and divided exactly by scheduler interval: 10".
#
# The recording rule's query leg runs for real against cerberus (proving
# "Grafana evaluates the rule against cerberus"). Its write-back leg writes
# to the Cerberus-RemoteWrite datasource
# (GF_RECORDING_RULES_DEFAULT_DATASOURCE_UID in docker-compose.ruler.yml —
# Grafana's recording-rule schema has no per-rule write-target field, so the
# target is set instance-wide, not here) rather than the SAME datasource this
# rule queries: cerberus, a query-only gateway, implements no remote-write
# receiver, so the write leg is bridged through relay-prom +
# otel-collector-writeback into the SAME ClickHouse database instead (see
# docker-compose.ruler.yml's header comment for the full path). Once landed,
# `node:node_cpu_utilisation:avg1m` IS selectable through cerberus —
# MIG-13/MIG-19 assert exactly that.
apiVersion: 1
groups:
  - orgId: 1
    name: node.rules
    folder: kube-prometheus-stack
    interval: 10s
    rules:
      - uid: node-cpu-utilisation-avg1m
        title: "node:node_cpu_utilisation:avg1m"
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: cerberus-prometheus
            model:
              expr: 1 - avg without (cpu) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
              instant: true
              refId: A
        record:
          metric: "node:node_cpu_utilisation:avg1m"
          from: A

  - orgId: 1
    name: node.alerts
    folder: kube-prometheus-stack
    interval: 10s
    rules:
      - uid: node-cpu-saturation
        title: NodeCPUSaturation
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: cerberus-prometheus
            model:
              expr: "node:node_cpu_utilisation:avg1m"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Node CPU saturation" }
        noDataState: NoData
        execErrState: Error
