# Helm values OVERLAY for the bundled-ClickHouse REPLICATED e2e lane
# (cerberus issue #3566). Layered ON TOP of cerberus-values.yaml by
# `just e2e-bwc-replicated-up`:
#
#   helm upgrade --install cerberus deploy/helm/cerberus \
#     --values test/e2e/k3s/cerberus-values.yaml \
#     --values test/e2e/k3s/cerberus-values-bwc-replicated.yaml
#
# This is the chart's SUPPORTED replication path — `clickhouse.bundled.replicas
# > 1` at the default `dataShards.count: 1` — which the `cerberus.bundled.apply`
# defaulting turns into: a Keeper ensemble, a two-pod ClickHouse StatefulSet,
# `schema.replicated.enabled: true` and a defaulted
# `schema.replicated.zookeeperPath`, so cerberus creates the `otel` database
# with `ENGINE = Replicated(...)` and every table as `ReplicatedMergeTree`.
# Nothing here pins the Keeper path or the replicated flag on purpose: the lane
# exists to prove the chart's OWN defaults replicate, and
# `.github/scripts/e2e-bwc-replicated-verify.mjs` asserts that from
# `system.tables` / `system.replicas` on EACH pod plus a row written through one
# replica and read back from the other.
#
# It is a different topology from the `datashard-replica-affinity` leg
# (`dataShards.count=2`, `replicas=2`): that one is the EXPERIMENTAL
# multi-shard path, where the chart defaults the classic
# `ReplicatedMergeTree(path, '{replica}')` engine under an ON CLUSTER
# database. This lane is the Replicated-DATABASE path a single-shard
# `replicas: 2` deployment gets, and no other lane stands it up.
#
# STORAGE MODE: hot-only (hotVolume.enabled=true, objectStorage.enabled=false),
# the same no-MinIO shape the `datashard` lane runs — replication is the axis
# under test, not tiering, and the object-store scenarios already have the
# `bwc-minio` matrix. schema.ttl is REQUIRED in hot-only mode (render-time fail
# otherwise); 7d matches the other hot-only overlays.
clickhouse:
  bundled:
    enabled: true
    # The chart's own bundled pin (deploy/helm/cerberus/values.yaml tracks
    # versions.yaml `quickstart_clickhouse`), so this lane deploys exactly the
    # server a default `replicas: 2` install gets. Imported into k3d by
    # `just e2e-bwc-replicated-up` (E2E_BUNDLED_CH_IMAGES in just/e2e.just);
    # the chart maps the CH container's pullPolicy to .Values.image.pullPolicy,
    # which cerberus-values.yaml pins to Never, so the exact tag MUST be in the
    # cluster's containerd.
    image: clickhouse/clickhouse-server:26.6
    replicas: 2
    # Recommended for any `replicas > 1` deployment (values.yaml's own
    # `interserverSecret` doc: replica forwarding has the same exposure as
    # cross-shard forwarding), so the lane runs the configuration the chart
    # recommends rather than the one it merely tolerates.
    interserverSecret: e2e-bwc-replicated-interserver
    hotVolume:
      enabled: true
    objectStorage:
      enabled: false

    # Sized for two ClickHouse pods + the 3-node Keeper ensemble `replicas > 1`
    # auto-enables sharing one throwaway k3d node with cerberus. Same per-pod
    # footprint as the datashard lane, whose N=4 leg runs four of these
    # alongside the full fixture set.
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi
    persistence:
      size: 3Gi
    cache:
      size: 1Gi

# The base overlay enables the HPA (2..4 replicas). One cerberus pod is all
# this lane needs: cerberus's job here is to boot, auto-create the schema
# through the bundled Service, and report ready — the verifier talks to the
# ClickHouse pods directly, never to cerberus.
autoscaling:
  enabled: false
replicaCount: 1

schema:
  ttl: "7d"
